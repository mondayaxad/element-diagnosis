<!DOCTYPE html>
<html lang="ja">
<head>
<!-- GA4：js/ga.js が本番ドメインでだけ読み込む（Preview・ローカルでは送信しない） -->
<script src="/js/ga.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>タイプ別レポート — 元素診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* 結果ページ（index.html の --rx-*・統一CTA）と同じ文字色・書体・ボタン */
  :root { --rx-primary:#E8F1F8; --rx-secondary:#A9C2D3; --rx-tertiary:#718A9C; --rx-gold:#C9A860; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#07070f; color:#e0dcf0; font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif; -webkit-font-smoothing:antialiased; max-width:560px; margin:0 auto; padding:28px 16px 64px; line-height:1.9; }
  .card { background:linear-gradient(135deg, rgba(200,168,96,.08), #08101a); border:1px solid #1c2c40; border-radius:14px; padding:26px 22px; text-align:center; }
  .k { font-size:10px; color:#c0a860; letter-spacing:2px; margin-bottom:10px; }
  h1 { color:var(--rx-primary); font-size:18px; letter-spacing:1px; line-height:1.6; margin-bottom:10px; }
  p { color:var(--rx-secondary); font-size:12.5px; line-height:1.9; }
  .btn { display:block; width:100%; margin-top:18px; min-height:48px; padding:14px; border:none; border-radius:8px; background:linear-gradient(90deg,#c84a20,#9060d0); color:#fff; font-family:inherit; font-size:14px; letter-spacing:2px; font-weight:600; text-decoration:none; cursor:pointer; }
  .save { margin-top:18px; text-align:left; background:#0c0a14; border:1px solid #182838; border-radius:10px; padding:14px 16px; }
  .save .t { font-size:11px; color:var(--rx-gold); letter-spacing:2px; margin-bottom:6px; }
  .save p { font-size:12px; }
  .copy { margin-top:10px; min-height:44px; width:100%; border-radius:8px; border:1px solid #2a3a50; background:transparent; color:var(--rx-primary); font-family:inherit; font-size:13px; letter-spacing:1px; cursor:pointer; }
  .note { margin-top:14px; font-size:11px; color:var(--rx-tertiary); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <main class="card" id="box" aria-live="polite">
    <div class="k">TYPE REPORT</div>
    <h1 id="title">購入したタイプ別レポート</h1>
    <p id="msg">お支払いを確認しています…</p>
    <a class="btn" id="open" href="#" hidden>レポートを開く →</a>
    <div class="save" id="save" hidden>
      <div class="t">このページのリンクを保存してください</div>
      <p>このページのリンク（URL）から、いつでもレポートを開けます。リンク自体に通常の有効期限はありません。ブックマークやメモに保存してください。</p>
      <button type="button" class="copy" id="copy">リンクをコピーする</button>
    </div>
    <p class="note">ご不明点があれば yaduns0522@gmail.com までご連絡ください。</p>
  </main>
<script>
// タイプ別レポートの固有リンク（/type-report#t=<秘密値>）。秘密値はフラグメント（サーバーへ送られない）から読み、
//   POST /api/type-report?op=link-open で注文の状態を確かめる。支払い済みなら、レポート（report.html）を開く 15 分のリンクを受け取る。
//   支払いの確認がまだ（Webhook の前）は、少し待って確かめ直す。
(function () {
  'use strict';
  var m = /(?:^#|&)t=([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash || '');
  var $ = function (id) { return document.getElementById(id); };
  function show(title, msg) { $('title').textContent = title; $('msg').textContent = msg; }
  if (!m) { show('リンクが正しくありません', '購入後に表示されたリンク（URL）から開いてください。'); return; }
  var token = m[1];
  var tries = 0;
  $('copy').addEventListener('click', function () {
    var b = this;
    try { navigator.clipboard.writeText(location.href).then(function () { b.textContent = 'コピーしました'; }); } catch (e) { b.textContent = 'アドレスバーのURLを保存してください'; }
  });
  function check() {
    tries++;
    fetch('/api/type-report?op=link-open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }), cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (r) {
        var b = r.body || {};
        if (r.status === 200 && b.state === 'paid' && typeof b.reportUrl === 'string' && b.reportUrl.indexOf('/report.html?token=') === 0) {
          show('タイプ別レポート「' + (b.typeName || '') + '」', (b.purchasedOn ? b.purchasedOn + ' にご購入いただいた' : 'ご購入いただいた') + 'レポートをお読みいただけます。');
          var a = $('open'); a.href = b.reportUrl; a.hidden = false; $('save').hidden = false;
          return;
        }
        if (r.status === 200 && b.state === 'pending') {
          if (tries < 10) { show('お支払いを確認しています', '確認が済むと、自動でレポートを開けるようになります。'); setTimeout(check, 3000); return; }
          show('お支払いの確認に時間がかかっています', 'しばらくしてから、このページを開き直してください。お支払いが済んでいれば、同じリンクからお読みいただけます。');
          $('save').hidden = false;
          return;
        }
        if (r.status === 200 && b.state === 'unavailable') { show('このレポートはご覧いただけません', 'お支払いが完了していないか、返金・取消などの手続きが行われたリンクです。'); return; }
        if (r.status === 404) { show('リンクが見つかりません', '購入後に表示されたリンク（URL）から開いてください。'); return; }
        show('いまは開けませんでした', '少し時間をおいて、このページを開き直してください。');
      })
      .catch(function () { show('いまは開けませんでした', '通信を確認して、このページを開き直してください。'); });
  }
  check();
})();
</script>
</body>
</html>
