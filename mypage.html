<!-- Google tag (gtag.js)
     【Preview版：GA4送信を無効化】本番Measurement IDへPreview操作が混入しないよう、
     外部スクリプトの読込とgtag('config', ...)による送信を止める。
     既存コードが呼ぶgtag()自体はno-opとして残し、ReferenceErrorにしない。
     本番反映時は、このコメントブロックを元のGA4読込へ戻すこと。 -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {} // Preview版：no-op。本番反映時に実装へ戻す。
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07070f;
    --fg: #e0dcf0;
    --fg-dim: #6a6485;
    --accent: #7ab8e8;
    --accent-dim: #2a5878;
    --card-bg: #100e1c;
    --card-border: #241f3a;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 100px; }

  .eyebrow {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--accent);
    opacity: 0.8;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 8px 0 6px;
    letter-spacing: 1px;
  }
  .sub {
    font-size: 13px;
    color: var(--fg-dim);
    margin-bottom: 40px;
    line-height: 1.8;
  }
  .top-link {
    display: inline-block;
    font-size: 11.5px;
    color: var(--fg-dim);
    text-decoration: none;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 2px;
  }
  .top-link:hover { color: var(--accent); }

  /* ---- ログインゲート ---- */
  .gate {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 36px 28px;
    text-align: center;
  }
  .gate p {
    font-size: 13px;
    line-height: 1.9;
    color: var(--fg-dim);
    margin-bottom: 24px;
  }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: #fff;
    color: #1a1a2e;
    border: none;
    border-radius: 4px;
    padding: 13px;
    font-size: 13.5px;
    font-family: 'Noto Serif JP', serif;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--fg-dim);
    font-size: 11px;
    margin: 18px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }
  .email-row {
    display: flex;
    gap: 8px;
  }
  .email-row input {
    flex: 1;
    background: #0a0916;
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 11px 12px;
    color: var(--fg);
    font-size: 13px;
    font-family: inherit;
  }
  .email-row input:focus { outline: 1px solid var(--accent); }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    border-radius: 4px;
    padding: 11px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .gate-msg {
    font-size: 11.5px;
    color: var(--accent);
    margin-top: 14px;
    min-height: 16px;
  }

  /* ---- 履歴リスト ---- */
  .session-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--el-color, var(--accent-dim));
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .session-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .session-date {
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.5px;
  }
  .session-combo {
    font-size: 16px;
    font-weight: 700;
    margin-top: 6px;
  }
  .session-combo .el { color: var(--el-color, var(--accent)); }
  .session-sub {
    font-size: 11.5px;
    color: var(--fg-dim);
    margin-top: 4px;
  }
  .session-toggle {
    font-size: 11px;
    color: var(--fg-dim);
  }
  .session-detail {
    display: none;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--card-border);
  }
  .session-detail.open { display: block; }
  .detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .detail-row .k { color: var(--fg-dim); }
  .char-line {
    font-size: 12.5px;
    padding: 4px 0;
    color: var(--fg);
  }
  .char-line .pct { color: var(--accent); }

  .empty, .loading, .err {
    text-align: center;
    color: var(--fg-dim);
    font-size: 13px;
    padding: 60px 20px;
    line-height: 1.9;
  }
  .err { color: #d88; }

  .page-title { font-size: 20px; font-weight: 700; margin: 8px 0 24px; letter-spacing: 1px; }

  /* ---- Hero / ELEMENT PROFILE ---- */
  .hero {
    background: linear-gradient(135deg, var(--el-color, var(--accent-dim))22, var(--card-bg));
    border: 1px solid var(--el-color, var(--accent-dim));
    border-radius: 10px;
    padding: 30px 24px;
    margin-bottom: 26px;
  }
  .hero-eyebrow {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    opacity: 0.6;
    margin-bottom: 8px;
  }
  .hero-title { font-size: 12px; font-weight: 700; color: var(--fg-dim); margin-bottom: 2px; opacity: 0.8; }
  .hero-date { font-size: 10px; color: var(--fg-dim); opacity: 0.7; margin-bottom: 18px; }
  .hero-combo { font-size: 38px; font-weight: 800; line-height: 1.1; margin-bottom: 8px; letter-spacing: 0.5px; }
  .hero-combo .el { color: var(--el-color, var(--accent)); }
  .hero-sub { font-size: 12.5px; color: var(--fg-dim); margin-bottom: 22px; }
  .hero-stats { display: flex; gap: 28px; margin-bottom: 22px; }
  .hero-stat-num { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1; }
  .hero-stat-label { font-size: 10px; color: var(--fg-dim); margin-top: 4px; }
  .hero-cta-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-btn {
    flex: 1; min-width: 140px; text-align: center; padding: 11px; border-radius: 6px;
    font-size: 12.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: none;
  }
  .hero-btn-primary { background: var(--accent); color: #0a0916; }
  .hero-btn-secondary { background: transparent; border: 1px solid var(--accent-dim); color: var(--accent); }

  /* ---- サマリー ---- */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .summary-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; padding: 14px; }
  .summary-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 9px; }
  .summary-body { font-size: 12.5px; line-height: 1.75; color: var(--fg); }
  .summary-body .sub { font-size: 10.5px; color: var(--fg-dim); margin: 0; }

  .section-title { font-size: 11.5px; letter-spacing: 2px; color: var(--fg-dim); text-transform: uppercase; margin: 0 0 12px; }

  .badge-new {
    display: inline-block; background: var(--accent); color: #0a0916; font-size: 9px; font-weight: 700;
    padding: 2px 7px; border-radius: 10px; margin-left: 6px; letter-spacing: 0.5px; vertical-align: middle;
  }
  .badge-unlocked { color: #90c8f0; }
  .badge-locked { color: var(--fg-dim); }

  /* ---- 履歴（セッションごとのアコーディオン） ---- */
  .session-acc {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--el-color, var(--accent-dim));
    border-radius: 4px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .session-acc summary {
    padding: 16px 18px;
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .session-acc summary::-webkit-details-marker { display: none; }
  .session-acc summary::after { content: '詳細を見る ▾'; font-size: 11px; color: var(--fg-dim); white-space: nowrap; }
  .session-acc[open] summary::after { content: '閉じる ▴'; }
  .session-date { font-size: 11px; color: var(--fg-dim); letter-spacing: 0.5px; }
  .session-combo { font-size: 16px; font-weight: 700; margin-top: 6px; }
  .session-combo .el { color: var(--el-color, var(--accent)); }
  .session-body { padding: 0 18px 18px; border-top: 1px solid var(--card-border); }
  .session-body-inner { padding-top: 16px; }

  /* ---- 履歴の蓄積感（縦タイムライン） ---- */
  .history-timeline { position: relative; padding-left: 16px; }
  .history-timeline::before {
    content: ''; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px; background: var(--card-border);
  }
  .timeline-item { position: relative; margin-bottom: 12px; }
  .timeline-dot {
    position: absolute; left: -16px; top: 22px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--el-color, var(--accent)); border: 2px solid var(--bg); z-index: 1;
  }

  /* ---- 詳細データ内アコーディオン ---- */
  details.acc {
    background: #0a0916; border: 1px solid #2a5878; border-radius: 6px; margin-bottom: 10px; overflow: hidden;
  }
  details.acc summary {
    padding: 11px 14px; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
  }
  details.acc summary::-webkit-details-marker { display: none; }
  details.acc summary::after { content: '▾'; font-size: 9px; color: var(--fg-dim); }
  details.acc[open] summary::after { content: '▴'; }
  details.acc .acc-body { padding: 0 14px 14px; }

  .lock-box { background: #0a0916; border: 1px solid var(--card-border); border-radius: 6px; padding: 16px; }
  .lock-list { list-style: none; margin: 0 0 14px; padding: 0; }
  .lock-list li { font-size: 12px; color: var(--fg-dim); padding: 4px 0; }
  .lock-cta-btn {
    display: block; text-align: center; background: #7ab8e8; color: #0a0916; font-size: 12.5px;
    font-weight: 700; padding: 11px; border-radius: 4px; text-decoration: none;
    width: 100%; border: none; cursor: pointer; font-family: inherit;
  }
  .report-open-error { color: #d88; font-size: 11px; line-height: 1.7; margin-top: 8px; }
  .view-on-site-link {
    display: inline-block; font-size: 11.5px; color: var(--accent); text-decoration: none;
    margin-bottom: 16px; border-bottom: 1px dotted var(--accent-dim); padding-bottom: 1px;
  }

  /* ---- 次の一歩 ---- */
  .next-steps { margin-top: 8px; }
  .next-steps-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .next-btn {
    flex: 1; min-width: 160px; text-align: center; padding: 12px; border-radius: 6px;
    font-size: 12.5px; font-weight: 700; cursor: pointer; text-decoration: none;
    background: transparent; border: 1px solid var(--accent-dim); color: var(--accent);
  }
  .next-btn-primary { background: var(--accent); color: #0a0916; border: none; }
  .coming-soon {
    background: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 6px;
    padding: 14px; text-align: center; color: var(--fg-dim); font-size: 11px; letter-spacing: 1px;
  }
  .newsletter-note { text-align: center; color: var(--fg-dim); font-size: 10.5px; margin-top: 12px; }

  /* ============================================================
     MY ARCHIVE（マイページ最終仕様）追加スタイル
     既存のトークン（--bg/--fg/--fg-dim/--accent/--card-bg/--card-border）のみ使用。
     ============================================================ */
  .mp-sec { margin-top: 34px; }
  .mp-sec-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .mp-sec-en { font-family: 'IM Fell English', serif; font-size: 12px; letter-spacing: 2px; color: var(--fg); text-transform: uppercase; }
  .mp-sec-ja { font-size: 11px; color: var(--fg-dim); }
  .mp-sec-ja::before { content: '｜'; margin-right: 4px; opacity: .6; }

  /* ---- MY ARCHIVE ---- */
  .mp-archive-eyebrow { font-family: 'IM Fell English', serif; font-size: 11px; letter-spacing: 3px; color: var(--fg-dim); }
  .mp-archive-title { font-size: 26px; font-weight: 700; letter-spacing: .08em; margin: 4px 0 6px; color: #f0e8ff; }
  .mp-archive-desc { font-size: 12px; color: var(--fg-dim); line-height: 1.8; }
  .mp-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; border: 1px solid var(--card-border); border-radius: 8px; background: var(--card-bg); }
  .mp-stat { padding: 12px 10px; text-align: center; }
  .mp-stat + .mp-stat { border-left: 1px solid var(--card-border); }
  .mp-stat-top { display: flex; justify-content: center; align-items: baseline; gap: 12px; }
  .mp-stat-en { font-family: 'IM Fell English', serif; font-size: 11px; letter-spacing: 1.5px; color: var(--fg); }
  .mp-stat-num { font-family: 'IM Fell English', serif; font-size: 26px; color: var(--accent); }
  .mp-stat-ja { font-size: 10.5px; color: var(--fg-dim); margin-top: 2px; }

  /* ---- 記録章（エンブレム） ---- */
  .mp-emblem { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; color: var(--c, #7ab8e8); }
  .mp-emblem::before { content: ''; position: absolute; inset: 7px; border: 1px solid var(--c, #7ab8e8); transform: rotate(45deg); opacity: .45; border-radius: 3px; }
  .mp-emblem svg { position: relative; width: 30px; height: 30px; }
  .mp-emblem.lg { width: 76px; height: 76px; }
  .mp-emblem.lg svg { width: 40px; height: 40px; }

  /* ---- LATEST RESULT ---- */
  .mp-latest { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; }
  .mp-latest-main { display: flex; gap: 14px; align-items: flex-start; }
  .mp-latest-info { flex: 1; min-width: 0; }
  .mp-chip-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mp-chip { font-size: 10px; letter-spacing: 1px; border: 1px solid var(--card-border); border-radius: 4px; padding: 1px 7px; color: var(--fg-dim); }
  .mp-chip.new { background: var(--accent-dim); border-color: var(--accent); color: #e0f4ff; }
  .mp-chip.insight { border-color: #c0a860; color: #c0a860; }
  .mp-chip.legacy { border-style: dashed; }
  .mp-latest-code { font-size: 12px; color: var(--fg-dim); margin-top: 6px; letter-spacing: 1px; }
  .mp-latest-code b { color: var(--fg); font-weight: 700; margin-right: 8px; }
  .mp-latest-combo { font-size: 18px; font-weight: 700; margin-top: 2px; line-height: 1.5; }
  .mp-latest-mirror { font-size: 12px; color: var(--fg-dim); margin-top: 2px; }
  .mp-btn-row { display: flex; gap: 8px; margin-top: 14px; }
  .mp-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 10px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer; text-decoration: none; font-family: inherit; border: 1px solid var(--accent-dim); background: transparent; color: var(--accent); }
  .mp-btn.primary { background: linear-gradient(135deg, #1a4a78, #2a6a9a); border-color: #2a6a9a; color: #e0f4ff; }
  .mp-btn.full { width: 100%; flex: none; }
  .mp-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .mp-notice { margin-top: 14px; padding: 12px; border: 1px solid var(--card-border); border-radius: 8px; text-align: center; background: rgba(255,255,255,0.01); }
  .mp-notice p { font-size: 11.5px; color: var(--fg-dim); margin-bottom: 8px; }

  /* ---- INSIGHT 要点カード ---- */
  .mp-insight-head { display: flex; align-items: baseline; gap: 6px; margin: 14px 0 8px; font-size: 11px; color: var(--fg-dim); }
  .mp-insight-head b { font-family: 'IM Fell English', serif; letter-spacing: 1.5px; color: #c0a860; border-left: 2px solid #c0a860; padding-left: 6px; }
  .mp-insight-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mp-insight-card { border: 1px solid var(--card-border); border-radius: 6px; padding: 8px; background: rgba(192,168,96,0.03); min-width: 0; }
  .mp-insight-card .t { font-size: 10.5px; color: var(--fg); font-weight: 700; margin-bottom: 4px; }
  .mp-insight-card .v { font-size: 11px; color: var(--fg-dim); line-height: 1.6; word-break: break-word; }
  .mp-insight-card .n { font-size: 9.5px; color: var(--fg-dim); opacity: .7; margin-top: 3px; }

  /* ---- YOUR COLLECTION ---- */
  .mp-collection { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  .mp-badge { flex: 0 0 96px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px 10px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--fg); cursor: pointer; font-family: inherit; }
  .mp-badge .nm { font-size: 13px; font-weight: 700; }
  .mp-badge .dt { font-size: 10px; color: var(--fg-dim); }
  .mp-badge .st { font-size: 9px; letter-spacing: 1.5px; border: 1px solid var(--card-border); border-radius: 3px; padding: 1px 8px; color: var(--fg-dim); margin-top: 2px; }
  .mp-badge.state-record .mp-emblem { opacity: .75; }
  .mp-badge.state-insight { border-color: rgba(192,168,96,0.55); box-shadow: 0 0 14px rgba(192,168,96,0.14), inset 0 0 18px rgba(192,168,96,0.05); }
  .mp-badge.state-insight .st { border-color: #c0a860; color: #c0a860; }
  .mp-badge.state-insight .mp-emblem svg { filter: drop-shadow(0 0 5px var(--c)); }

  /* ---- THE RECORDS ---- */
  .mp-rec { border: 1px solid var(--card-border); border-radius: 8px; background: var(--card-bg); margin-bottom: 8px; overflow: hidden; }
  .mp-rec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 12.5px; }
  .mp-rec > summary::-webkit-details-marker { display: none; }
  .mp-rec > summary .d { color: var(--fg-dim); font-size: 11.5px; flex: 0 0 auto; }
  .mp-rec > summary .c { flex: 1; min-width: 0; }
  .mp-rec > summary .c .el { font-weight: 700; }
  .mp-rec > summary::after { content: '⌄'; color: var(--fg-dim); font-size: 13px; }
  .mp-rec[open] > summary::after { content: '⌃'; }
  .mp-rec-body { padding: 4px 14px 16px; border-top: 1px solid var(--card-border); }
  .mp-free { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 12px; }
  .mp-free-title { font-size: 11px; color: var(--fg); margin-bottom: 4px; }
  .mp-free-list { font-size: 11.5px; color: var(--fg-dim); line-height: 1.8; }
  .mp-free-list b { color: var(--fg); font-weight: 400; }
  .mp-then { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--card-border); font-size: 11.5px; color: var(--fg-dim); line-height: 1.8; }
  .mp-then-title { font-size: 11px; color: var(--fg); margin-bottom: 2px; }

async function openPurchasedReport(diagnosisSessionId, button) {
  if (!diagnosisSessionId || !button) return;
  const originalLabel = button.textContent;
  button.disabled = true;
  button.textContent = 'レポートを準備中…';
  const oldError = button.parentElement && button.parentElement.querySelector('.report-open-error');
  if (oldError) oldError.remove();

  try {
    const { data: { session: authSession } } = await supabaseClient.auth.getSession();
    const accessToken = authSession && authSession.access_token;
    if (!accessToken) throw new Error('not_authenticated');

    const response = await fetch('/api/my-report-link', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ diagnosis_session_id: diagnosisSessionId }),
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok || !body.url) throw new Error(body.error || 'link_issue_failed');

    trackEvent('mypage_report_open', { source: 'purchased_report_button' });
    navigateTo(body.url);
  } catch (err) {
    console.error('purchased report open failed:', err);
    const message = document.createElement('p');
    message.className = 'report-open-error';
    message.textContent = 'レポートを開けませんでした。時間をおいて再度お試しください。';

    button.disabled = false;
    button.textContent = originalLabel;
  }
}

        nation = (v2TopName(r.nation) || {}).name;
        const m = (s.mirrorSnapshot && s.mirrorSnapshot[0]) || null;
        mirror = m ? { name: m.name, match: m.match, el: m.el, w: m.w, nation: m.nation } : null;
        if (s.encodedAnswers) resultUrl = '/?dv=ETI-2.0&code=' + encodeURIComponent(s.encodedAnswers);
      } else {
        const pr = s.primaryResult || {};
        el = pr.element; w = pr.weapon; nation = pr.nation;
        const m = (s.characterMatches && s.characterMatches[0]) || null;
        mirror = m ? { name: m.name, match: m.match, el: m.el, w: m.w, nation: m.nation } : null;
        // 旧版は dv 無しの ?code= が旧版として復元される既存仕様
        if (s.encodedAnswers) resultUrl = '/?code=' + encodeURIComponent(s.encodedAnswers);
      }
      el = mpEsc(el); w = mpEsc(w); nation = mpEsc(nation);
      if (mirror) mirror = { rawName: mirror.name, name: mpEsc(mirror.name), match: mpNum(mirror.match), el: mpEsc(mirror.el), w: mpEsc(mirror.w), nation: mpEsc(mirror.nation) };
      return {
        kind: 'element', session: s, isLegacy: !s.isV2,
        date: s.completedAt, el, w, nation, mirror,
        name: el || '—', color: MP_EL_COLOR[el] || '#7ab8e8',
        code: el && w ? mpTypeCode(el, w, nation) : '',
        typeName: (el && w && MP_TYPE_NAME[el]) ? MP_TYPE_NAME[el][w] : '',
        purchased: !!s.purchased, resultUrl,
      };
    },
  },
};
function mpNormalize(s) {
  const kind = MP_KINDS[s.diagnosisType] ? s.diagnosisType : 'element';
  return MP_KINDS[kind].normalize(s);
}

/* ---- 無料でわかること ---- */
function mpComboText(r) {
  return [r.el, r.w, r.nation].filter(Boolean).join(' × ') || '—';
}
function mpFreeListHtml(r) {
  if (r.kind !== 'element') return (MP_KINDS[r.kind].freeListHtml || (() => ''))(r);
  return `
    <div class="mp-free-title">無料でわかること</div>
    <div class="mp-free-list">
      <div>タイプ：<b>${r.code || '—'}</b>${r.typeName ? `　<b>${r.typeName}</b>` : ''}</div>
      <div>元素：<b>${r.el || '—'}</b></div>
      <div>武器：<b>${r.w || '—'}</b></div>
      <div>国家：<b>${r.nation || '—'}</b></div>
      <div>MIRROR：<b>${r.mirror ? `${r.mirror.name}（${r.mirror.match}%）` : '—'}</b></div>
    </div>`;
}
// 「このときのあなた」：既存辞書（元素の軸・武器の原理・国家の意味）の語をそのまま表示する。
// 元素・武器・国家を「気質／動機／価値観」へ対応付けるなどの新しい解釈は加えない。
function mpThenHtml(r) {
  if (r.kind !== 'element') return '';
  const lines = [];
  if (r.el && MP_ELEMENT_AXIS[r.el]) lines.push(`元素　${r.el}「${MP_ELEMENT_AXIS[r.el]}」`);
  if (r.w && MP_WEAPON_PRINCIPLE[r.w]) lines.push(`武器　${r.w}「${MP_WEAPON_PRINCIPLE[r.w]}」`);
  if (r.nation && typeof NATION_MEANING !== 'undefined' && NATION_MEANING[r.nation]) lines.push(`国家　${r.nation}「${NATION_MEANING[r.nation]}」`);
  if (!lines.length) return '';
  return `<div class="mp-then"><div class="mp-then-title">このときのあなた</div>${lines.map(l => `<div>${l}</div>`).join('')}</div>`;
}

/* ---- 購入によって分かったことの要点（本文は転載しない。実測の上位軸名のみ） ---- */
// 表示値（整数）で順位付けし、次の規則でのみ強調する（案B）。
//   完全同点            → 同点の軸をすべて並べ「（同順位）」
//   1位が45〜55         → 形容なし。軸名と数値だけ（2位との差が5未満なら2軸）
//   1位と2位の差が5未満 → 上位2軸を並べ「（同程度）」
//   1位≧60 かつ 差≧5    → 「○○の傾向が強く表れています（値）」
//   それ以外            → 形容なし。軸名と数値だけ
function mpRankedAxes(obj, nameMap) {
  if (!obj) return [];
  return Object.keys(obj).filter(k => typeof obj[k] === 'number' && isFinite(obj[k]))
    .map(k => ({ key: k, name: nameMap[k] || k, v: Math.round(obj[k]) }))
    .sort((a, b) => b.v - a.v);
}
function mpAxisSummary(obj, nameMap) {
  const r = mpRankedAxes(obj, nameMap);
  if (!r.length) return '—';
  const fmt = x => `${x.name} ${x.v}`;
  const a = r[0], b = r[1];
  if (b && a.v === b.v) return r.filter(x => x.v === a.v).map(fmt).join('・') + '（同順位）';
  if (a.v >= 45 && a.v <= 55) return (b && a.v - b.v < 5) ? `${fmt(a)}・${fmt(b)}` : fmt(a);
  if (b && a.v - b.v < 5) return `${fmt(a)}・${fmt(b)}（同程度）`;
  if (a.v >= 60 && (!b || a.v - b.v >= 5)) return `${a.name}${/傾向$/.test(a.name) ? '' : 'の傾向'}が強く表れています（${a.v}）`;
  return fmt(a);
}
function mpInsightCards(r) {
  const s = r.session;
  const note = '実測値（0〜100）';
  if (!r.isLegacy && s.v2Scores) {
    return [
      { t: '行動スタイル', v: mpAxisSummary(s.v2Scores.style, MP_STYLE_NAME), n: note },
      { t: 'パーソナリティ', v: mpAxisSummary(s.v2Scores.personality, MP_BIG5_NAME), n: note },
      { t: '価値観', v: mpAxisSummary(s.v2Scores.values, MP_VALUES_NAME), n: note },
    ];
  }
  // 旧版（legacy-v1）：旧版が測定していた項目のみ。v2へ換算しない。
  const pr = s.primaryResult || {};
  return [
    { t: '動機（旧版）', v: pr.enneagram_type ? `タイプ${pr.enneagram_type}「${MP_ENNEA_NAME[pr.enneagram_type] || ''}」` : '—', n: 'エニアグラム' },
    { t: 'パーソナリティ', v: mpAxisSummary((s.scores && s.scores.big5) || null, MP_BIG5_NAME), n: note },
    { t: '価値観', v: pr.nation ? `${pr.nation}「${(typeof NATION_MEANING !== 'undefined' && NATION_MEANING[pr.nation]) || ''}」` : '—', n: '国家' },
  ];
}
function mpInsightHtml(r) {
  return `
    <div class="mp-insight-head"><b>INSIGHT</b>深く読み解いた記録</div>
    <div class="mp-insight-grid">
      ${mpInsightCards(r).map(c => `<div class="mp-insight-card"><div class="t">${c.t}</div><div class="v">${c.v}</div><div class="n">${c.n}</div></div>`).join('')}
    </div>
    <div style="margin-top:10px">${purchasedReportButton(r.session, 'mp-btn primary full', '解析レポートを読む ›')}</div>`;
}

/* ---- まだ読み解いていない部分（実データは一切出さない固定ダミー＋ぼかし） ---- */
function mpLockedHtml(r) {
  const rows = r.isLegacy
    ? ['動機の深層', 'パーソナリティの深層', '価値観の深層']
    : ['行動スタイルの深層', 'パーソナリティの深層', '価値観の深層'];
  return `
    <div class="mp-locked-title">まだ読み解いていない部分</div>
    ${rows.map(t => `<div class="mp-locked-row"><span class="t">${t}</span><span class="blur" aria-hidden="true">この記録の解析結果がここに記されています</span><span class="lk" aria-label="未解析">🔒</span></div>`).join('')}
    <p class="mp-rec-cta-note">この記録には、まだ知らない自分があります。</p>
    ${v2ReportCta(purchaseUrlFor(r.session), 'mp-btn primary full', 'records', 'この記録の解析レポートを見る ›')}`;
}

/* ---- 共有：/api/share（個別OGP）経由。符号化の並び順はshare.js・og-image.mjsと同一。
   キャラクター番号は正本 js/characters118_v2.js（ETI_V2_CHARACTERS）の順序から取得し、
   マイページ内に別のキャラクター一覧は持たない。 ---- */
const MP_PACK_ELEMENTS = ["炎","水","氷","雷","風","岩","草"];
const MP_PACK_WEAPONS = ["片手剣","両手剣","長柄","法器","弓"];
const MP_PACK_NATIONS = ["モンド","璃月","稲妻","スメール","フォンテーヌ","ナタ","スネージナヤ","ナドクライ"];
function mpPackShare(el, w, nat, charIdx, match) {
  const e = MP_PACK_ELEMENTS.indexOf(el), wi = MP_PACK_WEAPONS.indexOf(w), n = MP_PACK_NATIONS.indexOf(nat);
  const m = Number(match);
  if (e < 0 || wi < 0 || n < 0 || !(charIdx >= 0 && charIdx <= 127) || !isFinite(m)) return null;
  const mi = Math.max(0, Math.min(127, Math.round(m)));
  return ((e << 20) | (wi << 17) | (n << 14) | (charIdx << 7) | mi).toString(36);
}
function mpShareUrl(r) {
  const s = r.session;
  if (!s || !s.encodedAnswers || !r.mirror) return null;
  if (typeof ETI_V2_CHARACTERS === 'undefined' || !Array.isArray(ETI_V2_CHARACTERS)) return null;
  const charIdx = ETI_V2_CHARACTERS.findIndex(c => c && c.name === r.mirror.rawName);
  const p = mpPackShare(r.el, r.w, r.nation, charIdx, r.mirror.match);
  if (!p) return null;
  const q = new URLSearchParams();
  if (!r.isLegacy) q.set('dv', 'ETI-2.0');
  q.set('code', s.encodedAnswers);
  q.set('p', p);
  return location.origin + '/api/share?' + q.toString();
}
function mpShare(idx) {
  const r = (window.__mpRecords || [])[idx];
  if (!r) return;
  const apiUrl = mpShareUrl(r);
  const url = apiUrl || (r.resultUrl ? location.origin + r.resultUrl : location.origin + '/');
  trackEvent('mypage_share_click', { diagnosis_type: r.kind, share_mode: apiUrl ? 'api_share' : 'result_url_fallback' });
  const tag4 = (MP_ELEMENT_CODE[r.el] || '') + (MP_WEAPON_CODE[r.w] || '');
  const mirrorLine = r.mirror ? `\n最も近しいキャラクター：${r.mirror.rawName}（${r.mirror.match}%一致）` : '';
  const text = `元素診断をやってみました。\n\n私の結果は【${mpComboText(r)}】${mirrorLine}\n\n${url}\n\n#元素診断${tag4 ? ' #' + tag4 : ''}${r.mirror ? ' #' + r.mirror.rawName : ''}`;
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank', 'noopener');
}

/* ============================================================
   各セクション
   ============================================================ */
function mpArchiveHtml(records) {
  const pad = n => String(n).padStart(2, '0');
  // 権利は「診断世代＋回答コード」単位（attachPurchasedStatusと同じキー）。同じ回答コードの別記録は1件として数える。
  const insightKeys = new Set(records.filter(r => r.purchased).map(r => {
    const s = r.session || {};
    return s.encodedAnswers ? `${s.isV2 ? 'ETI-2.0' : 'element-v1'}:${s.encodedAnswers}` : `session:${s.id}`;
  }));
  const insights = insightKeys.size;
  return `
    <section class="mp-archive" aria-labelledby="mp-archive-title">
      <div class="mp-archive-eyebrow">MY ARCHIVE</div>
      <h1 class="mp-archive-title" id="mp-archive-title">あなたの記録</h1>
      <p class="mp-archive-desc">これまでに見つめてきた、いくつもの「自分」が<br>ここに記録されています。</p>
      <div class="mp-stats">
        <div class="mp-stat"><div class="mp-stat-top"><span class="mp-stat-en">RECORDS</span><span class="mp-stat-num">${pad(records.length)}</span></div><div class="mp-stat-ja">残してきた自分</div></div>
        <div class="mp-stat"><div class="mp-stat-top"><span class="mp-stat-en">INSIGHTS</span><span class="mp-stat-num">${pad(insights)}</span></div><div class="mp-stat-ja">深く読み解いた自分</div></div>
      </div>
    </section>`;
}

function mpLatestHtml(r) {
  const viewBtn = r.resultUrl
    ? `<a href="${r.resultUrl}" class="mp-btn primary" onclick="trackEvent('mypage_view_result_click',{source:'latest'})">結果を見る ›</a>`
    : `<span class="mp-btn primary" aria-disabled="true">結果を見る ›</span>`;
  const tail = r.purchased
    ? mpInsightHtml(r)
    : `<div class="mp-notice"><p>この記録には、まだ読み解いていない部分があります</p>${v2ReportCta(purchaseUrlFor(r.session), 'mp-btn full', 'latest', 'この結果の解析レポートを見る ›')}</div>`;
  return `
    <section class="mp-sec" aria-labelledby="mp-latest-h">
      <div class="mp-sec-head" id="mp-latest-h"><span class="mp-sec-en">LATEST RESULT</span><span class="mp-sec-ja">最新のあなた</span></div>
      <div class="mp-latest">
        <div class="mp-latest-main">
          ${mpEmblemHtml(r, 'lg')}
          <div class="mp-latest-info">
            <div class="mp-chip-row"><span class="mp-chip">${mpDate(r.date)}</span><span class="mp-chip new">NEW</span>${r.purchased ? '<span class="mp-chip insight">INSIGHT</span>' : ''}${r.isLegacy ? '<span class="mp-chip legacy">旧版</span>' : ''}</div>
            ${r.code ? `<div class="mp-latest-code"><b>${r.code}</b>${r.typeName}</div>` : ''}
            <div class="mp-latest-combo"><span style="color:${r.color}">${r.el || '—'}</span>${r.w ? ' × ' + r.w : ''}${r.nation ? ' × ' + r.nation : ''}</div>
            ${r.mirror ? `<div class="mp-latest-mirror">MIRROR：${r.mirror.name}（${r.mirror.match}%）</div>` : ''}
          </div>
        </div>
        <div class="mp-btn-row">
          ${viewBtn}
          <button type="button" class="mp-btn" onclick="mpShare(0)"><span aria-hidden="true">𝕏</span> Xシェア</button>
        </div>
        ${tail}
      </div>
    </section>`;
}

// 記録章：存在する記録だけを古い順に並べ、新しい記録は右端に増える（読み込み時は右端＝最新を表示）。
function mpCollectionHtml(records) {
  const chronological = records.map((r, i) => ({ r, i })).reverse();
  return `
    <section class="mp-sec" aria-labelledby="mp-col-h">
      <div class="mp-sec-head" id="mp-col-h"><span class="mp-sec-en">YOUR COLLECTION</span><span class="mp-sec-ja">集めてきた記録章</span></div>
      <div class="mp-collection" id="mp-collection" role="list">
        ${chronological.map(({ r, i }) => `
          <button type="button" role="listitem" class="mp-badge state-${r.purchased ? 'insight' : 'record'}" onclick="mpOpenRecord(${i})" aria-label="${mpDate(r.date)}の${MP_KINDS[r.kind].label}の記録（${r.purchased ? 'INSIGHT' : 'RECORD'}）">
            ${mpEmblemHtml(r)}
            <span class="nm">${r.name}</span>
            <span class="dt">${mpDate(r.date)}</span>
            <span class="st">${r.purchased ? 'INSIGHT' : 'RECORD'}</span>
          </button>`).join('')}
      </div>
    </section>`;
}
function mpOpenRecord(i) {
  const d = document.getElementById('mp-rec-' + i);
  if (!d) return;
  d.open = true;
  d.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function mpRecordHtml(r, i) {
  const again = r.resultUrl
    ? `<a href="${r.resultUrl}" class="mp-btn full" onclick="trackEvent('mypage_view_result_click',{source:'records'})">この結果をもう一度見る ›</a>`
    : `<span class="mp-btn full" aria-disabled="true">この結果をもう一度見る ›</span>`;
  const chips = `${i === 0 ? '<span class="mp-chip new">NEW</span>' : ''}${r.purchased ? '<span class="mp-chip insight">INSIGHT</span>' : ''}${r.isLegacy ? '<span class="mp-chip legacy">旧版</span>' : ''}`;
  return `
    <details class="mp-rec" id="mp-rec-${i}" ontoggle="if(this.open){trackEvent('diagnosis_history_open',{diagnosis_type:'${r.kind}'})}">
      <summary>
        <span class="d">${mpDate(r.date)}</span>
        <span class="c">${r.headline ? `<span class="el" style="color:${r.color}">${r.headline}</span>` : `<span class="el" style="color:${r.color}">${r.el || '—'}</span>${r.w ? ' × ' + r.w : ''}${r.nation ? ' × ' + r.nation : ''}`}</span>
        <span class="mp-chip-row">${chips}</span>
      </summary>
      <div class="mp-rec-body">
        <div class="mp-free">
          ${mpEmblemHtml(r)}
          <div>${mpFreeListHtml(r)}</div>
        </div>
        ${mpThenHtml(r)}
        <div style="margin-top:12px">${again}</div>
        ${r.purchased ? mpInsightHtml(r) : mpLockedHtml(r)}
      </div>
    </details>`;
}
function mpRecordsHtml(records) {
  return `
    <section class="mp-sec" aria-labelledby="mp-rec-h">
      <div class="mp-sec-head" id="mp-rec-h"><span class="mp-sec-en">THE RECORDS</span><span class="mp-sec-ja">これまでのあなた</span></div>
      ${records.map((r, i) => mpRecordHtml(r, i)).join('')}
    </section>`;
}

function mpRediagHtml() {
  return `
    <section class="mp-sec mp-rediag" aria-labelledby="mp-rediag-h">
      <div class="mp-sec-head" id="mp-rediag-h" style="justify-content:center"><span class="mp-sec-en">RE-DIAGNOSIS</span></div>
      <p class="mp-rediag-copy">今のあなたは、あの日と同じだろうか。</p>
      <a href="/?dv=ETI-2.0" class="mp-btn primary full" onclick="trackEvent('mypage_rediagnosis_click',{})">↻ もう一度、診断する ›</a>
      <p class="mp-rediag-note">新しい診断は、別の記録として保存されます。購入済みの解析レポートは、対象の診断記録から引き続き閲覧できます。</p>
    </section>`;
}

function mpAccountHtml(uid) {
  return `
    <section class="mp-sec" aria-labelledby="mp-acc-h">
      <div class="mp-sec-head" id="mp-acc-h"><span class="mp-sec-en">ACCOUNT</span></div>
      <div class="mp-account">
        <details>
          <summary class="mp-account-row"><span>⚙ アカウント設定</span><span>›</span></summary>
          <div class="mp-account-body">
            ${uid ? `<div>ユーザーID</div><div class="mp-uid">${mpEsc(uid)}</div>` : ''}
            <div style="margin-top:8px">保存データの削除をご希望の場合は、X（@mondayaxad）までご連絡ください。内容を確認のうえ対応します（即時の自動削除ではありません）。</div>
          </div>
        </details>
        <button type="button" class="mp-account-row" onclick="handleLogoutClick()"><span>⇥ ログアウト</span><span>›</span></button>
      </div>
    </section>`;
}

/* ============================================================
   ページ全体
   ============================================================ */
function renderMypage(root, sessions, uid) {
  const records = sessions
    .slice()
    .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt))
    .map(mpNormalize);
  window.__mpRecords = records;

  root.innerHTML = `
    ${mpArchiveHtml(records)}
    ${mpLatestHtml(records[0])}
    ${mpCollectionHtml(records)}
    ${mpRecordsHtml(records)}
    ${mpRediagHtml()}
    ${mpAccountHtml(uid)}
  `;

  const col = document.getElementById('mp-collection');
  if (col) col.scrollLeft = col.scrollWidth;

  trackEvent('mypage_view', {
    entry_point: 'mypage',
    diagnosis_type: DIAGNOSIS_TYPE,
    saved_count_bucket: savedCountBucket(records.length),
  });
}

function renderError(root) {
  root.innerHTML = `${logoutButtonHtml()}${pageHeaderHtml()}<div class="err">読み込みに失敗しました。時間をおいて再度お試しください。</div>`;
}

async function init() {
  const root = document.getElementById('root');
  const user = await getCurrentUser();

  if (!user) {
    renderGate(root);
    return;
  }

  const result = await loadDiagnosisHistory(DIAGNOSIS_TYPE);
  if (!result.ok) {
    renderError(root);
    return;
  }
  if (result.sessions.length === 0) {
    renderEmpty(root);
    return;
  }
  renderMypage(root, result.sessions, user.id);
}
// eti_v2_save.js（Googleログイン復帰後、v2のpending保存が完了した時点）から
// 呼べる再読み込みフック。init()自体はSIGNED_IN時にも呼ばれるため、
// 保存完了前に一度・完了後にもう一度（このフック経由で）呼ばれることがあるが、
// 後者が最終的に正しい状態を表示する。
window.refreshMypageHistory = init;

supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') init();
});

init();
</script>
