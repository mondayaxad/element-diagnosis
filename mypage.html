      }
    } catch (e) { /* 反映の確認は記録の状態確認でも行う */ }
    // 中止の印は使った後に URL から消す（再読み込み・再描画で繰り返さない。?complete=returned は生成状態の確認で消す）
    if (canceled) {
      try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* 消せなくても表示は続ける */ }
    }
  }
  // この端末のゲスト購入（Cookie）を、記録を描く前に引き継ぐ。押すまで待つと、結果ページから保存した同じ結果の記録が
  //   未購入に見えて、もう一度購入を求めてしまう（買い直し・二重決済の原因）。引き継ぎはサーバーが Cookie の秘密値と
  //   「ログイン中の確認済みメール＝購入時のメール」を確かめた時だけ行う（共有端末の別の人へは移らない）
  // 購入時メール・Cookie による自動の引き継ぎは行わない（complete_13）。購入したレポートは、レポートの固有リンクから明示的に登録する
  const claimOutcome = null;
  const registerOutcome = await mpRegisterOutcomeForRender();
  const result = await loadDiagnosisHistory(DIAGNOSIS_TYPE);
  if (result.ok) await mpMergeReports(result.sessions);
  if (!result.ok) {
    renderError(root);
    mpShowRegisterOutcome(root, registerOutcome, user);
    return;
  }
  if (result.sessions.length === 0) {
    renderEmpty(root, user);
    mpRenderedUserId = user.id;
    mpShowRegisterOutcome(root, registerOutcome, user);
    return;
  }
  mpEntitlementOk = mpEntitlementCheckedOk(result.sessions);
  renderMypage(root, result.sessions, user);
  mpRenderedUserId = user.id;
  if (keepScrollY !== null && renderedBefore === user.id) {
    openFolds.forEach((key) => {
      const d = key === 'latest' ? document.querySelector('details.mp-latest-fold') : document.getElementById(key);
      if (d && !d.open) { d.dataset.restored = '1'; d.open = true; } // 計測（diagnosis_history_open）はしない
    });
    window.scrollTo(0, keepScrollY);
  }
  mpShowRegisterOutcome(root, registerOutcome, user);
  mpScheduleGeneratingRefresh();
  // お知らせメール（Kit）の同期は、登録完了と診断の保存の後に diagnosis-save.js の runSignedInFlow() が行う。
}
// eti_v2_save.js（Googleログイン復帰後、v2のpending保存が完了した時点）から
// 呼べる再読み込みフック。init()自体はSIGNED_IN時にも呼ばれるため、
// 保存完了前に一度・完了後にもう一度（このフック経由で）呼ばれることがあるが、
// 後者が最終的に正しい状態を表示する。
window.refreshMypageHistory = init;

// 完全解析を作成中の記録がある間は、15秒ごとに状態を確かめ直す（最大20回・約5分。シート・申込の画面を開いている間・裏にある間は待つ）
let mpGenTimer = null;
let mpGenTries = 0;
function mpScheduleGeneratingRefresh() {
  clearTimeout(mpGenTimer);
  const generating = (window.__mpRecords || []).some((r) => {
    const d = mpCompleteLive(r);
    return d && !(d.report && (d.report.status === 'ready' || d.report.status === 'failed'));
  });
  if (!generating) { mpGenTries = 0; return; }
  if (mpGenTries >= 20) return;
  mpGenTimer = setTimeout(() => {
    const sheet = document.getElementById('mpUpgradeOverlay');
    const busy = document.visibilityState === 'hidden' || (sheet && !sheet.hidden) || document.querySelector('[aria-modal="true"]:not(#latest-upgrade-dialog)');
    if (busy) { mpScheduleGeneratingRefresh(); return; }
    mpGenTries++;
    init();
  }, 15000);
}

/* 購入の引き継ぎ（ゲスト購入 → この本人のマイページ）
   ・この端末の Cookie にある、支払済み・未引き継ぎの購入を、押した時（または「引き継ぐ」を押してログインした直後）だけ引き継ぐ。
   ・Cookie を失った時（#recover）：購入時のメールアドレスにメールで6桁コードを送り、そのコードでログインした直後だけ
     サーバーが購入時メールと照合して引き継ぐ（メールアドレスの文字列一致だけでは引き継がない）。 */
let mpGuestFlowBusy = false;
async function mpAccessToken() {
  try { const { data } = await supabaseClient.auth.getSession(); return data && data.session ? data.session.access_token : null; } catch (e) { return null; }
}
function mpClaimBox(root, html) {
  let box = document.getElementById('mpClaimBox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'mpClaimBox';
    box.className = 'mp-claim';
    box.setAttribute('role', 'status');
    const head = root.querySelector('.page-title');
    if (head && head.parentNode) head.insertAdjacentElement('afterend', box); else root.prepend(box);
  }
  box.innerHTML = html;
  return box;
}
// 記録を描く前の引き継ぎ。
//   ①この端末の Cookie の購入（Cookie の秘密値＋このサービスが確かめたメール＝購入時メール）。#recover でも行う
//     （解析レポートの「購入時のメールアドレスで確認する」から来ても、この端末の購入はそのまま引き継ぐ）
//   ②購入時のメールアドレスでの引き継ぎ：ログイン中の確かめたメール（6桁コード・Google）で払った、未引き継ぎの購入を
//     開くたびに自動で引き継ぐ（#recover の時は mpRecoverFlow が行い、結果をその画面で示す）。
//     サーバーが購入時メールと照合する。X 等のメール・別のメールの支払いを含む記録では移さない
//   null：引き継げる購入が無い・確かめられない／{ claimed, error, recovered }
let mpAutoRecover = null; // { key, promise, shown }：同じ読み込み・同じ利用者の再描画で2回呼ばない・同じ結果を2回出さない
async function mpClaimBeforeRender() {
  if (typeof EdGuestPurchase === 'undefined') return null;
  try {
    const G = EdGuestPurchase;
    const token = await mpAccessToken();
    if (!token) return null;
    let out = null;
    const st = await G.status();
    const claimable = st.ok ? (st.body.purchases || []).filter((p) => p.canClaim) : [];
    if (claimable.length) {
      G.takeClaimIntent(); // 「引き継ぐ」を押して来た印は使い終える
      G.track('claim_start', { source: 'mypage_auto' });
      const rs = await G.claimAll(token, claimable);
      out = { claimed: rs.filter((x) => x.ok).length, error: (rs.find((x) => !x.ok) || {}).error || null };
    }
    if (location.hash === '#recover') return out;
    const key = mpJwtSub(token);
    if (!mpAutoRecover || mpAutoRecover.key !== key) mpAutoRecover = { key, promise: G.recover(token), shown: false };
    const r = await mpAutoRecover.promise;
    const n = r && r.ok && r.body ? (r.body.claimed || 0) : 0;
    if (n > 0) {
      // 引き継いだ件数の案内は1回だけ（同じ読み込みでの描き直しでは出さない）
      if (mpAutoRecover.shown) return out;
      mpAutoRecover.shown = true;
      G.track('claim_success', { method: 'recover_auto' });
      // この端末の購入で引き継げなかった理由（別のメール等）は、購入時メールで引き継げたので出さない
      return Object.assign(out || { claimed: 0 }, { recovered: n, error: null });
    }
    return out;
  } catch (e) {
    return null;
  }
}
function mpJwtSub(token) {
  try { return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub || ''; } catch (e) { return ''; }
}
// ログイン中のアカウント（方法と、伏せたメールアドレス）。引き継ぎの案内の先頭に出す（どのアカウントに引き継ぐか分かるように）
function mpMaskEmail(email) {
  const m = /^([^@]+)@(.+)$/.exec(String(email || ''));
  if (!m) return '';
  const local = m[1].length <= 2 ? m[1].slice(0, 1) + '*' : m[1].slice(0, 2) + '***';
  return `${local}@${m[2]}`;
}
function mpAccountLine(user) {
  if (!user) return '';
  const providers = authLinkedProviders(user);
  const names = [providers.has('email') ? 'メール' : null, providers.has('google') ? 'Google' : null, providers.has('x') ? 'X' : null].filter(Boolean);
  const mail = mpMaskEmail(user.email);
  return `<p class="mp-claim-note" data-claim-account>ログイン中のアカウント：${mpEsc(names.join('・') || 'ログイン中')}${mail ? `（${mpEsc(mail)}）` : ''}</p>`;
}
// 引き継げなかった理由ごとの次の一手（同じ画面への行き来にしない）
function mpClaimErrorHtml(code) {
  const G = EdGuestPurchase;
  const text = `<p>${mpEsc(G.claimErrorText(code))}</p>`;
  if (code === 'claim_conflict') return text + '<p class="mp-claim-note">引き継ぎ先のアカウント（購入時のメールアドレスのアカウントの場合があります）でログインすると、ご覧いただけます。</p>';
  if (code === 'claim_not_paid') return text;
  if (code === 'claim_mixed_email') return text + '<p class="mp-claim-note">ご不明点があれば <a href="https://x.com/mondayaxad" target="_blank" rel="noopener">@mondayaxad</a> までご連絡ください。</p>';
  if (code === 'checkout_in_progress' || code === 'claim_email_unknown' || code === 'network' || !code) {
    return text + '<p><button type="button" data-mp-claim-retry>もう一度確認する</button></p>';
  }
  return text + '<p class="mp-claim-note"><a href="/mypage.html#recover">購入時のメールアドレスで確認する</a></p>';
}
function mpBindClaimRetry(box) {
  const b = box && box.querySelector('[data-mp-claim-retry]');
  if (b) b.onclick = () => { b.disabled = true; init(); };
}
function mpShowClaimOutcome(root, outcome, user) {
  if (!outcome || typeof EdGuestPurchase === 'undefined') return;
  if (outcome.recovered > 0) {
    mpClaimBox(root, mpAccountLine(user) + `<p>✓ 購入時のメールアドレスで確認した購入（${outcome.recovered}件）を、マイページに引き継ぎました。</p><p class="mp-claim-note">診断記録と購入済みのレポートを、いつでも見返せます。</p>`);
    return;
  }
  if (outcome.claimed > 0) {
    mpClaimBox(root, mpAccountLine(user) + `<p>✓ この端末の購入（${outcome.claimed}件）をマイページに引き継ぎました。</p><p class="mp-claim-note">診断記録と購入済みのレポートを、いつでも見返せます。</p>`);
    return;
  }
  if (outcome.error) {
    // 引き継げなかった：理由ごとの次の一手を出す（ここでは売り直さない）
    mpBindClaimRetry(mpClaimBox(root, mpAccountLine(user) + mpClaimErrorHtml(outcome.error)));
  }
}
async function mpGuestPurchaseFlow(root, claimOutcome, user) {
  if (mpGuestFlowBusy || typeof EdGuestPurchase === 'undefined') return;
  mpGuestFlowBusy = true;
  try {
    const G = EdGuestPurchase;
    const intent = G.takeClaimIntent();
    const token = await mpAccessToken();
    if (!token) return;
    if (location.hash === '#recover') {
      // この端末の購入を引き継げた：購入時メールでの確認は要らない（結果は mpShowClaimOutcome で表示済み）
      if (claimOutcome && claimOutcome.claimed > 0) { mpClearRecoverHash(); return; }
      await mpRecoverFlow(root, token, user);
      return;
    }
    // 記録を描く前に引き継ぎを試した（結果は mpShowClaimOutcome で表示済み）
    if (claimOutcome) return;
    const st = await G.status();
    const claimable = st.ok ? (st.body.purchases || []).filter((p) => p.canClaim) : [];
    if (!claimable.length) return;
    const run = async () => {
      const rs = await G.claimAll(await mpAccessToken(), claimable);
      const ok = rs.filter((x) => x.ok).length;
      const firstError = (rs.find((x) => !x.ok) || {}).error;
      const box = mpClaimBox(root, mpAccountLine(user) + (ok
        ? `<p>✓ この端末の購入（${ok}件）をマイページに引き継ぎました。</p><p class="mp-claim-note">診断記録と購入済みのレポートを、いつでも見返せます。</p>`
        : mpClaimErrorHtml(firstError)));
      mpBindClaimRetry(box);
      if (ok) setTimeout(() => { mpGuestFlowBusy = false; init(); }, 1200);
    };
    if (intent) { await run(); return; }
    const box = mpClaimBox(root, mpAccountLine(user) + `<p>この端末に、マイページへ引き継げる購入があります（${claimable.length}件）。</p>`
      + '<p class="mp-claim-note">引き継ぐと、この診断記録と購入済みのレポートを、このアカウントでいつでも見返せます。</p>'
      + '<button type="button" id="mpClaimBtn">この購入をマイページに引き継ぐ</button>');
    box.querySelector('#mpClaimBtn').onclick = (e) => { e.target.disabled = true; G.track('claim_start', { source: 'mypage' }); run(); };
  } finally {
    mpGuestFlowBusy = false;
  }
}
function mpForgetRecoverVerified() {
  try { sessionStorage.removeItem(MP_RECOVER_VERIFIED_KEY); } catch (e) { /* noop */ }
}
function mpClearRecoverHash() {
  mpForgetRecoverVerified();
  try { if (location.hash === '#recover') history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* そのまま */ }
}
// 購入時メールでの確認（#recover）。6桁コードで確認した直後は、確認できたこと・いまのアカウント・結果を示し、
//   同じ入力の画面には戻さない（見つからなかった時も、別のメールで確かめ直すか、マイページへ戻るかを選べる）
const MP_RECOVER_VERIFIED_KEY = 'ed_recover_verified_v1';
async function mpRecoverFlow(root, token, user) {
  const G = EdGuestPurchase;
  let justVerified = false;
  try {
    // 印は、結果の画面から次の一手を選ぶまで残す（ログインの切り替えで描き直しが重なっても、同じ結果の画面を出す）
    const v = sessionStorage.getItem(MP_RECOVER_VERIFIED_KEY);
    justVerified = !!(v && Date.now() - Number(v) < 15 * 60 * 1000);
  } catch (e) { justVerified = false; }
  G.track('claim_start', { source: justVerified ? 'recover_verified' : 'recover' });
  const r = await G.recover(token);
  const account = mpAccountLine(user);
  if (r.ok && r.body.claimed > 0) {
    mpClearRecoverHash();
    mpClaimBox(root, account + `<p>✓ 購入時のメールアドレスで確認した購入（${r.body.claimed}件）を、マイページに引き継ぎました。</p>`);
    setTimeout(() => { init(); }, 1200);
    return;
  }
  const mixed = r.ok ? (r.body.mixed || 0) : 0;
  const skipped = r.ok ? Math.max(0, (r.body.skipped || 0) - mixed) : 0;
  // 見つからなかった理由（このアカウントの確かめたメールでの照合の結果）
  let outcome;
  if (!r.ok) {
    outcome = r.body && r.body.error === 'network' ? null : `<p>${mpEsc(G.claimErrorText(r.body && r.body.error))}</p>`;
    if (r.status === 0 || (r.body && r.body.error === 'network') || !r.body) {
      mpBindClaimRetry(mpClaimBox(root, account + mpClaimErrorHtml('network')));
      return;
    }
  } else if (mixed > 0) {
    outcome = `<p>${mpEsc(G.claimErrorText('claim_mixed_email'))}</p>`;
  } else if (skipped > 0) {
    outcome = '<p>購入は見つかりましたが、決済の手続き中か、別のアカウントに引き継ぎ済みのため、引き継げませんでした。少し待ってから、もう一度お試しください。</p>';
  } else {
    outcome = justVerified
      ? '<p>このメールアドレスで支払われた、引き継げる購入は見つかりませんでした。</p>'
      : '<p>このアカウントのメールアドレスでは、引き継げる購入は見つかりませんでした。</p>';
  }
  if (justVerified) {
    // 6桁コードでの確認は済んだ：同じ入力の画面ではなく、結果と次の一手を出す
    const box = mpClaimBox(root, '<p>✓ メールアドレスの確認が完了しました。いまは、このメールアドレスのアカウントでログインしています。</p>'
      + account + outcome
      + '<p><button type="button" data-mp-recover-again>別のメールアドレスで確認する</button> <button type="button" data-mp-recover-done>マイページへ</button></p>');
    box.querySelector('[data-mp-recover-again]').onclick = () => { mpForgetRecoverVerified(); mpRecoverForm(root, user, account, ''); };
    box.querySelector('[data-mp-recover-done]').onclick = () => { mpClearRecoverHash(); box.remove(); init(); };
    return;
  }
  mpRecoverForm(root, user, account, outcome || '');
}
function mpRecoverForm(root, user, account, outcome) {
  const box = mpClaimBox(root, account + outcome
    + '<p>購入時のメールアドレスで、購入を引き継ぎます。</p>'
    + '<p class="mp-claim-note">Stripe の決済画面で入力したメールアドレスに、6桁のコードを送ります。コードで確認すると、そのメールアドレスのアカウントにログインが切り替わり、そのアカウントに引き継ぎます。'
    + 'いまのアカウントの記録は、元の方法でログインすると表示されます。</p>'
    + '<input type="email" id="mpRecoverEmail" autocomplete="email" inputmode="email" placeholder="購入時のメールアドレス"><button type="button" id="mpRecoverSend">コードを送る</button>'
    + '<div id="mpRecoverCode" hidden><input type="text" id="mpRecoverOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6桁のコード"><button type="button" id="mpRecoverVerify">確認して引き継ぐ</button></div>'
    + '<p class="mp-claim-note" id="mpRecoverMsg" role="alert"></p>'
    + '<p class="mp-claim-note"><button type="button" data-mp-recover-done>マイページへ戻る</button></p>');
  const msg = box.querySelector('#mpRecoverMsg');
  const emailInput = box.querySelector('#mpRecoverEmail');
  const otpInput = box.querySelector('#mpRecoverOtp');
  const send = box.querySelector('#mpRecoverSend');
  const verify = box.querySelector('#mpRecoverVerify');
  box.querySelector('[data-mp-recover-done]').onclick = () => { mpClearRecoverHash(); box.remove(); init(); };
  const doSend = async () => {
    const email = emailInput.value.trim();
    if (!isValidEmailForOtp(email)) { msg.textContent = 'メールアドレスを確認してください。'; return; }
    // いまのアカウントのメールアドレス：照合は済んでいる（コードを送っても結果は同じ）
    if (user && user.email && email.toLowerCase() === String(user.email).trim().toLowerCase()) {
      msg.textContent = 'いまログイン中のアカウントのメールアドレスです。このメールアドレスで支払われた、引き継げる購入はありませんでした。購入時に別のメールアドレスを使った場合は、そのアドレスを入力してください。';
      return;
    }
    send.disabled = true;
    const err = await sendEmailOtp(email);
    send.disabled = false;
    if (err) { msg.textContent = authErrorMessage(err, 'send'); return; }
    box.querySelector('#mpRecoverCode').hidden = false;
    msg.textContent = 'コードを送りました。メールに届いた6桁のコードを入力してください。';
    otpInput.focus();
  };
  const doVerify = async () => {
    if (verify.disabled) return;
    const email = emailInput.value.trim();
    const code = otpInput.value.trim();
    if (!/^\d{6}$/.test(code)) { msg.textContent = '6桁のコードを入力してください。'; return; }
    verify.disabled = true;
    // 確認できた後の再描画（SIGNED_IN → init）で、結果の画面を出すための印（秘密値ではない）
    try { sessionStorage.setItem(MP_RECOVER_VERIFIED_KEY, String(Date.now())); } catch (e) { /* 印が無くても照合は行う */ }
    const err = await verifyEmailOtp(email, code);
    if (err) {
      try { sessionStorage.removeItem(MP_RECOVER_VERIFIED_KEY); } catch (e) { /* noop */ }
      verify.disabled = false; msg.textContent = authErrorMessage(err, 'verify'); return;
    }
    msg.textContent = '確認しました。購入を探しています…';
    // ログインが切り替わると onAuthStateChange(SIGNED_IN) → init() が #recover のまま再実行し、照合へ進む。
    //   同じアカウントのまま（切り替わらない）でも照合へ進めるよう、ここでも描き直す
    setTimeout(() => { if (location.hash === '#recover') init(); }, 1500);
  };
  send.onclick = doSend;
  verify.onclick = doVerify;
  emailInput.onkeydown = (e) => { if (e.key === 'Enter') doSend(); };
  otpInput.onkeydown = (e) => { if (e.key === 'Enter') doVerify(); };
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event !== 'SIGNED_IN') return;
  // 同じ利用者の再通知（タブへの復帰など）では描き直さない。#recover（購入時メールでの確認）は照合へ進むため描き直す
  const uid = session && session.user ? session.user.id : null;
  if (uid && uid === mpRenderedUserId) return;
  init();
});
// 戻る操作で（bfcache から）表示された：開いたままのシート・止まったスクロールを残さない
window.addEventListener('pageshow', (e) => {
  if (!e.persisted) return;
  mpReleaseScrollLockIfClosed();
  // 決済画面から「戻る」で戻った（ページの復元）：未払いの決済を閉じて、記録の状態を取り直す
  try { if (sessionStorage.getItem(MP_CHECKOUT_MARK) === '1') init(); } catch (err) { /* 再読み込みで取り直せる */ }
});

init();
</script>
