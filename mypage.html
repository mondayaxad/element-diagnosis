<!-- Google tag (gtag.js)
     【Preview版：GA4送信を無効化】本番Measurement IDへPreview操作が混入しないよう、
     外部スクリプトの読込とgtag('config', ...)による送信を止める。
     既存コードが呼ぶgtag()自体はno-opとして残し、ReferenceErrorにしない。
     本番反映時は、このコメントブロックを元のGA4読込へ戻すこと。 -->

  window.dataLayer = window.dataLayer || [];
  function gtag() {} // Preview版：no-op。本番反映時に実装へ戻す。
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07070f;
    --fg: #e0dcf0;
    --fg-dim: #6a6485;
    --accent: #7ab8e8;
    --accent-dim: #2a5878;
    --card-bg: #100e1c;
    --card-border: #241f3a;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 100px; }

  .eyebrow {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--accent);
    opacity: 0.8;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 8px 0 6px;
    letter-spacing: 1px;
  }
  .sub {
    font-size: 13px;
    color: var(--fg-dim);
    margin-bottom: 40px;
    line-height: 1.8;
  }
  .top-link {
    display: inline-block;
    font-size: 11.5px;
    color: var(--fg-dim);
    text-decoration: none;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 2px;
  }
  .top-link:hover { color: var(--accent); }

  /* ---- ログインゲート ---- */
  .gate {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 36px 28px;
    text-align: center;
  }
  .gate p {
    font-size: 13px;
    line-height: 1.9;
    color: var(--fg-dim);
    margin-bottom: 24px;
  }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: #fff;
    color: #1a1a2e;
    border: none;
    border-radius: 4px;
    padding: 13px;
    font-size: 13.5px;
    font-family: 'Noto Serif JP', serif;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--fg-dim);
    font-size: 11px;
    margin: 18px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }
  .email-row {
    display: flex;
    gap: 8px;
  }
  .email-row input {
    flex: 1;
    background: #0a0916;
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 11px 12px;
    color: var(--fg);
    font-size: 13px;
    font-family: inherit;
  }
  .email-row input:focus { outline: 1px solid var(--accent); }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    border-radius: 4px;
    padding: 11px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .gate-msg {
    font-size: 11.5px;
    color: var(--accent);
    margin-top: 14px;
    min-height: 16px;
  }

  /* ---- 履歴リスト ---- */
  .session-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--el-color, var(--accent-dim));
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .session-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .session-date {
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.5px;
  }
  .session-combo {
    font-size: 16px;
    font-weight: 700;
    margin-top: 6px;
  }
  .session-combo .el { color: var(--el-color, var(--accent)); }
  .session-sub {
    font-size: 11.5px;
    color: var(--fg-dim);
    margin-top: 4px;
  }
  .session-toggle {
    font-size: 11px;
    color: var(--fg-dim);
  }
  .session-detail {
    display: none;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--card-border);
  }
  .session-detail.open { display: block; }
  .detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .detail-row .k { color: var(--fg-dim); }
  .char-line {
    font-size: 12.5px;
    padding: 4px 0;
    color: var(--fg);
  }
  .char-line .pct { color: var(--accent); }

  .empty, .loading, .err {
    text-align: center;
    color: var(--fg-dim);
    font-size: 13px;
    padding: 60px 20px;
    line-height: 1.9;
  }
  .err { color: #d88; }

  .page-title { font-size: 20px; font-weight: 700; margin: 8px 0 24px; letter-spacing: 1px; }

  /* ---- Hero / ELEMENT PROFILE ---- */
  .hero {
    background: linear-gradient(135deg, var(--el-color, var(--accent-dim))22, var(--card-bg));
    border: 1px solid var(--el-color, var(--accent-dim));
    border-radius: 10px;
    padding: 30px 24px;
    margin-bottom: 26px;
  }
  .hero-eyebrow {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    opacity: 0.6;
    margin-bottom: 8px;
  }
  .hero-title { font-size: 12px; font-weight: 700; color: var(--fg-dim); margin-bottom: 2px; opacity: 0.8; }
  .hero-date { font-size: 10px; color: var(--fg-dim); opacity: 0.7; margin-bottom: 18px; }
  .hero-combo { font-size: 38px; font-weight: 800; line-height: 1.1; margin-bottom: 8px; letter-spacing: 0.5px; }
  .hero-combo .el { color: var(--el-color, var(--accent)); }
  .hero-sub { font-size: 12.5px; color: var(--fg-dim); margin-bottom: 22px; }
  .hero-stats { display: flex; gap: 28px; margin-bottom: 22px; }
  .hero-stat-num { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1; }
  .hero-stat-label { font-size: 10px; color: var(--fg-dim); margin-top: 4px; }
  .hero-cta-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-btn {
    flex: 1; min-width: 140px; text-align: center; padding: 11px; border-radius: 6px;
    font-size: 12.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: none;
  }
  .hero-btn-primary { background: var(--accent); color: #0a0916; }
  .hero-btn-secondary { background: transparent; border: 1px solid var(--accent-dim); color: var(--accent); }

  /* ---- サマリー ---- */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .summary-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; padding: 14px; }
  .summary-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 9px; }
  .summary-body { font-size: 12.5px; line-height: 1.75; color: var(--fg); }
  .summary-body .sub { font-size: 10.5px; color: var(--fg-dim); margin: 0; }

  .section-title { font-size: 11.5px; letter-spacing: 2px; color: var(--fg-dim); text-transform: uppercase; margin: 0 0 12px; }

  .badge-new {
    display: inline-block; background: var(--accent); color: #0a0916; font-size: 9px; font-weight: 700;
    padding: 2px 7px; border-radius: 10px; margin-left: 6px; letter-spacing: 0.5px; vertical-align: middle;
  }
  .badge-unlocked { color: #90c8f0; }
  .badge-locked { color: var(--fg-dim); }

  /* ---- 履歴（セッションごとのアコーディオン） ---- */
  .session-acc {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--el-color, var(--accent-dim));
    border-radius: 4px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .session-acc summary {
    padding: 16px 18px;
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .session-acc summary::-webkit-details-marker { display: none; }
  .session-acc summary::after { content: '詳細を見る ▾'; font-size: 11px; color: var(--fg-dim); white-space: nowrap; }
  .session-acc[open] summary::after { content: '閉じる ▴'; }
  .session-date { font-size: 11px; color: var(--fg-dim); letter-spacing: 0.5px; }
  .session-combo { font-size: 16px; font-weight: 700; margin-top: 6px; }
  .session-combo .el { color: var(--el-color, var(--accent)); }
  .session-body { padding: 0 18px 18px; border-top: 1px solid var(--card-border); }
  .session-body-inner { padding-top: 16px; }

  /* ---- 履歴の蓄積感（縦タイムライン） ---- */
  .history-timeline { position: relative; padding-left: 16px; }
  .history-timeline::before {
    content: ''; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px; background: var(--card-border);
  }
  .timeline-item { position: relative; margin-bottom: 12px; }
  .timeline-dot {
    position: absolute; left: -16px; top: 22px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--el-color, var(--accent)); border: 2px solid var(--bg); z-index: 1;
  }

  /* ---- 詳細データ内アコーディオン ---- */
  details.acc {
    background: #0a0916; border: 1px solid #2a5878; border-radius: 6px; margin-bottom: 10px; overflow: hidden;
  }
  details.acc summary {
    padding: 11px 14px; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
  }
  details.acc summary::-webkit-details-marker { display: none; }
  details.acc summary::after { content: '▾'; font-size: 9px; color: var(--fg-dim); }
  details.acc[open] summary::after { content: '▴'; }
  details.acc .acc-body { padding: 0 14px 14px; }

  .lock-box { background: #0a0916; border: 1px solid var(--card-border); border-radius: 6px; padding: 16px; }
  .lock-list { list-style: none; margin: 0 0 14px; padding: 0; }
  .lock-list li { font-size: 12px; color: var(--fg-dim); padding: 4px 0; }
  .lock-cta-btn {
    display: block; text-align: center; background: #7ab8e8; color: #0a0916; font-size: 12.5px;
    font-weight: 700; padding: 11px; border-radius: 4px; text-decoration: none;
    width: 100%; border: none; cursor: pointer; font-family: inherit;
  }
  .report-open-error { color: #d88; font-size: 11px; line-height: 1.7; margin-top: 8px; }
  .view-on-site-link {
    display: inline-block; font-size: 11.5px; color: var(--accent); text-decoration: none;
    margin-bottom: 16px; border-bottom: 1px dotted var(--accent-dim); padding-bottom: 1px;
  }

  /* ---- 次の一歩 ---- */
  .next-steps { margin-top: 8px; }
  .next-steps-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .next-btn {
    flex: 1; min-width: 160px; text-align: center; padding: 12px; border-radius: 6px;
    font-size: 12.5px; font-weight: 700; cursor: pointer; text-decoration: none;
    background: transparent; border: 1px solid var(--accent-dim); color: var(--accent);
  }
  .next-btn-primary { background: var(--accent); color: #0a0916; border: none; }
  .coming-soon {
    background: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 6px;
    padding: 14px; text-align: center; color: var(--fg-dim); font-size: 11px; letter-spacing: 1px;
  }
  .newsletter-note { text-align: center; color: var(--fg-dim); font-size: 10.5px; margin-top: 12px; }

  /* ============================================================
     MY ARCHIVE（マイページ最終仕様）追加スタイル
     既存のトークン（--bg/--fg/--fg-dim/--accent/--card-bg/--card-border）のみ使用。
     ============================================================ */
  .mp-sec { margin-top: 34px; }
  .mp-sec-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .mp-sec-en { font-family: 'IM Fell English', serif; font-size: 12px; letter-spacing: 2px; color: var(--fg); text-transform: uppercase; }
  .mp-sec-ja { font-size: 11px; color: var(--fg-dim); }
  .mp-sec-ja::before { content: '｜'; margin-right: 4px; opacity: .6; }

  /* ---- MY ARCHIVE ---- */
  .mp-archive-eyebrow { font-family: 'IM Fell English', serif; font-size: 11px; letter-spacing: 3px; color: var(--fg-dim); }
  .mp-archive-title { font-size: 26px; font-weight: 700; letter-spacing: .08em; margin: 4px 0 6px; color: #f0e8ff; }
  .mp-archive-desc { font-size: 12px; color: var(--fg-dim); line-height: 1.8; }
  .mp-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; border: 1px solid var(--card-border); border-radius: 8px; background: var(--card-bg); }
  .mp-stat { padding: 12px 10px; text-align: center; }
  .mp-stat + .mp-stat { border-left: 1px solid var(--card-border); }
  .mp-stat-top { display: flex; justify-content: center; align-items: baseline; gap: 12px; }
  .mp-stat-en { font-family: 'IM Fell English', serif; font-size: 11px; letter-spacing: 1.5px; color: var(--fg); }
  .mp-stat-num { font-family: 'IM Fell English', serif; font-size: 26px; color: var(--accent); }
  .mp-stat-ja { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
  .mp-stat-num.unknown { color: var(--fg-dim); }
  /* 数字は最新結果の元素色（その明るい色へのグラデーション） */
  .mp-stats[style] .mp-stat-num:not(.unknown) {
    color: var(--sc);
    background: linear-gradient(90deg, var(--sc), color-mix(in srgb, var(--sc2) 70%, #ffffff));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* ---- 記録章（PNGエンブレム / season-pinned） ----
     RECORDとAWAKENEDは別画像。
     過去の記録は診断日からシーズンを決定するため、次シーズン追加時にも旧章は置換されない。 */
  .mp-emblem {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 70px;
    height: 70px;
    color: var(--c, #7ab8e8);
    isolation: isolate;
  }
  .mp-emblem::before,
  .mp-emblem::after { content: none; }
  .mp-emblem img {
    display: block;
    width: 70px;
    height: 70px;
    object-fit: contain;
    transform: translateZ(0);
  }
  .mp-emblem.lg { width: 90px; height: 90px; }
  .mp-emblem.lg img { width: 90px; height: 90px; }
  .mp-free .mp-emblem, .mp-free .mp-emblem img { width: 90px; height: 90px; }

  /* RECORD：そのシーズンの未覚醒画像をそのまま使う。CSSで別物に加工しない。 */
  .state-record .mp-emblem img {
    opacity: .78;
    filter: saturate(.80) brightness(.84);
  }

  /* AWAKENED：購入済み専用の別画像を表示。追加のネオン化はせず、画像自体の演出を主役にする。 */
  .state-insight .mp-emblem img {
    opacity: 1;
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--c, #7ab8e8) 16%, transparent));
  }
  .mp-latest.state-insight .mp-latest-main .mp-emblem img {
    filter: drop-shadow(0 0 7px color-mix(in srgb, var(--c, #7ab8e8) 30%, transparent));
  }
  .mp-rec.state-insight .mp-free .mp-emblem img {
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--c, #7ab8e8) 18%, transparent));
  }

  .mp-badge.state-insight .mp-emblem img {
    filter: drop-shadow(0 0 7px color-mix(in srgb, var(--c, #7ab8e8) 36%, transparent));
  }

  /* ---- LATEST RESULT ---- */
  .mp-latest { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; }

  /* ---- 購入状態の見た目（LATEST RESULT／YOUR COLLECTION／THE RECORDSで共通の考え方） ----
     未購入：LOCKEDを静かに表示し、元素色は弱く静かな枠のまま。
     購入済：状態文字は出さず、元素色の枠・エンブレム・ごく薄い背景光で静かに煌めく（ネオンにはしない）。 */
  .mp-latest.state-record, .mp-latest.state-insight {
    border-color: color-mix(in srgb, var(--lc, #7ab8e8) 33%, var(--card-border));
    background: linear-gradient(160deg, color-mix(in srgb, var(--lc, #7ab8e8) 8%, transparent), var(--card-bg) 55%);
  }
  /* 購入済み：暗い紺をベースに、元素色（左上）と、その明るい色（右下）の淡いにじみを重ねる。文字の下地は暗いまま。 */
  .mp-latest.state-insight {
    border-color: color-mix(in srgb, var(--lc, #7ab8e8) 46%, #3a3552);
    background:
      radial-gradient(ellipse 75% 60% at 18% 12%, color-mix(in srgb, var(--lc, #7ab8e8) 13%, transparent), transparent 72%),
      radial-gradient(ellipse 70% 55% at 100% 100%, color-mix(in srgb, var(--lc2, #7ab8e8) 8%, transparent), transparent 70%),
      linear-gradient(165deg, color-mix(in srgb, var(--lc, #7ab8e8) 7%, #0b0a18), #0b0a18 60%);
    box-shadow:
      0 0 12px color-mix(in srgb, var(--lc, #7ab8e8) 13%, transparent),
      0 0 28px color-mix(in srgb, var(--lc, #7ab8e8) 5%, transparent),
      inset 0 1px 0 color-mix(in srgb, var(--lc2, #7ab8e8) 18%, transparent),
      inset 0 0 26px color-mix(in srgb, var(--lc, #7ab8e8) 6%, transparent);
  }
  .mp-rec.state-record { border-color: color-mix(in srgb, var(--lc, #7ab8e8) 20%, var(--card-border)); }
  /* にじみの上でも補助テキストの読みやすさを無地のとき以上に保つため、購入済みカード内だけ補助色をわずかに明るく */
  .mp-latest.state-insight, .mp-rec.state-insight { --fg-dim: #7d7799; }
  .mp-rec.state-insight {
    border-color: color-mix(in srgb, var(--lc, #7ab8e8) 42%, #3a3552);
    background:
      radial-gradient(ellipse 55% 140% at 0% 0%, color-mix(in srgb, var(--lc, #7ab8e8) 11%, transparent), transparent 70%),
      radial-gradient(ellipse 45% 120% at 100% 100%, color-mix(in srgb, var(--lc2, #7ab8e8) 5%, transparent), transparent 70%),
      var(--card-bg);
    box-shadow:
      0 0 7px color-mix(in srgb, var(--lc, #7ab8e8) 8%, transparent);
  }
  /* 開いた本文は情報優先：にじみは見出し側だけに留め、本文の下地は暗いまま */
  .mp-rec.state-insight[open] { background:
      radial-gradient(ellipse 60% 220px at 0% 0%, color-mix(in srgb, var(--lc, #7ab8e8) 11%, transparent), transparent 75%),
      radial-gradient(ellipse 50% 260px at 100% 100%, color-mix(in srgb, var(--lc2, #7ab8e8) 5%, transparent), transparent 75%),
      var(--card-bg); }
  .mp-latest.state-insight .mp-emblem::before, .mp-rec.state-insight .mp-emblem::before {
    opacity: .82; box-shadow: 0 0 9px color-mix(in srgb, var(--c, #7ab8e8) 38%, transparent);
  }
  .mp-latest.state-insight .mp-emblem::after, .mp-rec.state-insight .mp-emblem::after { opacity: .30; }
  .mp-latest.state-insight .mp-emblem svg, .mp-rec.state-insight .mp-emblem svg {
    filter:
      drop-shadow(0 0 4px color-mix(in srgb, var(--c, #7ab8e8) 70%, transparent))
      drop-shadow(0 0 9px color-mix(in srgb, var(--c, #7ab8e8) 24%, transparent));
  }
  .mp-latest-main { display: flex; gap: 10px; align-items: flex-start; }
  .mp-latest-info { flex: 1; min-width: 0; }
  .mp-chip-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mp-chip { font-size: 11px; line-height: 16px; letter-spacing: .5px; border: 1px solid var(--card-border); border-radius: 4px; padding: 1px 7px; color: var(--fg-dim); }
  .mp-chip.new { background: var(--accent-dim); border-color: var(--accent); color: #e0f4ff; }
  .mp-chip.insight { border-color: #c0a860; color: #c0a860; }
  /* 未解放：LOCKEDを強調せず静かに示す（点線・淡色・背景なし） */
  .mp-chip.locked { border-style: dotted; border-color: #4a4566; color: #8a84a6; background: transparent; letter-spacing: .04em; padding: 1px 6px; }
  .mp-chip.legacy { border-style: dashed; }
  .mp-latest-code { font-size: 12px; color: var(--fg-dim); margin-top: 6px; letter-spacing: 1px; }
  .mp-latest-code b { color: var(--fg); font-weight: 700; margin-right: 8px; }
  .mp-latest-combo { font-size: 18px; font-weight: 700; margin-top: 2px; line-height: 1.5; }
  .mp-latest-mirror { font-size: 12px; color: var(--fg-dim); margin-top: 2px; }
  .mp-btn-row { display: flex; gap: 8px; margin-top: 14px; }
  .mp-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer; text-decoration: none; font-family: inherit; border: 1px solid var(--accent-dim); background: transparent; color: var(--accent); }
  .mp-btn.primary { background: linear-gradient(135deg, #1a4a78, #2a6a9a); border-color: #2a6a9a; color: #e0f4ff; }
  .mp-btn.full { width: 100%; flex: none; }
  .mp-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .mp-notice { margin-top: 14px; padding: 12px; border: 1px solid var(--card-border); border-radius: 8px; text-align: center; background: rgba(255,255,255,0.01); }
  .mp-notice p { font-size: 11.5px; color: var(--fg-dim); margin-bottom: 8px; }
  .mp-latest-fold { margin-top: 12px; border-top: 1px solid var(--card-border); }
  .mp-latest-fold > summary {
    list-style: none; cursor: pointer; min-height: 44px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; color: var(--fg-dim); font-size: 11.5px;
    letter-spacing: .04em; padding: 10px 2px 2px;
  }
  .mp-latest-fold > summary::-webkit-details-marker { display: none; }
  .mp-latest-fold > summary::after { content: '⌄'; font-size: 13px; color: var(--fg-dim); }
  .mp-latest-fold[open] > summary::after { content: '⌃'; }
  .mp-latest-fold-body { padding-top: 2px; }

  /* ---- INSIGHT 要点カード ---- */
  .mp-insight-head { display: flex; align-items: baseline; gap: 6px; margin: 14px 0 8px; padding-left: 7px; border-left: 2px solid #c0a860; font-size: 11px; color: var(--fg-dim); }
  .mp-insight-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  /* 領域ごとのアクセント（見出し・ゲージ・主要語だけに使い、背景・本文・罫線は既存の暗色のまま）
     パーソナリティ＝紫〜薄紅／行動スタイル＝琥珀〜金／価値観＝青緑〜水色 */
  .mp-insight-card { --d1: #b48ad8; --d2: #d9aed6; --g1: #7a52a8; --g2: #cfa0d0;
    border: 1px solid var(--card-border); border-left: 2px solid var(--g1); border-radius: 6px; padding: 10px 12px; background: rgba(255,255,255,0.012); min-width: 0; }
  .mp-insight-card[data-domain="style"], .mp-insight-card[data-domain="motive"] { --d1: #dcae5a; --d2: #e6cc8c; --g1: #a8702a; --g2: #e0c070; }
  .mp-insight-card[data-domain="values"] { --d1: #5cc4b0; --d2: #92d4dc; --g1: #1f8a7e; --g2: #7cc8d8; }
  .mp-insight-card[data-domain="mirror"] { --d1: #a9bfe6; --d2: #cbd8f0; --g1: #5f7fb8; --g2: #b8cbee; }
  .mp-insight-card .t { font-size: 11.5px; color: var(--d1); font-weight: 700; margin-bottom: 4px; letter-spacing: .5px; }
  .mp-insight-card .tag { font-size: 14px; font-weight: 700; line-height: 1.6; margin-bottom: 6px; word-break: keep-all; overflow-wrap: anywhere; }
  .mp-insight-card .tag .a1 { color: var(--d1); }
  .mp-insight-card .tag .a2 { color: var(--d2); opacity: .82; font-weight: 600; }
  .mp-insight-card .v .nat { font-weight: 700; }
  .mp-insight-card[data-domain="motive"] .tag .a1, .mp-insight-card[data-domain="motive"] .tag .a2 { display: inline-block; white-space: nowrap; }
  .mp-insight-card .v.mp-ennea-code { font-family: 'IM Fell English', serif; font-size: 20px; letter-spacing: 1px; line-height: 1.3; margin-bottom: 2px; }
  .mp-insight-card .v { font-size: 12px; color: var(--fg-dim); line-height: 1.7; word-break: break-word; }
  .mp-insight-card .n { font-size: 11px; line-height: 1.6; color: var(--fg-dim); opacity: .75; margin-top: 4px; }

  /* ---- 細いゲージ（実測値 0〜100。購入済みの要点でのみ使用） ---- */
  .mp-gauge { display: grid; grid-template-columns: 5.5em 1fr 2.2em; align-items: center; gap: 8px; font-size: 11.5px; color: var(--fg-dim); padding: 2px 0; }
  .mp-gauge .nm { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-gauge .track { height: 4px; border-radius: 2px; background: #1a1630; overflow: hidden; }
  .mp-gauge .fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--g1, #7a52a8), var(--g2, #cfa0d0)); box-shadow: 0 0 4px color-mix(in srgb, var(--g2, #cfa0d0) 35%, transparent); }
  .mp-gauge .val { text-align: right; font-variant-numeric: tabular-nums; }
  .mp-gauge.mp-mirror-row { grid-template-columns: 6.5em 1fr 2.8em; }
  .mp-gauge.mp-mirror-row .nm { font-weight: 700; }

  /* ---- 視覚要約（無料公開範囲：元素TOP3の相対バー・MIRROR一致度） ---- */
  .mp-viz { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--card-border); }
  .mp-viz-title { font-size: 11px; color: var(--fg-dim); letter-spacing: 1px; margin-bottom: 6px; }
  .mp-eltop { margin-bottom: 7px; }
  .mp-eltop:last-child { margin-bottom: 0; }
  .mp-eltop-label { font-size: 12px; display: flex; align-items: baseline; gap: 6px; }
  .mp-eltop-label .ax { font-size: 11px; color: var(--fg-dim); }
  .mp-eltop-track { height: 5px; border-radius: 3px; background: #0a0916; overflow: hidden; margin-top: 3px; }
  .mp-eltop-fill { position: relative; height: 100%; border-radius: 3px; background: var(--elc); opacity: .55; }
  .mp-eltop-fill.r1 { opacity: 1; }
  .mp-eltop-label .el { color: var(--elc); font-weight: 400; }
  .mp-eltop-label .el.r1 { font-weight: 700; }
  /* 購入済み：元素名・マーカー・バーをわずかに明るく。1位のバー先端にだけごく弱い光 */
  .state-insight .mp-eltop-label .el { color: color-mix(in srgb, var(--elc) 78%, #ffffff); }
  .state-insight .mp-eltop-fill { background: linear-gradient(90deg, var(--elc), var(--elc2, var(--elc))); opacity: .72; }
  .state-insight .mp-eltop-fill.r1 { opacity: 1; }
  .state-insight .mp-eltop-track { overflow: visible; background: color-mix(in srgb, var(--lc, #7ab8e8) 10%, #0a0916); }
  .state-insight .mp-eltop-fill.r1::after {
    content: ''; position: absolute; right: -1px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%;
    background: var(--elc2, var(--elc)); opacity: .55;
    box-shadow: 0 0 6px color-mix(in srgb, var(--elc2, var(--elc)) 45%, transparent);
  }
  .mp-ring { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px; }
  .mp-ring svg { width: 64px; height: 64px; }
  .mp-ring .arc { stroke: var(--rc); }
  .mp-ring .base { stroke: #1a1630; }
  /* 購入済み：円周を少し明るく（MIRRORキャラの元素色が確定していればその色）、外側にごく弱い光。数値は白飛びさせない */
  .state-insight .mp-ring .arc { stroke: color-mix(in srgb, var(--rc) 85%, #ffffff); }
  .mp-ring .arc-g { display: none; }
  .state-insight .mp-ring .arc-g { display: inline; }
  .state-insight .mp-ring .arc { display: none; }
  .state-insight .mp-ring .who { filter: brightness(1.15); }
  .state-insight .mp-ring .base { stroke: color-mix(in srgb, var(--rc) 18%, #15122a); }
  .state-insight .mp-ring svg { filter: drop-shadow(0 0 4px color-mix(in srgb, var(--rc) 26%, transparent)); }
  .mp-ring .lbl { font-size: 10.5px; color: var(--fg-dim); letter-spacing: 1px; }
  /* MIRRORのキャラクター名はリングの主役として大きめ・太字で */
  .mp-ring .who { font-size: 15px; font-weight: 700; letter-spacing: .04em; color: var(--fg); max-width: 96px; text-align: center; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }

  /* ---- 購入状態を確認できなかった場合（中立表示。購入導線は出さない） ---- */
  .mp-ent-warn { margin-top: 14px; padding: 12px; border: 1px dashed var(--card-border); border-radius: 8px; text-align: center; }
  .mp-ent-warn p { font-size: 12px; color: var(--fg); margin-bottom: 4px; }
  .mp-ent-warn .sub { font-size: 11px; color: var(--fg-dim); margin-bottom: 10px; line-height: 1.7; }

  /* ---- YOUR COLLECTION ---- */
  .mp-col-wrap { position: relative; }
  .mp-col-count { margin-left: auto; font-size: 11px; color: var(--fg-dim); letter-spacing: .5px; }
  .mp-col-wrap.has-more::after {
    content: ''; position: absolute; top: 0; right: 0; bottom: 10px; width: 36px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--bg) 88%);
  }
  .mp-col-next {
    position: absolute; right: 2px; top: 44px; z-index: 1; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--card-border); background: rgba(16,14,28,0.9); color: var(--fg-dim);
    font-size: 16px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  .mp-col-next:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mp-col-wrap.at-end::after, .mp-col-wrap.at-end .mp-col-next { display: none; }
  .mp-collection { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; scroll-padding-inline: 2px; -webkit-overflow-scrolling: touch; }
  .mp-badge {
    --badge-c: var(--el-color, var(--accent));
    flex: 0 0 96px; scroll-snap-align: start; display: flex; flex-direction: column;
    align-items: center; gap: 5px; padding: 13px 6px 11px; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--badge-c) 26%, var(--card-border));
    background: radial-gradient(circle at 50% 24%, color-mix(in srgb, var(--badge-c) 8%, transparent), transparent 54%), var(--card-bg);
    color: var(--fg); cursor: pointer; font-family: inherit;
  }
  .mp-badge .nm { font-size: 13px; font-weight: 700; }
  .mp-badge .dt { font-size: 11px; color: var(--fg-dim); }
  .mp-badge .st {
    font-size: 11px; letter-spacing: .12em; border: 1px dotted color-mix(in srgb, var(--badge-c) 24%, var(--card-border));
    border-radius: 999px; padding: 1px 9px; color: var(--fg-dim); margin-top: 1px; opacity: .78;
  }
  /* YOUR COLLECTION：1件ずつのカード。解放前は地味な暗い枠、解放後は元素色の濃い枠と静かな光＋元素色のINSIGHT。 */
  .mp-badge.state-record {
    border-color: color-mix(in srgb, var(--badge-c) 14%, #26223a);
    background: var(--card-bg);
    box-shadow: none;
  }
  .mp-badge.state-insight {
    border-color: color-mix(in srgb, var(--badge-c2, var(--badge-c)) 48%, #2a2640);
    background:
      radial-gradient(circle 56px at 50% 48px, color-mix(in srgb, var(--badge-c) 16%, transparent), transparent 100%),
      linear-gradient(180deg, color-mix(in srgb, var(--badge-c) 6%, var(--card-bg)), var(--card-bg) 70%);
    box-shadow:
      0 0 10px color-mix(in srgb, var(--badge-c) 12%, transparent),
      inset 0 0 14px color-mix(in srgb, var(--badge-c) 6%, transparent);
  }
  .mp-badge.state-insight .nm {
    text-shadow: 0 0 7px color-mix(in srgb, var(--badge-c) 10%, transparent);
  }
  /* INSIGHT：元素色で塗りつぶし、文字はその元素色を溶かした濃い色（明るい元素色の上で読める濃さ） */
  .mp-badge .st.insight {
    border: 1px solid color-mix(in srgb, var(--badge-c2, var(--badge-c)) 82%, var(--badge-c));
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--badge-c2, var(--badge-c)) 92%, #ffffff),
      color-mix(in srgb, var(--badge-c2, var(--badge-c)) 70%, var(--badge-c)));
    color: color-mix(in srgb, var(--badge-c) 30%, #0b0a18);
    font-weight: 700; border-radius: 4px; letter-spacing: .14em; opacity: 1;
  }



  /* ---- 購入済みの装飾フレーム：内側の細い二重線・四隅の菱形・上下中央の元素紋（7元素で紋が変わる） ---- */
  .mp-latest.state-insight, .mp-rec.state-insight, .mp-badge.state-insight { position: relative; }
  .mp-orn { position: absolute; inset: 5px; pointer-events: none; z-index: 0;
    border: 1px solid color-mix(in srgb, var(--oc) 30%, transparent); border-radius: 5px; }
  .mp-latest > .mp-orn { border-radius: 7px; }
  .mp-orn i { position: absolute; display: block; }
  /* 四隅：小さな菱形の光点 */
  .mp-orn .k { width: 3.5px; height: 3.5px; transform: rotate(45deg);
    background: linear-gradient(135deg, color-mix(in srgb, var(--oc2) 70%, #ffffff), var(--oc));
    opacity: .85; box-shadow: 0 0 3px color-mix(in srgb, var(--oc) 45%, transparent); }
  .mp-orn .k.tl { top: -2.25px; left: -2.25px; } .mp-orn .k.tr { top: -2.25px; right: -2.25px; }
  .mp-orn .k.bl { bottom: -2.25px; left: -2.25px; } .mp-orn .k.br { bottom: -2.25px; right: -2.25px; }
  /* 上下中央：元素紋と、その左右に伸びる明るい線 */
  .mp-orn .ln { left: 50%; width: 58%; max-width: 220px; height: 1px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--oc2) 75%, transparent) 42%, transparent 46%, transparent 54%, color-mix(in srgb, var(--oc2) 75%, transparent) 58%, transparent); }
  .mp-orn .ln.t { top: -1px; } .mp-orn .ln.b { bottom: -1px; }
  .mp-orn .m { left: 50%; width: 11px; height: 11px; margin-left: -5.5px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--oc2) 70%, #ffffff), var(--oc));
    -webkit-mask: var(--om) center / contain no-repeat; mask: var(--om) center / contain no-repeat;
    filter: drop-shadow(0 0 3px color-mix(in srgb, var(--oc) 80%, transparent)); }
  .mp-orn .m.t { top: -6px; } .mp-orn .m.b { bottom: -6px; }
  /* THE RECORDS：閉じた状態でも見えるようsummary内に置き、details全体に掛ける */
  .mp-rec > summary > .mp-orn { border-radius: 4px; }
  .mp-badge > .mp-orn { inset: 4px; border-radius: 7px; }
  .mp-badge > .mp-orn .ln { width: 80%; }
  .mp-badge > .mp-orn .m { width: 9px; height: 9px; margin-left: -4.5px; }
  .mp-badge > .mp-orn .m.t { top: -5px; } .mp-badge > .mp-orn .m.b { bottom: -5px; }
  .mp-latest.state-insight > :not(.mp-orn), .mp-badge.state-insight > :not(.mp-orn) { position: relative; z-index: 1; }

  /* ---- THE RECORDS ---- */
  .mp-rec { border: 1px solid var(--card-border); border-radius: 8px; background: var(--card-bg); margin-bottom: 8px; overflow: hidden; }
  .mp-rec > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 48px; padding: 12px 14px; font-size: 12.5px; }
  .mp-rec > summary::-webkit-details-marker { display: none; }
  .mp-rec > summary .d { color: var(--fg-dim); font-size: 11.5px; flex: 0 0 auto; }
  .mp-rec > summary .c { flex: 1; min-width: 0; word-break: keep-all; }
  .mp-rec > summary .c .el { font-weight: 700; }
  .mp-rec > summary::after { content: '⌄'; color: var(--fg-dim); font-size: 13px; }
  .mp-rec[open] > summary::after { content: '⌃'; }
  .mp-rec-body { padding: 4px 14px 16px; border-top: 1px solid var(--card-border); }
  .mp-free { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 12px; }
  .mp-free-list { font-size: 11.5px; color: var(--fg-dim); line-height: 1.8; }
  .mp-free-list b { color: var(--fg); font-weight: 400; }
  /* 意味色：値だけに色を付け、ラベルは既存の淡色のまま */
  .mp-x { color: #5a5478; font-weight: 400; margin: 0 .2em; }
  .mp-cw { white-space: nowrap; }
  /* 購入済みだけ：意味色からその明るい色へのグラデーション文字（未購入は単色のまま） */
  .state-insight .mp-gt {
    background: linear-gradient(90deg, var(--gc), color-mix(in srgb, var(--gc) 50%, #ffffff));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  }
  .mp-typecode { letter-spacing: 1.5px; font-weight: 700 !important; }
  .mp-pct { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 700; margin-left: 2px; }
  .mp-then { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--card-border); font-size: 11.5px; color: var(--fg-dim); line-height: 1.8; }
  .mp-then-title { font-size: 11px; color: var(--fg); margin-bottom: 2px; }
  .mp-locked-title { margin-top: 14px; font-size: 11px; color: var(--fg); }
  .mp-lockbox { margin-top: 4px; }
  .mp-seen { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--card-border); border-radius: 6px; background: rgba(255,255,255,0.012); }
  .mp-seen-title { font-size: 11px; color: var(--fg-dim); margin-bottom: 4px; }
  .mp-seen-list { list-style: none; margin: 0; padding: 0; }
  .mp-seen-list li { font-size: 12px; color: var(--fg); line-height: 1.8; }
  .mp-seen-list li::before { content: '✓'; color: var(--accent); margin-right: 6px; font-size: 11px; }
  .mp-locked-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--card-border); }
  .mp-locked-row .t { font-size: 12px; color: var(--fg); flex: 0 0 auto; }
  .mp-locked-row .blur { flex: 1; font-size: 11px; color: var(--fg-dim); filter: blur(3.5px); user-select: none; overflow: hidden; white-space: nowrap; }
  .mp-locked-row .lk { flex: 0 0 auto; font-size: 12px; opacity: .8; }
  .mp-locked-row .txt { flex: 1; min-width: 0; }
  .mp-locked-row .cap { display: block; font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
  /* 実値を持たない輪郭だけのゲージ（「情報が存在する」ことだけを示す） */
  .mp-locked-row .ghost { display: block; height: 4px; margin-top: 6px; border-radius: 2px; border: 1px dashed var(--card-border); background: repeating-linear-gradient(90deg, rgba(122,184,232,0.10) 0 8px, transparent 8px 14px); }
  .mp-rec-cta-note { font-size: 11.5px; color: var(--fg-dim); margin: 14px 0 8px; text-align: center; }

  /* ---- 未購入の訴求：まだ読み解いていないもの（元素色で「中に何かある」気配を出す。実値は出さない） ---- */

<script>

};
const NATION_MEANING = {
  "モンド":"自由", "璃月":"契約", "稲妻":"永遠", "スメール":"知恵",
  "フォンテーヌ":"正義", "ナタ":"戦争", "スネージナヤ":"慈愛", "ナドクライ":"月光",
};
const STRIPE_URL_AUTO = 'https://buy.stripe.com/test_9B64gr9micjz9riccu3Nm00'; // release-c-preview専用：Stripeテスト用Payment Link
// PreviewのStripeテスト決済→権利発行→v2レポート表示を実地確認するため有効化。
// STRIPE_URL_AUTOはPreview専用テストPayment Linkであり、本番決済には接続しない。
const V2_REPORT_SALES_ENABLED = true;

// 【重要な修正】trackEvent()・savedCountBucket()は、mypage.html内で11箇所・1箇所
// 呼ばれているが、mypage.html自身にもdiagnosis-save.jsにも定義が存在せず、
// 実際のページでは実行時にReferenceErrorになる状態だった
// （mypage_reflects_save_test.jsで実際に検出）。これまでのテストが通っていたのは、
// テスト側のスタブが偶然この関数を用意していたためで、実コードの不具合を
// 覆い隠していた。ここで実装を追加する。
function trackEvent(name, params) {
  if (typeof gtag === 'function') gtag('event', name, params || {});
}
function savedCountBucket(n) {
  if (n <= 0) return '0';
  if (n === 1) return '1';
  if (n <= 4) return '2_4';
  return '5_plus';
}

/* ============================================================
   購入状態の確認結果（表示専用）
   diagnosis-save.js の attachPurchasedStatus() は、/api/my-entitlements の失敗を
   握りつぶして全件「未購入」のまま返すため、呼び出し側からは失敗を区別できない。
   ここでは attachPurchasedStatus() の処理・API・照合キーには一切手を加えず、
   その実行中に行われる /api/my-entitlements の応答が正常だったかだけを観測する。
   失敗時は「未購入」として扱わず、購入導線を出さない中立表示にする
   （購入済みの利用者へ誤って再購入を促さないため）。
   ============================================================ */
// sessions配列 → その呼び出しでの確認成否。呼び出しごとに独立して記録し、描画は自分のsessionsの結果だけを見る。
const mpEntitlementResults = new WeakMap();
let mpEntitlementObserverInstalled = false;
// 描画関数群が参照する値。init()が描画の直前に、その描画に使うsessionsの結果を設定する（描画は同期処理）。
let mpEntitlementOk = true;
(function mpObserveEntitlementCheck() {
  const original = window.attachPurchasedStatus;
  // 二重ラップ防止：このIIFEはページ読込時に1回だけ実行される。init()／refreshMypageHistory()は再ラップしない。
  if (typeof original !== 'function' || original.__mpObserved) return;
  // 観測付きの呼び出しは直列化する（前の呼び出しがfetchを元へ戻してから次を始める）。
  let queue = Promise.resolve();
  const observed = function (sessions) {
    const self = this, args = arguments;
    const run = () => mpRunObservedEntitlementCheck(original, self, args, sessions);
    const p = queue.then(run, run);
    queue = p.catch(() => {});
    return p;
  };
  observed.__mpObserved = true;
  window.attachPurchasedStatus = observed;
  mpEntitlementObserverInstalled = true;
})();
async function mpRunObservedEntitlementCheck(original, self, args, sessions) {
  const realFetch = window.fetch;
  let probe = null;
  // /api/my-entitlements以外の通信は、元のfetchの戻り値（同じPromise）をそのまま返すだけで一切触れない。
  const observingFetch = function (input) {
    const p = realFetch.apply(this, arguments);
    const url = typeof input === 'string' ? input : ((input && input.url) || '');
    if (probe === null && url.indexOf('/api/my-entitlements') !== -1) {
      // 本体（attachPurchasedStatus）より先に登録されるため、本文を読む前にclone()できる。probeは決してrejectしない。
      probe = p.then(res => res.ok
        ? res.clone().json().then(b => !!(b && b.purchased_by_version && typeof b.purchased_by_version === 'object'))
        : false).catch(() => false);
    }
    return p;
  };
  window.fetch = observingFetch;
  try {
    return await original.apply(self, args);
  } finally {
    // 例外時も必ず元へ戻す（他のコードが途中でfetchを差し替えていた場合は、その差し替えを上書きしない）。
    if (window.fetch === observingFetch) window.fetch = realFetch;
    // アクセストークンが無くAPIを呼べなかった場合（probe無し）や例外時は「確認できなかった」扱い
    let ok = false;
    try { ok = probe ? await probe : false; } catch (e) { ok = false; }
    if (sessions && typeof sessions === 'object') mpEntitlementResults.set(sessions, ok);
  }
}
function mpEntitlementCheckedOk(sessions) {
  // 観測を設置できなかった場合は従来の挙動（未購入扱いの表示）に倒す
  if (!mpEntitlementObserverInstalled) return true;
  return mpEntitlementResults.has(sessions) ? mpEntitlementResults.get(sessions) : false;
}

/* ============================================================
   ETI v2 表示用ヘルパー
   v1のENNEA_NAME・BIG5_NAME等は一切変更せず、v2専用の対応表だけを追加する。
   ============================================================ */
function v2TopName(ranking) {
  // 【修正】v2_rankingsの各エントリ（element/weapon/nation）は、
  // computeResultsV2()の実際の戻り値と同じ「プレーンな配列」であり、
  // {ranking:[...], topGap} という包んだ形ではない（RPCへ渡す時点で
  // pending.results.elementRanking等がそのまま配列で渡っているため）。
  // 以前の実装は包んだ形を前提にしており、実データでは常にnullになる
  // 不具合があった（mypage_reflects_save_test.jsで実際に検出・修正）。
  if (!ranking || !ranking.length) return null;
  return ranking[0];
}
function purchaseReference(session) {
  if (!session || !session.encodedAnswers) return null;
  return session.isV2 ? `v2_${session.encodedAnswers}` : session.encodedAnswers;
}
function purchaseUrlFor(session) {
  const reference = purchaseReference(session);
  return reference
    ? STRIPE_URL_AUTO + '?client_reference_id=' + encodeURIComponent(reference)
    : STRIPE_URL_AUTO;
}
function v2ReportCta(stripeUrl, className, source, label) {
  if (!V2_REPORT_SALES_ENABLED) {
    return `<span class="${className}" style="opacity:0.6;cursor:not-allowed" aria-disabled="true">解析レポート（準備中）</span>`;
  }
  return `<a href="${stripeUrl}" target="_blank" rel="noopener" class="${className}" onclick="trackEvent('mypage_unlock_click',{source:'${source}'})">${label}</a>`;
}
function v2ClosenessLine(label, ranking, purchased) {
  const top = v2TopName(ranking);
  if (!top) return `<div style="display:flex;justify-content:space-between;padding:1px 0"><span>${label}</span><span style="color:var(--fg-dim)">—</span></div>`;
  const scorePart = purchased
    ? `<span style="color:var(--fg-dim);font-size:10px">近さスコア ${top.closenessScore}%</span>`
    : '';
  return `<div style="display:flex;justify-content:space-between;padding:1px 0"><span>${label}</span><span>${top.name}　${scorePart}</span></div>`;
}

// renderGateOtpInput() は旧メールOTP UI（未使用）。現在のメールOTPは js/auth-providers.js の renderAuthChoices() が描く。

function renderGateOtpInput(email) {
  const area = document.getElementById('historyGateArea');
  area.innerHTML = `
    <p style="color:#7ab8e8">${email} に6桁のコードを送りました。</p>
    <div class="email-row">

  `;
  document.getElementById('gateOtpVerifyBtn').onclick = async () => {

    if (error) { msg.textContent = 'コードが正しくないか、期限切れです。'; return; }

function purchasedReportButton(session, className, label) {
  const encodedId = encodeURIComponent(session && session.id ? session.id : '');
  const mv = session && session.isV2 ? mpMirrorUrlParam(session) : null;
  return `<button type="button" class="${className || 'lock-cta-btn'}" data-session-id="${encodedId}"${mv ? ` data-mv="${encodeURIComponent(mv)}"` : ''}

async function openPurchasedReport(diagnosisSessionId, button) {
  if (!diagnosisSessionId || !button) return;
  const originalLabel = button.textContent;
  button.disabled = true;
  button.textContent = 'レポートを準備中…';
  const oldError = button.parentElement && button.parentElement.querySelector('.report-open-error');
  if (oldError) oldError.remove();

  try {
    const { data: { session: authSession } } = await supabaseClient.auth.getSession();
    const accessToken = authSession && authSession.access_token;
    if (!accessToken) throw new Error('not_authenticated');

    const response = await fetch('/api/my-report-link', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ diagnosis_session_id: diagnosisSessionId }),
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok || !body.url) throw new Error(body.error || 'link_issue_failed');

    trackEvent('mypage_report_open', { source: 'purchased_report_button' });
    // 保存時のMIRROR版をレポートへ渡す（レポートは診断コードから計算し直すため、版が無いと最新版で表示される）
    let reportUrl = body.url;
    if (button.dataset.mv) reportUrl += (reportUrl.indexOf('?') >= 0 ? '&' : '?') + 'mv=' + button.dataset.mv;
    navigateTo(reportUrl);
  } catch (err) {
    console.error('purchased report open failed:', err);
    const message = document.createElement('p');
    message.className = 'report-open-error';
    message.textContent = 'レポートを開けませんでした。時間をおいて再度お試しください。';
    button.insertAdjacentElement('afterend', message);
    button.disabled = false;
    button.textContent = originalLabel;
  }
}

function logoutButtonHtml() {

    <button onclick="handleLogoutClick()" style="background:transparent;border:1px solid var(--card-border);color:var(--fg-dim);border-radius:6px;padding:6px 14px;font-size:11px;cursor:pointer;font-family:inherit">ログアウト</button>
  </div>`;
}
// ナビゲーション先の決定と実際の遷移を分離する（テストで実際の呼び出しを検証できるように）。
// jsdomはlocation.hrefへの代入をスパイできない制約があるため、遷移そのものは
// この小さな関数越しに行う。挙動は従来と同じ（location.hrefへの代入）。
function navigateTo(url) {
  location.href = url;
}
async function handleLogoutClick() {
  await signOutUser();
  // 【P1-5訂正】明示的にログアウトを選択した場合は、共有端末上に100回答・
  // 計算結果を含むpendingDiagnosis_v2を残さない。期限確認（readPendingDiagnosisV2）
  // ではなく、有効期限内かどうかに関わらず明示的に削除する。
  if (typeof clearPendingDiagnosisV2 === 'function') clearPendingDiagnosisV2();
  // 認証済みデータを画面から消し、ログイン画面（renderGate）へ戻す。

// DB由来の文字列をinnerHTMLへ入れる前に必ず通す（自分のデータであっても安全側に倒す）
function mpEsc(v) {
  if (v === null || v === undefined) return v;
  return String(v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

/* ---- 記録章シーズンレジストリ ----
   重要：過去シーズンの定義は削除・上書きしない。
   新シーズンは MP_EMBLEM_SEASONS に「追加」する。
   record.emblemSeason が将来DBに保存されればそれを最優先し、
   現在の既存記録は completedAt/date から決定論的にシーズンを復元する。 */
const MP_EMBLEM_SEASONS = {
  '2026-autumn': {
    // 最初の基準シーズン。開始日より前の既存記録（旧版を含む）もこの章に固定する。
    from: '2026-09-01T00:00:00+09:00',
    // 表示・運用上の目安。判定には使わない（次シーズンの開始日で切り替わる）。
    to:   '2026-11-30T23:59:59+09:00',
    record: {
      "炎":"assets/emblems/2026-autumn/record/pyro.png",
      "水":"assets/emblems/2026-autumn/record/hydro.png",
      "風":"assets/emblems/2026-autumn/record/anemo.png",
      "雷":"assets/emblems/2026-autumn/record/electro.png",
      "草":"assets/emblems/2026-autumn/record/dendro.png",
      "氷":"assets/emblems/2026-autumn/record/cryo.png",
      "岩":"assets/emblems/2026-autumn/record/geo.png",
    },
    awakened: {
      "炎":"assets/emblems/2026-autumn/awakened/pyro.png",
      "水":"assets/emblems/2026-autumn/awakened/hydro.png",
      "風":"assets/emblems/2026-autumn/awakened/anemo.png",
      "雷":"assets/emblems/2026-autumn/awakened/electro.png",
      "草":"assets/emblems/2026-autumn/awakened/dendro.png",
      "氷":"assets/emblems/2026-autumn/awakened/cryo.png",
      "岩":"assets/emblems/2026-autumn/awakened/geo.png",
    },
  },
};
// 基準シーズン（最初のシーズン）。この値は変更しない。
// 最も早い開始日より前の記録と、日付が読めない記録はこの章に固定する。
const MP_EMBLEM_BASE_SEASON = '2026-autumn';

function mpEmblemSeasonKey(record) {
  // 将来、保存データへ emblemSeason を持たせた場合はそれを最優先。
  const explicit = record && (record.emblemSeason || (record.session && record.session.emblemSeason));
  if (explicit && MP_EMBLEM_SEASONS[explicit]) return explicit;

  // 保存値が無い既存記録は、診断完了日時と各シーズンの「開始日」だけで決める。
  // 開始日が記録日時以前のシーズンのうち最も新しいものを採用するため、
  // 新シーズンを追加しても、その開始日より前の記録の章は変わらない。
  const raw = record && (record.date || (record.session && record.session.completedAt));
  const t = raw ? new Date(raw).getTime() : NaN;
  if (!isFinite(t)) return MP_EMBLEM_BASE_SEASON;
  let picked = MP_EMBLEM_BASE_SEASON, pickedFrom = -Infinity;
  for (const [key, season] of Object.entries(MP_EMBLEM_SEASONS)) {
    const from = new Date(season.from).getTime();
    if (isFinite(from) && from <= t && from > pickedFrom) { picked = key; pickedFrom = from; }
  }
  // どのシーズンの開始日よりも前の記録（2026-09-01以前）は基準シーズンに固定
  return picked;
}

function mpEmblemSrc(record) {
  const seasonKey = mpEmblemSeasonKey(record);
  const season = MP_EMBLEM_SEASONS[seasonKey] || MP_EMBLEM_SEASONS[MP_EMBLEM_BASE_SEASON];
  const state = record && record.purchased ? 'awakened' : 'record';
  const el = record && record.el;
  return (season[state] && season[state][el]) || '';
}

function mpEmblemHtml(record, size) {
  const color = record.color || '#7ab8e8';
  const src = mpEmblemSrc(record);
  if (!src) return '';
  const stateLabel = record.purchased ? '解析済みの記録章' : '記録章';
  return `<span class="mp-emblem ${size === 'lg' ? 'lg' : ''}" style="--c:${color}" aria-hidden="true"><img src="${src}" alt="${mpEsc(record.el || '')}${stateLabel}" loading="lazy" decoding="async"></span>`;
}

/* ============================================================
   診断記録の共通モデル
   元素診断（ETI v2・旧版legacy-v1）を同じ形へ正規化する。
   将来の新診断は MP_KINDS に種別を追加すれば、同じ棚（YOUR COLLECTION）と
   履歴（THE RECORDS）に載る。未公開の診断は一切表示しない。
   ============================================================ */
// v2のMIRROR：保存済みのスコア（パーソナリティ・行動スタイル・価値観）から計算する（js/eti_v2_mirror_resolver.js）。
// Preview の v2 記録は保存時の版にかかわらず最新版（ETI-MIRROR-2.1.0 / ETI-CHAR-2.1.0）で表示する（displayVersionForSaved）。
// 計算できない場合は保存時スナップショット（mirror_snapshot）を使う。
function mpMirrorComputedV2(s) {
  const sc = s && s.v2Scores;
  try {
    if (sc && sc.personality && sc.style && sc.values && typeof ETIv2MirrorResolver !== 'undefined') {
      return ETIv2MirrorResolver.computeMirror(sc, ETIv2MirrorResolver.displayVersionForSaved(s.mirrorModelVersion));
    }
  } catch (e) { console.error('mirror recompute failed (falling back to saved snapshot):', e); }
  return null;
}
// 一致率の上位4名（生スコア順位。MIRROR の選択とは別の一覧）
function mpMirrorTop4V2(s) {
  const c = mpMirrorComputedV2(s);
  if (c && Array.isArray(c.rankings) && c.rankings.length) return c.rankings.slice(0, 4).map(x => ({ name: x.name, match: x.mirrorScore, el: x.element, w: x.weapon, nation: x.region }));
  return Array.isArray(s && s.mirrorSnapshot) ? s.mirrorSnapshot.slice(0, 4) : [];
}
// MIRROR（最も近しいキャラクター1人）。保存時の版で計算し、ETI-MIRROR-2.1.0 は同率処理（元素→国家→武器→番号）の選択結果。
// 計算は決定的なので index で表示・保存した人物と一致する。計算できない場合だけ保存時スナップショットの選択（selected:true）を使う。
function mpMirrorV2(s) {
  const c = mpMirrorComputedV2(s);
  if (c && c.mirror) return { name: c.mirror.name, match: c.mirror.mirrorScore, el: c.mirror.element, w: c.mirror.weapon, nation: c.mirror.region };
  if (typeof ETIv2MirrorResolver !== 'undefined') {
    const saved = ETIv2MirrorResolver.mirrorFromSnapshot(s && s.mirrorSnapshot);
    if (saved && saved.name) return saved;
  }

}
// 結果URL・レポートURLに付けるMIRROR版（mv）。マイページで表示している版と同じ
function mpMirrorUrlParam(s) {
  if (!s || typeof ETIv2MirrorResolver === 'undefined') return null;
  return ETIv2MirrorResolver.urlParamFor(ETIv2MirrorResolver.displayVersionForSaved(s.mirrorModelVersion));
}
const MP_KINDS = {
  element: {
    label: '元素診断',
    normalize(s) {
      let el, w, nation, mirror, resultUrl = null;
      if (s.isV2) {
        const r = s.v2Rankings || {};
        el = (v2TopName(r.element) || {}).name;
        w = (v2TopName(r.weapon) || {}).name;
        nation = (v2TopName(r.nation) || {}).name;
        const m = mpMirrorV2(s);
        mirror = m ? { name: m.name, match: m.match, el: m.el, w: m.w, nation: m.nation } : null;
        const mv = mpMirrorUrlParam(s);
        if (s.encodedAnswers) resultUrl = '/?dv=ETI-2.0&code=' + encodeURIComponent(s.encodedAnswers) + (mv ? '&mv=' + encodeURIComponent(mv) : '');
      } else {
        const pr = s.primaryResult || {};
        el = pr.element; w = pr.weapon; nation = pr.nation;
        const m = (s.characterMatches && s.characterMatches[0]) || null;
        mirror = m ? { name: m.name, match: m.match, el: m.el, w: m.w, nation: m.nation } : null;
        // 旧版は dv 無しの ?code= が旧版として復元される既存仕様
        if (s.encodedAnswers) resultUrl = '/?code=' + encodeURIComponent(s.encodedAnswers);
      }
      el = mpEsc(el); w = mpEsc(w); nation = mpEsc(nation);
      if (mirror) mirror = { rawName: mirror.name, name: mpEsc(mirror.name), match: mpNum(mirror.match), el: mpEsc(mirror.el), w: mpEsc(mirror.w), nation: mpEsc(mirror.nation) };
      return {
        kind: 'element', session: s, isLegacy: !s.isV2,

        code: el && w ? mpTypeCode(el, w, nation) : '',
        typeName: (el && w && MP_TYPE_NAME[el]) ? MP_TYPE_NAME[el][w] : '',
        purchased: !!s.purchased, resultUrl,
        // 現在は保存値が無くても日付から復元可能。将来DBに保存されたら自動的に優先される。
        emblemSeason: s.emblemSeason || null,
      };
    },
  },
};
function mpNormalize(s) {
  const kind = MP_KINDS[s.diagnosisType] ? s.diagnosisType : 'element';
  return MP_KINDS[kind].normalize(s);
}

/* ---- 履歴を開いたときの基本情報（見出し文字列は出さない） ---- */

function mpComboText(r) {

// 「このときのあなた」：既存辞書（元素の軸・武器の原理・国家の意味）の語をそのまま表示する。

/* ---- 視覚要約（無料公開範囲のみ） ----
   index.htmlの無料結果「あなたに響く元素」と同じ材料・同じ正規化で元素TOP3の相対バーを作る

// CTAの優先順位（§23）：未購入＝解析レポート導線 > 結果を見る > Xシェア、
// 購入済み＝解析レポートを読む > 結果を見る > Xシェア（控えめ）。再診断は下のRE-DIAGNOSIS。
function mpLatestHtml(r) {
  const viewBtn = r.resultUrl
    ? `<a href="${r.resultUrl}" class="mp-btn" onclick="trackEvent('mypage_view_result_click',{source:'latest'})">結果を見る ›</a>`
    : `<span class="mp-btn" aria-disabled="true">結果を見る ›</span>`;
  const shareBtn = `<button type="button" class="mp-btn${r.purchased ? ' ghost' : ''}" onclick="mpShare(0)"><span aria-hidden="true">𝕏</span> Xシェア</button>`;
  let state;
  if (!mpEntitlementOk) {
    state = `<div class="mp-notice"><p>この記録の購入状態を確認できませんでした</p></div>`;
  } else if (r.purchased) {
    state = mpInsightHtml(r) + mpReadReportBtn(r);
  } else {
    state = mpLockedHtml(r, 'latest');
  }
  return `
    <section class="mp-sec" aria-labelledby="mp-latest-h">
      <div class="mp-sec-head" id="mp-latest-h"><span class="mp-sec-en">LATEST RESULT</span><span class="mp-sec-ja">最新のあなた</span></div>
      <div class="mp-latest state-${r.purchased ? 'insight' : 'record'}" style="--lc:${r.color};--lc2:${MP_EL_GLOW_END[r.el] || r.color}">${r.purchased && mpEntitlementOk ? mpOrnHtml(r, r.color, MP_EL_GLOW_END[r.el] || r.color) : ''}
        <div class="mp-latest-main">
          ${mpEmblemHtml(r, 'lg')}
          <div class="mp-latest-info">
            <div class="mp-chip-row"><span class="mp-chip">${mpDate(r.date)}</span><span class="mp-chip new">NEW</span>${mpEntitlementOk && !r.purchased ? '<span class="mp-chip locked" title="まだ読み解いていない記録">LOCKED</span>' : ''}${r.isLegacy ? '<span class="mp-chip legacy">旧版</span>' : ''}</div>
            ${r.code ? `<div class="mp-latest-code"><b class="mp-typecode mp-gt" style="color:${mpElText(r.el)};--gc:${mpElText(r.el)}">${r.code}</b><span class="mp-gt" style="color:${mpElText(r.el)};--gc:${mpElText(r.el)};opacity:.85">${r.typeName}</span></div>` : ''}
            <div class="mp-latest-combo">${mpComboHtml(r)}</div>
          </div>
        </div>
        ${mpVizHtml(r)}
        <details class="mp-latest-fold">
          <summary>${r.purchased ? '深く読み解いた内容を見る' : mpEntitlementOk ? 'まだ読み解いていない部分を見る' : 'この記録の詳細を見る'}</summary>
          <div class="mp-latest-fold-body">
            ${state}
            <div class="mp-btn-row">
              ${viewBtn}
              ${shareBtn}
            </div>
          </div>
        </details>
      </div>
    </section>`;
}

// 記録章：存在する記録だけを新しい順に左から並べる（最新が最初に目に入る）。
function mpCollectionHtml(records) {
  return `
    <section class="mp-sec" aria-labelledby="mp-col-h">
      <div class="mp-sec-head" id="mp-col-h"><span class="mp-sec-en">YOUR COLLECTION</span><span class="mp-sec-ja">集めてきた記録章</span>${records.length >= 4 ? `<span class="mp-col-count">全${records.length}件</span>` : ''}</div>
      <div class="mp-col-wrap${records.length >= 4 ? ' has-more' : ''}" id="mp-col-wrap">
      <div class="mp-collection" id="mp-collection" role="list">
        ${records.map((r, i) => `
          <button type="button" role="listitem"
            class="mp-badge state-${r.purchased ? 'insight' : 'record'}"
            style="--badge-c:${r.color};--badge-c2:${MP_EL_GLOW_END[r.el] || r.color}"
            onclick="mpOpenRecord(${i})"
            aria-label="${mpDate(r.date)}の${MP_KINDS[r.kind].label}の記録（${r.purchased ? 'INSIGHT・深く読み解いた記録' : mpEntitlementOk ? '記録' : '購入状態未確認'}）">
            ${r.purchased ? mpOrnHtml(r, r.color, MP_EL_GLOW_END[r.el] || r.color) : ''}
            ${mpEmblemHtml(r)}
            <span class="nm" style="color:${mpElText(r.el)}">${r.name}</span>
            <span class="dt">${mpDate(r.date)}</span>
            ${r.purchased ? '<span class="st insight">INSIGHT</span>' : mpEntitlementOk ? '<span class="st" title="まだ読み解いていない記録">LOCKED</span>' : ''}
          </button>`).join('')}
      </div>
      ${records.length >= 4 ? `<button type="button" class="mp-col-next" onclick="mpCollectionNext()" aria-label="記録章の続きを見る（全${records.length}件）">›</button>` : ''}
      </div>
    </section>`;
}
// 4件以上のときだけ：右端の見切れ（フェード）と小さな矢印で、続きがあることを示す。末尾まで来たら隠す。
function mpCollectionUpdateHint() {
  const wrap = document.getElementById('mp-col-wrap'), col = document.getElementById('mp-collection');
  if (!wrap || !col) return;
  wrap.classList.toggle('at-end', col.scrollLeft + col.clientWidth >= col.scrollWidth - 4);
}
function mpCollectionNext() {
  const col = document.getElementById('mp-collection');
  if (!col) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  col.scrollBy({ left: Math.round(col.clientWidth * 0.8), behavior: reduce ? 'auto' : 'smooth' });
}
function mpOpenRecord(i) {
  const d = document.getElementById('mp-rec-' + i);
  if (!d) return;
  d.open = true;
  d.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// 履歴アコーディオン（過去を振り返る主導線）。過去の結果ページはセカンダリ導線に下げる。
//   未購入：無料情報 → 視覚要約 → まだ読み解いていない3項目 → 解析レポート導線（¥1,000）
//   購入済：無料情報 → INSIGHT要点 → 視覚要約 → 解析レポート本文への導線
//   確認不可：無料情報 → 視覚要約 → 中立表示（購入導線なし）
function mpRecordHtml(r, i) {
  const detailLink = r.resultUrl
    ? `<a href="${r.resultUrl}" class="mp-detail-link" onclick="trackEvent('mypage_view_result_click',{source:'records'})">当時の診断結果を見る →</a>`
    : '';
  const chips = `${i === 0 ? '<span class="mp-chip new">NEW</span>' : ''}${mpEntitlementOk && !r.purchased ? '<span class="mp-chip locked" title="まだ読み解いていない記録">LOCKED</span>' : ''}${r.isLegacy ? '<span class="mp-chip legacy">旧版</span>' : ''}`;
  let body;
  if (!mpEntitlementOk) body = mpVizHtml(r) + `<div class="mp-notice"><p>この記録の購入状態を確認できませんでした</p></div>`;
  // 並び順は未購入と同じ：基本情報 → あなたに響く元素・MIRRORリング → 解析結果（購入済み）／まだ読み解いていないもの（未購入）
  else if (r.purchased) body = mpVizHtml(r) + mpInsightHtml(r) + mpReadReportBtn(r);
  else body = mpVizHtml(r) + mpLockedHtml(r, 'records');
  return `
    <details class="mp-rec state-${r.purchased ? 'insight' : 'record'}" style="--lc:${r.color};--lc2:${MP_EL_GLOW_END[r.el] || r.color}" id="mp-rec-${i}" ontoggle="if(this.open){trackEvent('diagnosis_history_open',{diagnosis_type:'${r.kind}'})}">
      <summary>${r.purchased && mpEntitlementOk ? mpOrnHtml(r, r.color, MP_EL_GLOW_END[r.el] || r.color) : ''}
        <span class="d">${mpDate(r.date)}</span>
        <span class="c">${r.headline ? `<span class="el" style="color:${r.color}">${r.headline}</span>` : mpComboHtml(r)}</span>
        <span class="mp-chip-row">${chips}</span>
      </summary>
      <div class="mp-rec-body">
        <div class="mp-free">
          ${mpEmblemHtml(r)}
          <div>${mpFreeListHtml(r)}</div>
        </div>
        ${mpThenHtml(r)}
        ${body}
        ${detailLink}
      </div>
    </details>`;
}
function mpRecordsHtml(records) {
  return `
    <section class="mp-sec" aria-labelledby="mp-rec-h">
      <div class="mp-sec-head" id="mp-rec-h"><span class="mp-sec-en">THE RECORDS</span><span class="mp-sec-ja">これまでのあなた</span></div>
      ${records.map((r, i) => mpRecordHtml(r, i)).join('')}
    </section>`;
}

function mpRediagHtml() {
  return `
    <section class="mp-sec mp-rediag" aria-labelledby="mp-rediag-h">
      <div class="mp-sec-head" id="mp-rediag-h" style="justify-content:center"><span class="mp-sec-en">RE-DIAGNOSIS</span></div>
      <p class="mp-rediag-copy">今のあなたは、あの日と同じだろうか。</p>
      <a href="/?dv=ETI-2.0" class="mp-btn full" onclick="trackEvent('mypage_rediagnosis_click',{})">↻ もう一度、診断する ›</a>
      <p class="mp-rediag-note">新しい診断は、今のあなたの新しい記録として別に保存されます。これまでの記録と、購入済みの解析レポートはそのまま残ります。</p>
    </section>`;
}

// ログイン方法：つながっている方法を表示し、未連携の Google / X を追加できる（js/auth-providers.js）
function mpLoginMethodsHtml(user) {
  if (!user || typeof authLinkedProviders !== 'function') return '';
  const linked = authLinkedProviders(user);
  const rows = [];
  if (linked.has('email')) {
    rows.push(`<div class="mp-login-row"><span>メール${user.email ? `（${mpEsc(user.email)}）` : ''}</span><span class="mp-login-on">✓ 利用中</span></div>`);
  }
  AUTH_LINKABLE_PROVIDERS.forEach(p => {
    const unlinkBtn = canUnlinkAuthProvider(user, p.provider)
      ? ` <button type="button" class="mp-login-unlink" data-provider="${p.provider}" data-label="${p.label}" onclick="mpUnlinkProvider(this)">解除</button>` : '';
    rows.push(linked.has(p.provider)
      ? `<div class="mp-login-row"><span>${p.label}</span><span><span class="mp-login-on">✓ 連携済み</span>${unlinkBtn}</span></div>`
      : `<div class="mp-login-row"><span>${p.label}</span><button type="button" class="mp-login-btn" data-provider="${p.provider}" onclick="mpLinkProvider(this)">${p.label}を連携する</button></div>`);
  });
  const notice = (typeof AUTH_RETURN_ERROR !== 'undefined' && AUTH_RETURN_ERROR) ? authLinkErrorMessage(AUTH_RETURN_ERROR) : '';
  return `
        <div class="mp-login" id="mpLogin">
          <div class="mp-login-title">ログイン方法</div>
          <div class="mp-login-note">ほかの方法も連携しておくと、次からどの方法でログインしても、この記録を見られます。</div>
          ${rows.join('')}
          <div class="mp-login-msg" id="mpLoginMsg" role="alert">${mpEsc(notice)}</div>
        </div>`;
}

async function mpLinkProvider(btn) {
  const provider = btn && btn.dataset.provider;
  if (!provider) return;
  btn.disabled = true;
  const msg = document.getElementById('mpLoginMsg');
  if (msg) msg.textContent = '';
  const { error } = await linkAuthProvider(provider) || {};
  // 成功時は連携先へ移動する。戻ってきたら SIGNED_IN / USER_UPDATED で再描画される
  if (error) {
    console.error('link identity error:', error);
    if (msg) msg.textContent = authLinkErrorMessage(error);
    btn.disabled = false;
  }
}

async function mpUnlinkProvider(btn) {
  const provider = btn && btn.dataset.provider;
  if (!provider) return;
  const label = btn.dataset.label || provider;
  if (!window.confirm(`${label}のログインを解除しますか？\n解除しても診断記録は消えません。次からは、ほかの方法でログインしてください。`)) return;
  btn.disabled = true;
  const msg = document.getElementById('mpLoginMsg');
  if (msg) msg.textContent = '';
  const user = await getCurrentUser();
  const { error } = await unlinkAuthProvider(user, provider);
  if (error) {
    console.error('unlink identity error:', error);
    if (msg) msg.textContent = authUnlinkErrorMessage(error);
    btn.disabled = false;
    return;
  }
  // 解除後のログイン方法を表示し直す
  init();
}

function mpAccountHtml(userOrUid) {
  const user = (userOrUid && typeof userOrUid === 'object') ? userOrUid : null;
  const uid = user ? user.id : userOrUid;
  return `
    <section class="mp-sec" aria-labelledby="mp-acc-h">
      <div class="mp-sec-head" id="mp-acc-h"><span class="mp-sec-en">ACCOUNT</span></div>
      <div class="mp-account">${mpLoginMethodsHtml(user)}
        <details>
          <summary class="mp-account-row"><span>⚙ アカウント設定</span><span>›</span></summary>
          <div class="mp-account-body">
            ${uid ? `<div>ユーザーID</div><div class="mp-uid">${mpEsc(uid)}</div>` : ''}
            <div style="margin-top:8px">アカウントの削除をご希望の場合は、X（@mondayaxad）またはメール（<a href="mailto:yaduns0522@gmail.com" style="color:var(--accent)">yaduns0522@gmail.com</a>）までご連絡ください。内容を確認のうえ対応します（即時の自動削除ではありません）。</div>
          </div>
        </details>
        <button type="button" class="mp-account-row" onclick="handleLogoutClick()"><span>⇥ ログアウト</span><span>›</span></button>
      </div>
    </section>`;
}

/* ============================================================
   ページ全体
   ============================================================ */
function renderMypage(root, sessions, userOrUid) {
  const records = sessions
    .slice()
    .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt))
    .map(mpNormalize);
  window.__mpRecords = records;

  root.innerHTML = `
    ${mpArchiveHtml(records)}
    ${mpLatestHtml(records[0])}
    ${mpCollectionHtml(records)}
    ${mpRecordsHtml(records)}
    ${mpRediagHtml()}
    ${mpAccountHtml(userOrUid)}
  `;

  const mpCol = document.getElementById('mp-collection');
  if (mpCol) { mpCol.addEventListener('scroll', mpCollectionUpdateHint, { passive: true }); mpCollectionUpdateHint(); }

  trackEvent('mypage_view', {
    entry_point: 'mypage',
    diagnosis_type: DIAGNOSIS_TYPE,
    saved_count_bucket: savedCountBucket(records.length),
  });
}

function renderError(root) {
  root.innerHTML = `${logoutButtonHtml()}${pageHeaderHtml()}<div class="err">読み込みに失敗しました。時間をおいて再度お試しください。</div>`;
}

async function init() {
  const root = document.getElementById('root');
  const user = await getCurrentUser();

  if (!user) {
    renderGate(root);
    return;
  }

  const result = await loadDiagnosisHistory(DIAGNOSIS_TYPE);
  if (!result.ok) {
    renderError(root);
    return;
  }
  if (result.sessions.length === 0) {
    renderEmpty(root, user);
    return;
  }
  mpEntitlementOk = mpEntitlementCheckedOk(result.sessions);
  renderMypage(root, result.sessions, user);
}
// eti_v2_save.js（Googleログイン復帰後、v2のpending保存が完了した時点）から
// 呼べる再読み込みフック。init()自体はSIGNED_IN時にも呼ばれるため、
// 保存完了前に一度・完了後にもう一度（このフック経由で）呼ばれることがあるが、
// 後者が最終的に正しい状態を表示する。
window.refreshMypageHistory = init;

supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') init();
});

init();
</script>
