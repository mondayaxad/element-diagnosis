<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07070f;
    --fg: #e0dcf0;
    --fg-dim: #8a83a3;
    --accent: #7ab8e8;
    --accent-dim: #2a5878;
    --card-bg: #100e1c;
    --card-border: #241f3a;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 100px; }

  .eyebrow {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--accent);
    opacity: 0.8;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 8px 0 6px;
    letter-spacing: 1px;
  }
  .sub {
    font-size: 13px;
    color: var(--fg-dim);
    margin-bottom: 40px;
    line-height: 1.8;
  }
  .top-link {
    display: inline-block;
    font-size: 11.5px;
    color: var(--fg-dim);
    text-decoration: none;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 2px;
  }
  .top-link:hover { color: var(--accent); }

  /* ---- ログインゲート ---- */
  .gate {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 36px 28px;
    text-align: center;
  }
  .gate p {
    font-size: 13px;
    line-height: 1.9;
    color: var(--fg-dim);
    margin-bottom: 24px;
  }
  .mp-checkout-msg { font-size: 11.5px; color: #d6a8b8; line-height: 1.7; margin: 6px 0 0; }
  .mp-legacy-retired { font-size: 12px; color: var(--fg-dim); line-height: 1.7; margin: 6px 0 0; }
  .mp-claim { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 4px; padding: 14px 16px; margin: 0 0 16px; font-size: 12.5px; line-height: 1.8; color: var(--fg); }
  .mp-claim p { margin: 0 0 8px; }
  .mp-claim .mp-claim-note { font-size: 11px; color: var(--fg-dim); }
  .mp-claim button { background: transparent; border: 1px solid var(--accent-dim); color: var(--accent); border-radius: 6px; padding: 8px 14px; font-size: 12px; font-family: inherit; cursor: pointer; }
  .mp-claim button[disabled] { opacity: .6; cursor: default; }
  .mp-claim input { width: 100%; box-sizing: border-box; background: rgba(6,9,20,.8); border: 1px solid var(--card-border); border-radius: 6px; padding: 10px; color: var(--fg); font-size: 16px; font-family: inherit; margin: 0 0 8px; }
  .gate p.gate-title {
    font-size: 15px;
    color: var(--fg);
    letter-spacing: .12em;
    margin-bottom: 10px;
  }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: #fff;
    color: #1a1a2e;
    border: none;
    border-radius: 4px;
    padding: 13px;
    font-size: 13.5px;
    font-family: 'Noto Serif JP', serif;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--fg-dim);
    font-size: 11px;
    margin: 18px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }
  .email-row {
    display: flex;
    gap: 8px;
  }
  .email-row input {
    flex: 1;
    background: #0a0916;
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 11px 12px;
    color: var(--fg);
    font-size: 13px;
    font-family: inherit;
  }
  .email-row input:focus { outline: 1px solid var(--accent); }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    border-radius: 4px;
    padding: 11px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .gate-note { font-size: 12px; line-height: 1.8; color: var(--fg-dim); margin: 10px 0 0; }
  .gate-note b { color: var(--fg); font-weight: 600; }
  .gate-msg {
    font-size: 11.5px;
    color: var(--accent);
    margin-top: 14px;
    min-height: 16px;
  }

  /* ---- 履歴リスト ---- */
  .session-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--el-color, var(--accent-dim));
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .session-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .session-date {
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.5px;
  }
  .session-combo {
    font-size: 16px;
    font-weight: 700;
    margin-top: 6px;
  }
  .session-combo .el { color: var(--el-color, var(--accent)); }
  .session-sub {
    font-size: 11.5px;
    color: var(--fg-dim);
    margin-top: 4px;
  }
  .session-toggle {
    font-size: 11px;
    color: var(--fg-dim);
  }
  .session-detail {
    display: none;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--card-border);
  }
  .session-detail.open { display: block; }
  .detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .detail-row .k { color: var(--fg-dim); }
  .char-line {
    font-size: 12.5px;
    padding: 4px 0;
    color: var(--fg);
  }
  .char-line .pct { color: var(--accent); }

  .empty, .loading, .err {
    text-align: center;
    color: var(--fg-dim);
    font-size: 13px;
    padding: 60px 20px;
    line-height: 1.9;
  }
  .err { color: #d88; }

  .page-title { font-size: 20px; font-weight: 700; margin: 8px 0 24px; letter-spacing: 1px; }

  /* ---- Hero / ELEMENT PROFILE ---- */
  .hero {
    background: linear-gradient(135deg, var(--el-color, var(--accent-dim))22, var(--card-bg));
    border: 1px solid var(--el-color, var(--accent-dim));
    border-radius: 10px;
    padding: 30px 24px;
    margin-bottom: 26px;
  }
  .hero-eyebrow {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    opacity: 0.6;
    margin-bottom: 8px;
  }
  .hero-title { font-size: 12px; font-weight: 700; color: var(--fg-dim); margin-bottom: 2px; opacity: 0.8; }
  .hero-date { font-size: 10px; color: var(--fg-dim); opacity: 0.7; margin-bottom: 18px; }
  .hero-combo { font-size: 38px; font-weight: 800; line-height: 1.1; margin-bottom: 8px; letter-spacing: 0.5px; }
  .hero-combo .el { color: var(--el-color, var(--accent)); }
  .hero-sub { font-size: 12.5px; color: var(--fg-dim); margin-bottom: 22px; }
  .hero-stats { display: flex; gap: 28px; margin-bottom: 22px; }
  .hero-stat-num { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1; }
  .hero-stat-label { font-size: 10px; color: var(--fg-dim); margin-top: 4px; }
  .hero-cta-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-btn {
    flex: 1; min-width: 140px; text-align: center; padding: 11px; border-radius: 6px;
    font-size: 12.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: none;
  }
  .hero-btn-primary { background: var(--accent); color: #0a0916; }
  .hero-btn-secondary { background: transparent; border: 1px solid var(--accent-dim); color: var(--accent); }

  /* ---- サマリー ---- */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .summary-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; padding: 14px; }
  .summary-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 9px; }
  .summary-body { font-size: 12.5px; line-height: 1.75; color: var(--fg); }
  .summary-body .sub { font-size: 10.5px; color: var(--fg-dim); margin: 0; }

  .section-title { font-size: 11.5px; letter-spacing: 2px; color: var(--fg-dim); text-transform: uppercase; margin: 0 0 12px; }

  .badge-new {
    display: inline-block; background: var(--accent); color: #0a0916; font-size: 9px; font-weight: 700;
    padding: 2px 7px; border-radius: 10px; margin-left: 6px; letter-spacing: 0.5px; vertical-align: middle;
  }
  .badge-unlocked { color: #90c8f0; }
  .badge-locked { color: var(--fg-dim); }

  /* ---- 履歴（セッションごとのアコーディオン） ---- */
  .session-acc {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--el-color, var(--accent-dim));
    border-radius: 4px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .session-acc summary {
    padding: 16px 18px;
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .session-acc summary::-webkit-details-marker { display: none; }
  .session-acc summary::after { content: '詳細を見る ▾'; font-size: 11px; color: var(--fg-dim); white-space: nowrap; }
  .session-acc[open] summary::after { content: '閉じる ▴'; }
  .session-date { font-size: 11px; color: var(--fg-dim); letter-spacing: 0.5px; }
  .session-combo { font-size: 16px; font-weight: 700; margin-top: 6px; }
  .session-combo .el { color: var(--el-color, var(--accent)); }
  .session-body { padding: 0 18px 18px; border-top: 1px solid var(--card-border); }
  .session-body-inner { padding-top: 16px; }

  /* ---- 履歴の蓄積感（縦タイムライン） ---- */
  .history-timeline { position: relative; padding-left: 16px; }
  .history-timeline::before {
    content: ''; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px; background: var(--card-border);
  }
  .timeline-item { position: relative; margin-bottom: 12px; }
  .timeline-dot {
    position: absolute; left: -16px; top: 22px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--el-color, var(--accent)); border: 2px solid var(--bg); z-index: 1;
  }

  /* ---- 詳細データ内アコーディオン ---- */
  details.acc {
    background: #0a0916; border: 1px solid #2a5878; border-radius: 6px; margin-bottom: 10px; overflow: hidden;
  }
  details.acc summary {
    padding: 11px 14px; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
  }
  details.acc summary::-webkit-details-marker { display: none; }
  details.acc summary::after { content: '▾'; font-size: 9px; color: var(--fg-dim); }
  details.acc[open] summary::after { content: '▴'; }
  details.acc .acc-body { padding: 0 14px 14px; }

  .lock-box { background: #0a0916; border: 1px solid var(--card-border); border-radius: 6px; padding: 16px; }
  .lock-list { list-style: none; margin: 0 0 14px; padding: 0; }
  .lock-list li { font-size: 12px; color: var(--fg-dim); padding: 4px 0; }
  .lock-cta-btn {
    display: block; text-align: center; background: #7ab8e8; color: #0a0916; font-size: 12.5px;
    font-weight: 700; padding: 11px; border-radius: 4px; text-decoration: none;
    width: 100%; border: none; cursor: pointer; font-family: inherit;
  }
  .report-open-error { color: #d88; font-size: 11px; line-height: 1.7; margin-top: 8px; }
  .view-on-site-link {
    display: inline-block; font-size: 11.5px; color: var(--accent); text-decoration: none;
    margin-bottom: 16px; border-bottom: 1px dotted var(--accent-dim); padding-bottom: 1px;
  }

  /* ---- 次の一歩 ---- */
  .next-steps { margin-top: 8px; }
  .next-steps-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .next-btn {
    flex: 1; min-width: 160px; text-align: center; padding: 12px; border-radius: 6px;
    font-size: 12.5px; font-weight: 700; cursor: pointer; text-decoration: none;
    background: transparent; border: 1px solid var(--accent-dim); color: var(--accent);
  }
  .next-btn-primary { background: var(--accent); color: #0a0916; border: none; }
  .coming-soon {
    background: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 6px;
    padding: 14px; text-align: center; color: var(--fg-dim); font-size: 11px; letter-spacing: 1px;
  }
  .newsletter-note { text-align: center; color: var(--fg-dim); font-size: 10.5px; margin-top: 12px; }

  /* ============================================================
     MY ARCHIVE（マイページ最終仕様）追加スタイル
     既存のトークン（--bg/--fg/--fg-dim/--accent/--card-bg/--card-border）のみ使用。
     ============================================================ */
  .mp-sec { margin-top: 34px; }
  .mp-sec-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .mp-sec-en { font-family: 'IM Fell English', serif; font-size: 12px; letter-spacing: 2px; color: var(--fg); text-transform: uppercase; }
  .mp-sec-ja { font-size: 11px; color: var(--fg-dim); }
  .mp-sec-ja::before { content: '｜'; margin-right: 4px; opacity: .6; }

  /* ---- MY ARCHIVE ---- */
  .mp-archive-eyebrow { font-family: 'IM Fell English', serif; font-size: 11px; letter-spacing: 3px; color: var(--fg-dim); }
  .mp-archive-title { font-size: 26px; font-weight: 700; letter-spacing: .08em; margin: 4px 0 6px; color: #f0e8ff; }
  .mp-archive-desc { font-size: 12px; color: var(--fg-dim); line-height: 1.8; }
  .mp-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; border: 1px solid var(--card-border); border-radius: 8px; background: var(--card-bg); }
  .mp-stat { padding: 12px 10px; text-align: center; }
  .mp-stat + .mp-stat { border-left: 1px solid var(--card-border); }
  .mp-stat-top { display: flex; justify-content: center; align-items: baseline; gap: 12px; }
  .mp-stat-en { font-family: 'IM Fell English', serif; font-size: 11px; letter-spacing: 1.5px; color: var(--fg); }
  .mp-stat-num { font-family: 'IM Fell English', serif; font-size: 26px; color: var(--accent); }
  .mp-stat-ja { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
  .mp-stat-num.unknown { color: var(--fg-dim); }
  /* 数字は最新結果の元素色（その明るい色へのグラデーション） */
  .mp-stats[style] .mp-stat-num:not(.unknown) {
    color: var(--sc);
    background: linear-gradient(90deg, var(--sc), color-mix(in srgb, var(--sc2) 70%, #ffffff));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* ---- 記録章（PNGエンブレム / season-pinned） ----
     RECORDとAWAKENEDは別画像。
     過去の記録は診断日からシーズンを決定するため、次シーズン追加時にも旧章は置換されない。 */
  .mp-emblem {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 70px;
    height: 70px;
    color: var(--c, #7ab8e8);
    isolation: isolate;
  }
  .mp-emblem::before,
  .mp-emblem::after { content: none; }
  .mp-emblem img {
    display: block;
    width: 70px;
    height: 70px;
    object-fit: contain;
    transform: translateZ(0);
  }
  .mp-emblem.lg { width: 90px; height: 90px; }
  .mp-emblem.lg img { width: 90px; height: 90px; }
  .mp-free .mp-emblem, .mp-free .mp-emblem img { width: 90px; height: 90px; }

  /* RECORD：そのシーズンの未覚醒画像をそのまま使う。CSSで別物に加工しない。 */
  .state-record .mp-emblem img {
    opacity: .78;
    filter: saturate(.80) brightness(.84);
  }

  /* AWAKENED：購入済み専用の別画像を表示。追加のネオン化はせず、画像自体の演出を主役にする。 */
  .state-insight .mp-emblem img {
    opacity: 1;
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--c, #7ab8e8) 16%, transparent));
  }
  .mp-latest.state-insight .mp-latest-main .mp-emblem img {
    filter: drop-shadow(0 0 7px color-mix(in srgb, var(--c, #7ab8e8) 30%, transparent));
  }
  .mp-rec.state-insight .mp-free .mp-emblem img {
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--c, #7ab8e8) 18%, transparent));
  }

  .mp-badge.state-insight .mp-emblem img {
    filter: drop-shadow(0 0 7px color-mix(in srgb, var(--c, #7ab8e8) 36%, transparent));
  }

  /* ---- LATEST RESULT ---- */
  .mp-latest { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; }

  /* ---- 購入状態の見た目（LATEST RESULT／YOUR COLLECTION／THE RECORDSで共通の考え方） ----
     未購入：LOCKEDを静かに表示し、元素色は弱く静かな枠のまま。
     購入済：状態文字は出さず、元素色の枠・エンブレム・ごく薄い背景光で静かに煌めく（ネオンにはしない）。 */
  .mp-latest.state-record, .mp-latest.state-insight {
    border-color: color-mix(in srgb, var(--lc, #7ab8e8) 33%, var(--card-border));
    background: linear-gradient(160deg, color-mix(in srgb, var(--lc, #7ab8e8) 8%, transparent), var(--card-bg) 55%);
  }
  /* 購入済み：暗い紺をベースに、元素色（左上）と、その明るい色（右下）の淡いにじみを重ねる。文字の下地は暗いまま。 */
  .mp-latest.state-insight {
    border-color: color-mix(in srgb, var(--lc, #7ab8e8) 46%, #3a3552);
    background:
      radial-gradient(ellipse 75% 60% at 18% 12%, color-mix(in srgb, var(--lc, #7ab8e8) 13%, transparent), transparent 72%),
      radial-gradient(ellipse 70% 55% at 100% 100%, color-mix(in srgb, var(--lc2, #7ab8e8) 8%, transparent), transparent 70%),
      linear-gradient(165deg, color-mix(in srgb, var(--lc, #7ab8e8) 7%, #0b0a18), #0b0a18 60%);
    box-shadow:
      0 0 12px color-mix(in srgb, var(--lc, #7ab8e8) 13%, transparent),
      0 0 28px color-mix(in srgb, var(--lc, #7ab8e8) 5%, transparent),
      inset 0 1px 0 color-mix(in srgb, var(--lc2, #7ab8e8) 18%, transparent),
      inset 0 0 26px color-mix(in srgb, var(--lc, #7ab8e8) 6%, transparent);
  }
  .mp-rec.state-record { border-color: color-mix(in srgb, var(--lc, #7ab8e8) 20%, var(--card-border)); }
  /* にじみの上でも補助テキストの読みやすさを無地のとき以上に保つため、購入済みカード内だけ補助色をわずかに明るく */
  .mp-latest.state-insight, .mp-rec.state-insight { --fg-dim: #7d7799; }
  .mp-rec.state-insight {
    border-color: color-mix(in srgb, var(--lc, #7ab8e8) 42%, #3a3552);
    background:
      radial-gradient(ellipse 55% 140% at 0% 0%, color-mix(in srgb, var(--lc, #7ab8e8) 11%, transparent), transparent 70%),
      radial-gradient(ellipse 45% 120% at 100% 100%, color-mix(in srgb, var(--lc2, #7ab8e8) 5%, transparent), transparent 70%),
      var(--card-bg);
    box-shadow:
      0 0 7px color-mix(in srgb, var(--lc, #7ab8e8) 8%, transparent);
  }
  /* 開いた本文は情報優先：にじみは見出し側だけに留め、本文の下地は暗いまま */
  .mp-rec.state-insight[open] { background:
      radial-gradient(ellipse 60% 220px at 0% 0%, color-mix(in srgb, var(--lc, #7ab8e8) 11%, transparent), transparent 75%),
      radial-gradient(ellipse 50% 260px at 100% 100%, color-mix(in srgb, var(--lc2, #7ab8e8) 5%, transparent), transparent 75%),
      var(--card-bg); }
  .mp-latest.state-insight .mp-emblem::before, .mp-rec.state-insight .mp-emblem::before {
    opacity: .82; box-shadow: 0 0 9px color-mix(in srgb, var(--c, #7ab8e8) 38%, transparent);
  }
  .mp-latest.state-insight .mp-emblem::after, .mp-rec.state-insight .mp-emblem::after { opacity: .30; }
  .mp-latest.state-insight .mp-emblem svg, .mp-rec.state-insight .mp-emblem svg {
    filter:
      drop-shadow(0 0 4px color-mix(in srgb, var(--c, #7ab8e8) 70%, transparent))
      drop-shadow(0 0 9px color-mix(in srgb, var(--c, #7ab8e8) 24%, transparent));
  }
  .mp-latest-main { display: flex; gap: 10px; align-items: flex-start; }
  .mp-latest-info { flex: 1; min-width: 0; }
  .mp-chip-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mp-chip { font-size: 11px; line-height: 16px; letter-spacing: .5px; border: 1px solid var(--card-border); border-radius: 4px; padding: 1px 7px; color: var(--fg-dim); }
  .mp-chip.new { background: var(--accent-dim); border-color: var(--accent); color: #e0f4ff; }
  .mp-chip.insight { border-color: #c0a860; color: #c0a860; }
  /* 未解放：LOCKEDを強調せず静かに示す（点線・淡色・背景なし） */
  .mp-chip.locked { border-style: dotted; border-color: #4a4566; color: #8a84a6; background: transparent; letter-spacing: .04em; padding: 1px 6px; }
  .mp-chip.legacy { border-style: dashed; }
  .mp-latest-code { font-size: 12px; color: var(--fg-dim); margin-top: 6px; letter-spacing: 1px; }
  .mp-latest-code b { color: var(--fg); font-weight: 700; margin-right: 8px; }
  .mp-latest-combo { font-size: 18px; font-weight: 700; margin-top: 2px; line-height: 1.5; }
  .mp-latest-mirror { font-size: 12px; color: var(--fg-dim); margin-top: 2px; }
  .mp-btn-row { display: flex; gap: 8px; margin-top: 14px; }
  .mp-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer; text-decoration: none; font-family: inherit; border: 1px solid var(--accent-dim); background: transparent; color: var(--accent); }
  .mp-btn.primary { background: linear-gradient(135deg, #1a4a78, #2a6a9a); border-color: #2a6a9a; color: #e0f4ff; }
  .mp-btn.full { width: 100%; flex: none; }
  .mp-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .mp-notice { margin-top: 14px; padding: 12px; border: 1px solid var(--card-border); border-radius: 8px; text-align: center; background: rgba(255,255,255,0.01); }
  .mp-notice p { font-size: 11.5px; color: var(--fg-dim); margin-bottom: 8px; }
  .mp-latest-fold { margin-top: 12px; border-top: 1px solid var(--card-border); }
  .mp-latest-fold > summary {
    list-style: none; cursor: pointer; min-height: 44px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; color: var(--fg-dim); font-size: 11.5px;
    letter-spacing: .04em; padding: 10px 2px 2px;
  }
  .mp-latest-fold > summary::-webkit-details-marker { display: none; }
  .mp-latest-fold > summary::after { content: '⌄'; font-size: 13px; color: var(--fg-dim); }
  .mp-latest-fold[open] > summary::after { content: '⌃'; }
  .mp-latest-fold-body { padding-top: 2px; }

  /* ---- INSIGHT 要点カード ---- */
  .mp-insight-head { display: flex; align-items: baseline; gap: 6px; margin: 14px 0 8px; padding-left: 7px; border-left: 2px solid #c0a860; font-size: 11px; color: var(--fg-dim); }
  .mp-insight-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  /* 領域ごとのアクセント（見出し・ゲージ・主要語だけに使い、背景・本文・罫線は既存の暗色のまま）
     パーソナリティ＝紫〜薄紅／行動スタイル＝琥珀〜金／価値観＝青緑〜水色 */
  .mp-insight-card { --d1: #b48ad8; --d2: #d9aed6; --g1: #7a52a8; --g2: #cfa0d0;
    border: 1px solid var(--card-border); border-left: 2px solid var(--g1); border-radius: 6px; padding: 10px 12px; background: rgba(255,255,255,0.012); min-width: 0; }
  .mp-insight-card[data-domain="style"], .mp-insight-card[data-domain="motive"] { --d1: #dcae5a; --d2: #e6cc8c; --g1: #a8702a; --g2: #e0c070; }
  .mp-insight-card[data-domain="values"] { --d1: #5cc4b0; --d2: #92d4dc; --g1: #1f8a7e; --g2: #7cc8d8; }
  .mp-insight-card[data-domain="mirror"] { --d1: #a9bfe6; --d2: #cbd8f0; --g1: #5f7fb8; --g2: #b8cbee; }
  .mp-insight-card .t { font-size: 11.5px; color: var(--d1); font-weight: 700; margin-bottom: 4px; letter-spacing: .5px; }
  .mp-insight-card .tag { font-size: 14px; font-weight: 700; line-height: 1.6; margin-bottom: 6px; word-break: keep-all; overflow-wrap: anywhere; }
  .mp-insight-card .tag .a1 { color: var(--d1); }
  .mp-insight-card .tag .a2 { color: var(--d2); opacity: .82; font-weight: 600; }
  .mp-insight-card .v .nat { font-weight: 700; }
  .mp-insight-card[data-domain="motive"] .tag .a1, .mp-insight-card[data-domain="motive"] .tag .a2 { display: inline-block; white-space: nowrap; }
  .mp-insight-card .v.mp-ennea-code { font-family: 'IM Fell English', serif; font-size: 20px; letter-spacing: 1px; line-height: 1.3; margin-bottom: 2px; }
  .mp-insight-card .v { font-size: 12px; color: var(--fg-dim); line-height: 1.7; word-break: break-word; }
  .mp-insight-card .n { font-size: 11px; line-height: 1.6; color: var(--fg-dim); opacity: .75; margin-top: 4px; }

  /* ---- 細いゲージ（実測値 0〜100。購入済みの要点でのみ使用） ---- */
  .mp-gauge { display: grid; grid-template-columns: 5.5em 1fr 2.2em; align-items: center; gap: 8px; font-size: 11.5px; color: var(--fg-dim); padding: 2px 0; }
  .mp-gauge .nm { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-gauge .track { height: 4px; border-radius: 2px; background: #1a1630; overflow: hidden; }
  .mp-gauge .fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--g1, #7a52a8), var(--g2, #cfa0d0)); box-shadow: 0 0 4px color-mix(in srgb, var(--g2, #cfa0d0) 35%, transparent); }
  .mp-gauge .val { text-align: right; font-variant-numeric: tabular-nums; }
  .mp-gauge.mp-mirror-row { grid-template-columns: 6.5em 1fr 2.8em; }
  .mp-gauge.mp-mirror-row .nm { font-weight: 700; }

  /* ---- 視覚要約（無料公開範囲：元素TOP3の相対バー・MIRROR一致度） ---- */
  .mp-viz { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--card-border); }
  .mp-viz-title { font-size: 11px; color: var(--fg-dim); letter-spacing: 1px; margin-bottom: 6px; }
  .mp-eltop { margin-bottom: 7px; }
  .mp-eltop:last-child { margin-bottom: 0; }
  .mp-eltop-label { font-size: 12px; display: flex; align-items: baseline; gap: 6px; }
  .mp-eltop-label .ax { font-size: 11px; color: var(--fg-dim); }
  .mp-eltop-track { height: 5px; border-radius: 3px; background: #0a0916; overflow: hidden; margin-top: 3px; }
  .mp-eltop-fill { position: relative; height: 100%; border-radius: 3px; background: var(--elc); opacity: .55; }
  .mp-eltop-fill.r1 { opacity: 1; }
  .mp-eltop-label .el { color: var(--elc); font-weight: 400; }
  .mp-eltop-label .el.r1 { font-weight: 700; }
  /* 購入済み：元素名・マーカー・バーをわずかに明るく。1位のバー先端にだけごく弱い光 */
  .state-insight .mp-eltop-label .el { color: color-mix(in srgb, var(--elc) 78%, #ffffff); }
  .state-insight .mp-eltop-fill { background: linear-gradient(90deg, var(--elc), var(--elc2, var(--elc))); opacity: .72; }
  .state-insight .mp-eltop-fill.r1 { opacity: 1; }
  .state-insight .mp-eltop-track { overflow: visible; background: color-mix(in srgb, var(--lc, #7ab8e8) 10%, #0a0916); }
  .state-insight .mp-eltop-fill.r1::after {
    content: ''; position: absolute; right: -1px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%;
    background: var(--elc2, var(--elc)); opacity: .55;
    box-shadow: 0 0 6px color-mix(in srgb, var(--elc2, var(--elc)) 45%, transparent);
  }
  .mp-ring { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px; }
  .mp-ring svg { width: 64px; height: 64px; }
  .mp-ring .arc { stroke: var(--rc); }
  .mp-ring .base { stroke: #1a1630; }
  /* 購入済み：円周を少し明るく（MIRRORキャラの元素色が確定していればその色）、外側にごく弱い光。数値は白飛びさせない */
  .state-insight .mp-ring .arc { stroke: color-mix(in srgb, var(--rc) 85%, #ffffff); }
  .mp-ring .arc-g { display: none; }
  .state-insight .mp-ring .arc-g { display: inline; }
  .state-insight .mp-ring .arc { display: none; }
  .state-insight .mp-ring .who { filter: brightness(1.15); }
  .state-insight .mp-ring .base { stroke: color-mix(in srgb, var(--rc) 18%, #15122a); }
  .state-insight .mp-ring svg { filter: drop-shadow(0 0 4px color-mix(in srgb, var(--rc) 26%, transparent)); }
  .mp-ring .lbl { font-size: 10.5px; color: var(--fg-dim); letter-spacing: 1px; }
  /* MIRRORのキャラクター名はリングの主役として大きめ・太字で */
  .mp-ring .who { font-size: 15px; font-weight: 700; letter-spacing: .04em; color: var(--fg); max-width: 96px; text-align: center; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }

  /* ---- 購入状態を確認できなかった場合（中立表示。購入導線は出さない） ---- */
  .mp-ent-warn { margin-top: 14px; padding: 12px; border: 1px dashed var(--card-border); border-radius: 8px; text-align: center; }
  .mp-ent-warn p { font-size: 12px; color: var(--fg); margin-bottom: 4px; }
  .mp-ent-warn .sub { font-size: 11px; color: var(--fg-dim); margin-bottom: 10px; line-height: 1.7; }

  /* ---- YOUR COLLECTION ---- */
  .mp-col-wrap { position: relative; }
  .mp-col-count { margin-left: auto; font-size: 11px; color: var(--fg-dim); letter-spacing: .5px; }
  .mp-col-wrap.has-more::after {
    content: ''; position: absolute; top: 0; right: 0; bottom: 10px; width: 36px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--bg) 88%);
  }
  .mp-col-next {
    position: absolute; right: 2px; top: 44px; z-index: 1; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--card-border); background: rgba(16,14,28,0.9); color: var(--fg-dim);
    font-size: 16px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  .mp-col-next:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mp-col-wrap.at-end::after, .mp-col-wrap.at-end .mp-col-next { display: none; }
  .mp-collection { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; scroll-padding-inline: 2px; -webkit-overflow-scrolling: touch; }
  .mp-badge {
    --badge-c: var(--el-color, var(--accent));
    flex: 0 0 96px; scroll-snap-align: start; display: flex; flex-direction: column;
    align-items: center; gap: 5px; padding: 13px 6px 11px; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--badge-c) 26%, var(--card-border));
    background: radial-gradient(circle at 50% 24%, color-mix(in srgb, var(--badge-c) 8%, transparent), transparent 54%), var(--card-bg);
    color: var(--fg); cursor: pointer; font-family: inherit;
  }
  .mp-badge .nm { font-size: 13px; font-weight: 700; }
  .mp-badge .dt { font-size: 11px; color: var(--fg-dim); }
  .mp-badge .st {
    font-size: 11px; letter-spacing: .12em; border: 1px dotted color-mix(in srgb, var(--badge-c) 24%, var(--card-border));
    border-radius: 999px; padding: 1px 9px; color: var(--fg-dim); margin-top: 1px; opacity: .78;
  }
  /* YOUR COLLECTION：1件ずつのカード。解放前は地味な暗い枠、解放後は元素色の濃い枠と静かな光＋元素色のINSIGHT。 */
  .mp-badge.state-record {
    border-color: color-mix(in srgb, var(--badge-c) 14%, #26223a);
    background: var(--card-bg);
    box-shadow: none;
  }
  .mp-badge.state-insight {
    border-color: color-mix(in srgb, var(--badge-c2, var(--badge-c)) 48%, #2a2640);
    background:
      radial-gradient(circle 56px at 50% 48px, color-mix(in srgb, var(--badge-c) 16%, transparent), transparent 100%),
      linear-gradient(180deg, color-mix(in srgb, var(--badge-c) 6%, var(--card-bg)), var(--card-bg) 70%);
    box-shadow:
      0 0 10px color-mix(in srgb, var(--badge-c) 12%, transparent),
      inset 0 0 14px color-mix(in srgb, var(--badge-c) 6%, transparent);
  }
  .mp-badge.state-insight .nm {
    text-shadow: 0 0 7px color-mix(in srgb, var(--badge-c) 10%, transparent);
  }
  /* INSIGHT：元素色で塗りつぶし、文字はその元素色を溶かした濃い色（明るい元素色の上で読める濃さ） */
  .mp-badge .st.insight {
    border: 1px solid color-mix(in srgb, var(--badge-c2, var(--badge-c)) 82%, var(--badge-c));
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--badge-c2, var(--badge-c)) 92%, #ffffff),
      color-mix(in srgb, var(--badge-c2, var(--badge-c)) 70%, var(--badge-c)));
    color: color-mix(in srgb, var(--badge-c) 30%, #0b0a18);
    font-weight: 700; border-radius: 4px; letter-spacing: .14em; opacity: 1;
  }



  /* ---- 購入済みの装飾フレーム：内側の細い二重線・四隅の菱形・上下中央の元素紋（7元素で紋が変わる） ---- */
  .mp-latest.state-insight, .mp-rec.state-insight, .mp-badge.state-insight { position: relative; }
  .mp-orn { position: absolute; inset: 5px; pointer-events: none; z-index: 0;
    border: 1px solid color-mix(in srgb, var(--oc) 30%, transparent); border-radius: 5px; }
  .mp-latest > .mp-orn { border-radius: 7px; }
  .mp-orn i { position: absolute; display: block; }
  /* 四隅：小さな菱形の光点 */
  .mp-orn .k { width: 3.5px; height: 3.5px; transform: rotate(45deg);
    background: linear-gradient(135deg, color-mix(in srgb, var(--oc2) 70%, #ffffff), var(--oc));
    opacity: .85; box-shadow: 0 0 3px color-mix(in srgb, var(--oc) 45%, transparent); }
  .mp-orn .k.tl { top: -2.25px; left: -2.25px; } .mp-orn .k.tr { top: -2.25px; right: -2.25px; }
  .mp-orn .k.bl { bottom: -2.25px; left: -2.25px; } .mp-orn .k.br { bottom: -2.25px; right: -2.25px; }
  /* 上下中央：元素紋と、その左右に伸びる明るい線 */
  .mp-orn .ln { left: 50%; width: 58%; max-width: 220px; height: 1px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--oc2) 75%, transparent) 42%, transparent 46%, transparent 54%, color-mix(in srgb, var(--oc2) 75%, transparent) 58%, transparent); }
  .mp-orn .ln.t { top: -1px; } .mp-orn .ln.b { bottom: -1px; }
  .mp-orn .m { left: 50%; width: 11px; height: 11px; margin-left: -5.5px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--oc2) 70%, #ffffff), var(--oc));
    -webkit-mask: var(--om) center / contain no-repeat; mask: var(--om) center / contain no-repeat;
    filter: drop-shadow(0 0 3px color-mix(in srgb, var(--oc) 80%, transparent)); }
  .mp-orn .m.t { top: -6px; } .mp-orn .m.b { bottom: -6px; }
  /* THE RECORDS：閉じた状態でも見えるようsummary内に置き、details全体に掛ける */
  .mp-rec > summary > .mp-orn { border-radius: 4px; }
  .mp-badge > .mp-orn { inset: 4px; border-radius: 7px; }
  .mp-badge > .mp-orn .ln { width: 80%; }
  .mp-badge > .mp-orn .m { width: 9px; height: 9px; margin-left: -4.5px; }
  .mp-badge > .mp-orn .m.t { top: -5px; } .mp-badge > .mp-orn .m.b { bottom: -5px; }
  .mp-latest.state-insight > :not(.mp-orn), .mp-badge.state-insight > :not(.mp-orn) { position: relative; z-index: 1; }

  /* ---- THE RECORDS ---- */
  .mp-rec { border: 1px solid var(--card-border); border-radius: 8px; background: var(--card-bg); margin-bottom: 8px; overflow: hidden; }
  .mp-rec > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 48px; padding: 12px 14px; font-size: 12.5px; }
  .mp-rec > summary::-webkit-details-marker { display: none; }
  .mp-rec > summary .d { color: var(--fg-dim); font-size: 11.5px; flex: 0 0 auto; }
  /* 診断結果（元素 × 武器 × 国家）と札（NEW・COMPLETE 等）を重ねない：結果は 11em を目安に幅を取り、足りなければ札が次の行へ回る。
     それでも入らない狭い画面では、結果の中で折り返す（はみ出して札の下に潜らない） */
  .mp-rec > summary .c { flex: 1 1 11em; min-width: 0; word-break: keep-all; overflow-wrap: anywhere; }
  .mp-rec > summary .mp-chip-row { flex: 0 1 auto; min-width: 0; }
  .mp-rec > summary .c .el { font-weight: 700; }
  .mp-rec > summary::after { content: '⌄'; color: var(--fg-dim); font-size: 13px; }
  .mp-rec[open] > summary::after { content: '⌃'; }
  .mp-rec-body { padding: 4px 14px 16px; border-top: 1px solid var(--card-border); }
  .mp-free { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 12px; }
  .mp-free-list { font-size: 11.5px; color: var(--fg-dim); line-height: 1.8; }
  .mp-free-list b { color: var(--fg); font-weight: 400; }
  /* 意味色：値だけに色を付け、ラベルは既存の淡色のまま */
  .mp-x { color: #5a5478; font-weight: 400; margin: 0 .2em; }
  .mp-cw { white-space: nowrap; }
  /* 購入済みだけ：意味色からその明るい色へのグラデーション文字（未購入は単色のまま） */
  .state-insight .mp-gt {
    background: linear-gradient(90deg, var(--gc), color-mix(in srgb, var(--gc) 50%, #ffffff));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  }
  .mp-typecode { letter-spacing: 1.5px; font-weight: 700 !important; }
  .mp-pct { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 700; margin-left: 2px; }
  .mp-then { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--card-border); font-size: 11.5px; color: var(--fg-dim); line-height: 1.8; }
  .mp-then-title { font-size: 11px; color: var(--fg); margin-bottom: 2px; }
  .mp-locked-title { margin-top: 14px; font-size: 11px; color: var(--fg); }
  .mp-lockbox { margin-top: 4px; }
  .mp-seen { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--card-border); border-radius: 6px; background: rgba(255,255,255,0.012); }
  .mp-seen-title { font-size: 11px; color: var(--fg-dim); margin-bottom: 4px; }
  .mp-seen-list { list-style: none; margin: 0; padding: 0; }
  .mp-seen-list li { font-size: 12px; color: var(--fg); line-height: 1.8; }
  .mp-seen-list li::before { content: '✓'; color: var(--accent); margin-right: 6px; font-size: 11px; }
  .mp-locked-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--card-border); }
  .mp-locked-row .t { font-size: 12px; color: var(--fg); flex: 0 0 auto; }
  .mp-locked-row .blur { flex: 1; font-size: 11px; color: var(--fg-dim); filter: blur(3.5px); user-select: none; overflow: hidden; white-space: nowrap; }
  .mp-locked-row .lk { flex: 0 0 auto; font-size: 12px; opacity: .8; }
  .mp-locked-row .txt { flex: 1; min-width: 0; }
  .mp-locked-row .cap { display: block; font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
  /* 実値を持たない輪郭だけのゲージ（「情報が存在する」ことだけを示す） */
  .mp-locked-row .ghost { display: block; height: 4px; margin-top: 6px; border-radius: 2px; border: 1px dashed var(--card-border); background: repeating-linear-gradient(90deg, rgba(122,184,232,0.10) 0 8px, transparent 8px 14px); }
  .mp-rec-cta-note { font-size: 11.5px; color: var(--fg-dim); margin: 14px 0 8px; text-align: center; }

  /* ---- 未購入の訴求：まだ読み解いていないもの（元素色で「中に何かある」気配を出す。実値は出さない） ---- */
  .mp-lockbox .mp-locked-title { color: #cfcae4; letter-spacing: .06em; }
  /* 各項目の色は購入後の解析カードと同じ領域色（パーソナリティ＝紫／行動スタイル・動機＝琥珀／価値観＝青緑／MIRROR＝銀青） */
  .mp-lockbox .mp-locked-row { --dc1: #b48ad8; --dc2: #d9aed6; }
  .mp-lockbox .mp-locked-row[data-domain="style"], .mp-lockbox .mp-locked-row[data-domain="motive"] { --dc1: #dcae5a; --dc2: #e6cc8c; }
  .mp-lockbox .mp-locked-row[data-domain="values"] { --dc1: #5cc4b0; --dc2: #92d4dc; }
  .mp-lockbox .mp-locked-row[data-domain="mirror"] { --dc1: #a9bfe6; --dc2: #cbd8f0; }
  .mp-lockbox .mp-locked-row {
    position: relative; padding: 9px 0 9px 12px;
    border-bottom-color: color-mix(in srgb, var(--dc1) 16%, var(--card-border));
    background: linear-gradient(90deg, color-mix(in srgb, var(--dc1) 8%, transparent), transparent 60%);
  }
  .mp-lockbox .mp-locked-row::before {
    content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 1px;
    background: linear-gradient(180deg, var(--dc2), var(--dc1)); opacity: .8;
  }
  .mp-lockbox .mp-locked-row .t { color: var(--dc1); font-weight: 700; }
  .mp-lockbox .mp-locked-row .cap { color: color-mix(in srgb, var(--dc2) 30%, #8e88aa); }
  .mp-lockbox .mp-locked-row .ghost {
    border-color: color-mix(in srgb, var(--dc1) 30%, var(--card-border));
    background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--dc1) 26%, transparent) 0 8px, transparent 8px 14px);
  }
  .mp-lockbox .mp-locked-row .lk { opacity: 1; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--dc1) 45%, transparent)); }
  .mp-lockbox .mp-rec-cta-note { color: #9a94b6; }
  /* 購入CTA：元素ごとの深いグラデーション＋明るい元素色の縁と弱い光（白文字の読みやすさを保つ濃さ） */
  .mp-lockbox > a.mp-btn.primary, .mp-lockbox .mp-rec-actions > a.mp-btn.primary {
    min-height: 50px; font-size: 13.5px; letter-spacing: .04em; color: #ffffff;
    border: 1px solid transparent;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.06), transparent 45%),
      linear-gradient(135deg, color-mix(in srgb, var(--lc, #7ab8e8) 50%, #0b0a18), color-mix(in srgb, var(--lc, #7ab8e8) 70%, #0b0a18) 55%, color-mix(in srgb, color-mix(in srgb, var(--lc, #7ab8e8) 85%, var(--lc2, #7ab8e8)) 70%, #0b0a18));
    box-shadow:
      0 0 10px color-mix(in srgb, var(--lc, #7ab8e8) 16%, transparent),
      0 3px 10px rgba(0,0,0,0.30);
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .mp-detail-link { display: inline-block; margin-top: 14px; font-size: 12px; color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent-dim); padding: 6px 0 1px; }
  .mp-btn.ghost { border-color: var(--card-border); color: var(--fg-dim); }
  .mp-btn:focus-visible, .mp-badge:focus-visible, .mp-rec > summary:focus-visible, .mp-account-row:focus-visible, .mp-detail-link:focus-visible, .lock-cta-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- RE-DIAGNOSIS / ACCOUNT ---- */
  .mp-rediag { text-align: center; }
  .mp-rediag-copy { font-size: 13px; color: var(--fg); margin-bottom: 12px; line-height: 1.8; }
  .mp-rediag-note { font-size: 11px; color: var(--fg-dim); margin-top: 10px; line-height: 1.7; }
  .mp-account { border: 1px solid var(--card-border); border-radius: 8px; background: var(--card-bg); }
  .mp-account-row { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 44px; padding: 12px 14px; background: transparent; border: none; color: var(--fg); font-size: 12px; font-family: inherit; cursor: pointer; text-align: left; }
  .mp-account-row + .mp-account-row, .mp-account details + .mp-account-row { border-top: 1px solid var(--card-border); }
  .mp-account details > summary { list-style: none; }
  .mp-account details > summary::-webkit-details-marker { display: none; }
  .mp-account-body { padding: 0 14px 12px; font-size: 11px; color: var(--fg-dim); line-height: 1.8; }
  .mp-login { padding: 12px 14px; border-bottom: 1px solid var(--card-border); }
  .mp-login-title { font-size: 12px; color: var(--fg); margin-bottom: 4px; }
  .mp-login-note { font-size: 11px; color: var(--fg-dim); line-height: 1.8; margin-bottom: 8px; }
  .mp-login-row { display: flex; justify-content: space-between; align-items: center; min-height: 36px; font-size: 12px; color: var(--fg); }
  .mp-login-row + .mp-login-row { border-top: 1px dashed var(--card-border); }
  .mp-login-on { font-size: 11px; color: var(--accent); }
  .mp-login-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--accent); border-radius: 6px; padding: 6px 12px; font-size: 11px; font-family: inherit; cursor: pointer; }
  .mp-login-btn[disabled] { opacity: .6; cursor: default; }
  .mp-login-unlink { background: transparent; border: none; color: var(--fg-dim); font-size: 11px; font-family: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; margin-left: 10px; padding: 4px; }
  .mp-login-unlink[disabled] { opacity: .5; cursor: default; }
  .mp-login-msg { font-size: 11px; line-height: 1.7; color: #d6a8b8; margin-top: 6px; }
  .mp-login-msg:empty { display: none; }
  .empty-hint { margin-top: 12px; font-size: 11.5px; color: var(--fg-dim); line-height: 1.8; }
  .mp-uid { font-family: monospace; font-size: 10.5px; word-break: break-all; color: var(--fg-dim); }

  @media (prefers-reduced-motion: reduce) { .mp-collection { scroll-behavior: auto; } }

  /* ============================================================
     完全解析（PREVIEW ONLY の状態表示）：右上の小さな入口・状態別シート・complete記録の静かな強調
     既存の集計・LOCKED・解析レポート導線は変更しない。追従・点滅・回転はしない。
     色は役割ごとのトークンで分ける（白一色にしない）：
       見出し --ca-title／本文 --ca-body／補足・英字 --ca-muted／罫 --ca-line／価格・補助 --ca-gold
       人物像 --ca-mirror・--ca-hidden・--ca-mentor／元素色 --ca-el（最新結果から渡す）
     ============================================================ */
  :root {
    --ca-title: #e0dcf0; --ca-body: #aaa5bb; --ca-muted: #817b96; --ca-line: #2d2944;
    --ca-gold: #c9a860; --ca-mirror: #83b9da; --ca-hidden: #ac82d4; --ca-mentor: #d3ad68;
    --ca-view: #9fc3dd;
  }
  .archive-header__topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .archive-upgrade-trigger {
    position: relative; flex: none; height: 36px; padding: 0 14px; border-radius: 10px;
    background: rgba(10, 12, 24, .72); color: var(--fg); font-family: inherit; font-size: 12.5px; letter-spacing: .06em; white-space: nowrap; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--uc, #7ab8e8) 26%, transparent);
    box-shadow: 0 0 10px color-mix(in srgb, var(--uc, #7ab8e8) 6%, transparent);
    transition: border-color .2s, color .2s, box-shadow .2s;
  }
  /* 見た目は36px、タップ領域は44px相当を確保する */
  .archive-upgrade-trigger::after { content: ''; position: absolute; inset: -4px -2px; }
  .archive-upgrade-trigger:hover, .archive-upgrade-trigger:focus-visible {
    border-color: color-mix(in srgb, var(--uc, #7ab8e8) 48%, transparent); color: #ece6fa;
    box-shadow: 0 0 12px color-mix(in srgb, var(--uc, #7ab8e8) 9%, transparent);
  }
  .archive-upgrade-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .archive-upgrade-trigger.is-ready { border-color: color-mix(in srgb, var(--uc, #7ab8e8) 38%, transparent); color: #e6e0f4; }
  @media (max-width: 340px) { .archive-upgrade-trigger { font-size: 11px; padding: 0 10px; } }

  /* ---- シートの外枠（モバイル：下から／デスクトップ：中央） ---- */
  .ca-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .68); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .ca-overlay[hidden] { display: none; }
  .ca-sheet {
    position: relative; display: flex; flex-direction: column; width: min(480px, 100%); max-height: 80vh;
    background: linear-gradient(180deg, color-mix(in srgb, var(--ca-el-line, #7ab8e8) 5%, #0d0d1a), #0b0c17 220px);
    color: var(--ca-body); border-radius: 14px; overflow: hidden;
    border: 1px solid color-mix(in srgb, var(--ca-el-line, #7ab8e8) 35%, transparent);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  }
  .ca-sheet::before { content: ''; position: absolute; top: 0; left: 12%; right: 12%; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ca-el, #7ab8e8) 80%, #ffffff), transparent); }
  .ca-sheet:focus { outline: none; }
  /* 閉じるボタンはスクロールしない帯に置き、本文と重ならない */
  .ca-sheet-bar { flex: none; display: flex; justify-content: flex-end; height: 46px; padding: 2px 4px 0; }
  .ca-close { width: 44px; height: 44px; border: none; border-radius: 50%; background: transparent; color: var(--ca-muted); font-size: 19px; line-height: 1; cursor: pointer; font-family: inherit; position: relative; }
  .ca-close::before { content: ''; position: absolute; inset: 8px; border-radius: 50%; background: #15142a; border: 1px solid var(--ca-line); z-index: -1; }
  .ca-close { z-index: 0; isolation: isolate; }
  .ca-close:hover, .ca-close:focus-visible { color: var(--ca-title); }
  .ca-close:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ca-sheet-scroll { overflow-y: auto; overscroll-behavior: contain; padding: 0 20px 26px; -webkit-overflow-scrolling: touch; }
  @media (max-width: 599px) {
    .ca-overlay { align-items: flex-end; padding: 0; }
    .ca-sheet { width: 100%; max-height: 85vh; max-height: 85dvh; border-radius: 18px 18px 0 0; border-bottom: none; }
    .ca-sheet-scroll { padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
  }

  /* ---- 文字の役割 ---- */
  .ca-eyebrow { font-family: 'IM Fell English', serif; font-size: 10.5px; letter-spacing: .2em; color: var(--ca-muted); text-transform: uppercase; }
  .ca-meta { font-size: 11px; color: var(--ca-muted); line-height: 1.7; letter-spacing: .04em; }
  .ca-title { font-size: 15px; font-weight: 700; color: var(--ca-title); letter-spacing: .06em; margin-top: 4px; }
  .ca-body { font-size: 12.5px; color: var(--ca-body); line-height: 1.9; margin-top: 6px; }
  .ca-status { font-size: 10.5px; letter-spacing: .14em; color: var(--ca-gold); border: 1px solid color-mix(in srgb, var(--ca-gold) 45%, transparent); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
  .ca-card-head, .ca-rec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

  /* ---- 冒頭の記録票 ---- */
  .ca-record-slip { border-bottom: 1px solid var(--ca-line); padding: 2px 0 16px; }
  .ca-record-slip .ca-meta { margin-top: 2px; }
  .ca-slip-combo { margin-top: 8px; font-size: 19px; font-weight: 700; letter-spacing: .06em; line-height: 1.5; }
  .ca-slip-combo .mp-x { color: #4f4a66; }
  .ca-slip-code { margin-top: 2px; font-size: 12px; letter-spacing: .06em; }
  .ca-slip-typecode { font-family: 'IM Fell English', serif; color: color-mix(in srgb, var(--ca-el, #7ab8e8) 70%, #0b0c17); font-weight: 700; }
  .ca-slip-sep { color: #4f4a66; margin: 0 4px; }
  .ca-slip-typename { color: var(--ca-body); }
  .ca-lead { margin-top: 20px; padding-left: 12px; border-left: 2px solid color-mix(in srgb, var(--ca-el, #7ab8e8) 75%, transparent); font-size: 14px; font-weight: 400; color: var(--ca-body); line-height: 1.85; letter-spacing: .04em; }
  .ca-state-head { margin-top: 24px; }
  .ca-state-head .ca-lead { margin-top: 6px; }
  .ca-state-title { word-break: auto-phrase; margin-top: 8px; font-size: 18px; font-weight: 700; color: var(--ca-el, var(--ca-title)); letter-spacing: .05em; line-height: 1.6; }
  .ca-state-head.is-unknown .ca-state-title { color: var(--ca-view); font-size: 15px; }
  .ca-state-head.is-unknown .ca-body { color: var(--ca-muted); }

  /* ---- 商品カード ---- */
  .ca-card { margin-top: 24px; }
  .ca-card--primary {
    position: relative; padding: 18px 16px 16px; border-radius: 10px;
    background: color-mix(in srgb, var(--ca-el-line, #7ab8e8) 6%, #111223);
    border: 1px solid color-mix(in srgb, var(--ca-el-line, #7ab8e8) 34%, var(--ca-line));
  }
  .ca-card--primary::before { content: ''; position: absolute; left: 14px; right: 14px; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ca-el, #7ab8e8) 85%, #ffffff), transparent); }
  .ca-card--secondary { padding: 24px 2px 4px; border-top: 1px solid var(--ca-line); }
  .ca-card--secondary.is-sole { padding-top: 20px; }
  .ca-card--secondary .ca-title { margin-top: 6px; }

  /* 観測項目：1枚の暗色面を細罫で4区画に分ける（箇条書き・チェック・鍵は並べない） */
  .ca-observation-grid { margin: 14px 0 0; display: grid; grid-template-columns: 1fr; border: 1px solid var(--ca-line); border-radius: 8px; background: rgba(8, 8, 18, .55); overflow: hidden; }
  .ca-observation-item { padding: 11px 14px 12px; }
  .ca-observation-item + .ca-observation-item { border-top: 1px solid var(--ca-line); }
  .ca-observation-item dt { font-size: 13.5px; font-weight: 700; letter-spacing: .1em; color: var(--ca-el, #7ab8e8); }
  .ca-observation-item.is-gold dt { color: var(--ca-gold); }
  .ca-observation-item dd { margin-top: 3px; font-size: 12px; color: var(--ca-body); line-height: 1.75; }
  @media (min-width: 420px) {
    .ca-observation-grid { grid-template-columns: 1fr 1fr; }
    .ca-observation-item + .ca-observation-item { border-top: none; }
    .ca-observation-item:nth-child(n+3) { border-top: 1px solid var(--ca-line); }
    .ca-observation-item:nth-child(2n) { border-left: 1px solid var(--ca-line); }
  }

  /* 三つの観測レンズ：左の色線と英字の色、日本語説明で区別する（色が無くても見出しと位置で判別できる） */
  .ca-lens-list { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid var(--ca-line); }
  .ca-lens { position: relative; padding: 12px 2px 12px 14px; border-bottom: 1px solid var(--ca-line); }
  .ca-lens::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px; border-radius: 1px; background: var(--lens-c); }
  .ca-lens--mirror { --lens-c: var(--ca-mirror); }
  .ca-lens--hidden { --lens-c: var(--ca-hidden); }
  .ca-lens--mentor { --lens-c: var(--ca-mentor); }
  .ca-lens-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ca-lens-en { font-family: 'IM Fell English', serif; font-size: 13px; letter-spacing: .16em; color: var(--lens-c); }
  /* 人数・ページ数：日本語が主、英語は小さな補助 */
  .ca-lens-count, .ca-pages { display: inline-flex; flex-direction: column; align-items: flex-end; flex: none; line-height: 1.3; white-space: nowrap; }
  .ca-lens-count-ja { font-size: 12px; color: var(--ca-body); letter-spacing: .06em; }
  .ca-lens-count-en, .ca-pages-en { font-family: 'IM Fell English', serif; font-size: 9.5px; letter-spacing: .16em; color: var(--ca-muted); }
  .ca-pages-ja { font-size: 12px; color: var(--ca-gold); letter-spacing: .08em; }
  .ca-card-head .ca-eyebrow, .ca-rec-head .ca-eyebrow { align-self: flex-start; margin-top: 2px; }
  .ca-lens-desc { display: block; margin-top: 2px; font-size: 12.5px; color: var(--ca-body); line-height: 1.75; }
  .ca-integration { margin-top: 14px; }

  /* 価格は説明の後に一呼吸置いて、淡い金色で */
  .ca-price-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 20px; padding-top: 12px; border-top: 1px dashed var(--ca-line); }
  .ca-price { flex: none; font-family: 'IM Fell English', serif; font-size: 17px; letter-spacing: .06em; color: var(--ca-gold); white-space: nowrap; }

  /* ---- ボタン：主＝既存解析レポートと同じ塗り／副＝透明＋元素色の枠／閲覧＝透明＋淡い青 ---- */
  .ca-btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-decoration: none; cursor: pointer; }
  .ca-primary-action { background: linear-gradient(135deg, #1a4a78, #2a6a9a); border: 1px solid #2a6a9a; color: #e0f4ff; }
  .ca-secondary-action { background: transparent; border: 1px solid color-mix(in srgb, var(--ca-el-line, var(--lc, #7ab8e8)) 55%, var(--ca-line)); color: var(--ca-title); font-weight: 400; }
  .ca-view-action { background: transparent; border: 1px solid color-mix(in srgb, var(--ca-view) 40%, var(--ca-line)); color: var(--ca-view); font-weight: 400; }
  .ca-quiet-action { background: transparent; border: 1px solid var(--ca-line); color: var(--ca-muted); font-weight: 400; font-size: 13px; min-height: 44px; }
  .ca-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ca-btn[disabled], .ca-btn[aria-disabled="true"] { opacity: .75; cursor: default; color: var(--ca-muted); border-color: var(--ca-line); border-style: dashed; background: transparent; }
  .ca-preview-note { margin-top: 10px; padding-left: 8px; border-left: 2px solid var(--ca-line); font-size: 11px; color: var(--ca-muted); line-height: 1.7; }
  .ca-ineligible { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--ca-line); }
  .ca-ineligible .ca-body { color: var(--ca-muted); }
  .ca-msg { font-size: 11.5px; color: var(--ca-view); line-height: 1.7; margin-top: 8px; }

  /* complete（ready）の記録だけ、紋章・四隅・外周線・ラベル・ボタンを一段深くする。白飛びさせない。 */
  .mp-chip.complete, .mp-badge .st.complete { border-color: color-mix(in srgb, var(--ca-gold) 70%, transparent); color: var(--ca-gold); background: color-mix(in srgb, var(--ca-gold) 10%, transparent); letter-spacing: .14em; }
  .mp-badge .st.complete { border-style: solid; border-radius: 4px; font-weight: 700; opacity: 1; }
  .is-complete.state-insight { box-shadow: 0 0 14px color-mix(in srgb, var(--lc, var(--badge-c, #7ab8e8)) 18%, transparent), inset 0 0 18px color-mix(in srgb, var(--lc, var(--badge-c, #7ab8e8)) 8%, transparent); }

const V2_REPORT_SALES_ENABLED = true;

// 【重要な修正】trackEvent()・savedCountBucket()は、mypage.html内で11箇所・1箇所
// 呼ばれているが、mypage.html自身にもdiagnosis-save.jsにも定義が存在せず、

// テスト側のスタブが偶然この関数を用意していたためで、実コードの不具合を

function trackEvent(name, params) {
  if (typeof gtag === 'function') gtag('event', name, params || {});
}

  let params;

/* ============================================================
   購入状態の確認結果（表示専用）
   diagnosis-save.js の attachPurchasedStatus() は、/api/my-entitlements の失敗を

   ここでは attachPurchasedStatus() の処理・API・照合キーには一切手を加えず、
   その実行中に行われる /api/my-entitlements の応答が正常だったかだけを観測する。

// sessions配列 → その呼び出しでの確認成否。呼び出しごとに独立して記録し、描画は自分のsessionsの結果だけを見る。

  let queue = Promise.resolve();

  if (!mpEntitlementObserverInstalled) return true;

  trackEvent('checkout_start', { offer: offerLabel, source });
  let token = null;
  try { const { data } = await supabaseClient.auth.getSession(); token = data && data.session ? data.session.access_token : null; } catch (e) { token = null; }
  if (!token) return { ok: false, error: 'not_authenticated' };
  let res;
  let out = {};
  try {
    res = await fetch('/api/complete-checkout', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify(body) });
    out = await res.json().catch(() => ({}));
  } catch (e) {
    return { ok: false, error: 'network' };
  }
  if (res.ok && typeof out.checkoutUrl === 'string' && /^https:\/\/checkout\.stripe\.com\//.test(out.checkoutUrl)) {
    trackEvent('checkout_redirect', { offer: out.offer, value: out.amount, currency: 'JPY', source });
    try { sessionStorage.setItem(MP_CHECKOUT_MARK, '1'); } catch (e) { /* 印が無くても「決済をやり直す」で戻せる */ }
    location.assign(out.checkoutUrl);
    return { ok: true };
  }
  trackEvent('checkout_failed', { offer: offerLabel, reason: out.error || 'unknown', source });
  return { ok: false, error: out.error || 'unknown' };
}

async function openPurchasedReport(diagnosisSessionId, button) {
  if (!diagnosisSessionId || !button) return;
  EdNavBusy.hold(button, 'レポートを準備中…');
  const oldError = button.parentElement && button.parentElement.querySelector('.report-open-error');
  if (oldError) oldError.remove();

  try {
    const { data: { session: authSession } } = await supabaseClient.auth.getSession();
    const accessToken = authSession && authSession.access_token;
    if (!accessToken) throw new Error('not_authenticated');

    const response = await fetch('/api/my-report-link', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ diagnosis_session_id: diagnosisSessionId }),
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok || !body.url) throw new Error(body.error || 'link_issue_failed');

    trackEvent('mypage_report_open', { source: 'purchased_report_button' });
    // 保存時のMIRROR版をレポートへ渡す（レポートは診断コードから計算し直すため、版が無いと最新版で表示される）
    let reportUrl = body.url;
    if (button.dataset.mv) reportUrl += (reportUrl.indexOf('?') >= 0 ? '&' : '?') + 'mv=' + button.dataset.mv;
    navigateTo(reportUrl);
    EdNavBusy.handoff(button);
  } catch (err) {
    console.error('purchased report open failed:', err);
    const message = document.createElement('p');
    message.className = 'report-open-error';
    message.textContent = 'レポートを開けませんでした。時間をおいて再度お試しください。';
    button.insertAdjacentElement('afterend', message);
    EdNavBusy.release(button);
  }
}

/* ---- 共有：/api/share（個別OGP）経由。符号化の並び順はshare.js・og-image.mjsと同一。
   キャラクター番号は正本 js/characters118_v2.js（ETI_V2_CHARACTERS）の順序から取得し、

const MP_PACK_ELEMENTS = ["炎","水","氷","雷","風","岩","草"];
const MP_PACK_WEAPONS = ["片手剣","両手剣","長柄","法器","弓"];
const MP_PACK_NATIONS = ["モンド","璃月","稲妻","スメール","フォンテーヌ","ナタ","スネージナヤ","ナドクライ"];
function mpPackShare(el, w, nat, charIdx, match) {
  const e = MP_PACK_ELEMENTS.indexOf(el), wi = MP_PACK_WEAPONS.indexOf(w), n = MP_PACK_NATIONS.indexOf(nat);

function mpShareUrl(r) {
  const s = r.session;

  if (typeof ETI_V2_CHARACTERS === 'undefined' || !Array.isArray(ETI_V2_CHARACTERS)) return null;
  const charIdx = ETI_V2_CHARACTERS.findIndex(c => c && c.name === r.mirror.rawName);
  const p = mpPackShare(r.el, r.w, r.nation, charIdx, r.mirror.match);
  if (!p) return null;
  const q = new URLSearchParams();
  if (!r.isLegacy) q.set('dv', 'ETI-2.0');

  trackEvent('mypage_share_click', { diagnosis_type: r.kind, share_mode: apiUrl ? 'api_share' : 'result_url_fallback' });
  const tag4 = (MP_ELEMENT_CODE[r.el] || '') + (MP_WEAPON_CODE[r.w] || '');
  const mirrorLine = r.mirror ? `\n最も近しいキャラクター：${r.mirror.rawName}（${r.mirror.match}%一致）` : '';

function mpLoginMethodsHtml(user) {
  if (!user || typeof authLinkedProviders !== 'function') return '';

    if (!linked.has(p.provider) && !authProviderEnabled(p.provider)) return;
    const unlinkBtn = canUnlinkAuthProvider(user, p.provider)
      ? ` <button type="button" class="mp-login-unlink" data-provider="${p.provider}" data-label="${p.label}" onclick="mpUnlinkProvider(this)">解除</button>` : '';
    rows.push(linked.has(p.provider)

  });
  if (mpLoginNotice === null) {
    const err = typeof takeAuthReturnError === 'function' ? takeAuthReturnError() : null;
    mpLoginNotice = err ? authLinkErrorMessage(err) : '';
  }
  const notice = mpLoginNotice;
  const canLink = AUTH_LINKABLE_PROVIDERS.some((p) => !linked.has(p.provider) && authProviderEnabled(p.provider));
  // 使えるログイン方法を読めたら、この欄だけ描き直す（読む前は連携ボタンを出さない）
  if (typeof authEnabledProviders === 'function') {
    authEnabledProviders().then(() => {
      const el = document.getElementById('mpLogin');
      if (el && !el.dataset.providersApplied) {
        const tmp = document.createElement('div');

async function mpLinkProvider(btn) {
  const provider = btn && btn.dataset.provider;
  if (!provider) return;
  EdNavBusy.hold(btn);
  const msg = document.getElementById('mpLoginMsg');
  if (msg) msg.textContent = '';
  const { error } = await linkAuthProvider(provider) || {};
  // 成功時は連携先へ移動する。戻ってきたら SIGNED_IN / USER_UPDATED で再描画される
  if (error) {
    console.error('link identity error:', error);
    if (msg) msg.textContent = authLinkErrorMessage(error);
    EdNavBusy.release(btn);
  } else {
    EdNavBusy.handoff(btn);
  }
}

async function mpUnlinkProvider(btn) {
  const provider = btn && btn.dataset.provider;
  if (!provider) return;
  const label = btn.dataset.label || provider;
  if (!window.confirm(`${label}のログインを解除しますか？\n解除しても診断記録は消えません。次からは、ほかの方法でログインしてください。`)) return;
  btn.disabled = true;
  const msg = document.getElementById('mpLoginMsg');
  if (msg) msg.textContent = '';
  const user = await getCurrentUser();
  const { error } = await unlinkAuthProvider(user, provider);
  if (error) {
    console.error('unlink identity error:', error);
    if (msg) msg.textContent = authUnlinkErrorMessage(error);
    btn.disabled = false;
    return;
  }
  // 解除後のログイン方法を表示し直す
  init();
}

/* ============================================================
   完全解析（46ページ）— 右上の入口と状態別シート【PREVIEW ONLY の状態表示】
   - 入口は「最新の診断記録」にだけ作用する（アカウント全体の購入ではない）。
   - 状態は記録（diagnosis_session_id）ごとに持つ。別の記録の状態・URLは参照しない。
   - 完全解析の権利APIが無い間、実データの状態は unknown（free と推測せず、購入CTAを出さない）。
   - ?preview_entitlement= は complete-analysis.js のガードを通った Preview でのみ有効。
     Preview の状態は表示の確認用であり、購入権を発行しない（サーバー側の確認はそのまま働く）。
   ============================================================ */
const caStates = new Map(); // diagnosis_session_id → 表示用状態
const caImpressions = new Set();
function caAvailable() { return typeof CompleteAnalysis !== 'undefined' && CompleteAnalysis; }
function caStateOf(r) { return (r && r.session && caStates.get(String(r.session.id || ''))) || null; }
function caKey(r) { return caAvailable() ? CompleteAnalysis.stateKey(caStateOf(r)) : 'unknown'; }
function caIsReady(r) { return caKey(r) === 'complete_ready'; }

// 完全解析の適格性：保存された診断版・設問版と、回答が ETI v2 の100問として検証できるかで判定する（表示文字では判定しない）。
function caEligibilityOf(r) {
  const s = (r && r.session) || {};
  let answersComplete = false;
  try {
    if (s.isV2 && s.encodedAnswers && typeof ETIv2 !== 'undefined' && typeof ETI_V2_QUESTIONS !== 'undefined') {
      const a = ETIv2.decodeAnswersV2(s.encodedAnswers, ETI_V2_QUESTIONS);
      answersComplete = !!a && ETIv2.validateAnswersV2(a, ETI_V2_QUESTIONS).valid === true;
    }
  } catch (e) { answersComplete = false; }
  return CompleteAnalysis.completeEligibility({ diagnosisVersion: s.diagnosisVersion, itemSetVersion: s.itemSetVersion, answersComplete });
}
function caIsEligible(r) { const st = caStateOf(r); return !!(st && st.completeEligible); }

function caApplyStates(records) {
  caStates.clear();
  if (!caAvailable() || !records.length) return;
  const preview = CompleteAnalysis.previewStateName();
  const past = CompleteAnalysis.previewPastStateName();
  records.forEach((r, i) => {
    const id = String((r.session && r.session.id) || '');
    let st;
    if (preview) {
      // Preview fixture：最新記録だけ指定状態。preview_past があれば新しい順で2件目だけその状態。他は free。
      st = CompleteAnalysis.previewState(i === 0 ? preview : (i === 1 && past) ? past : 'free', id);
      // 表示の確認用に、既存の INSIGHT／LOCKED 表示も同じ fixture に揃える（権利は発行しない）
      if (st.entitlementStatus === 'ok') r.purchased = st.analysisAccess;
    } else {
      // 解析レポートの購入状態（/api/my-entitlements）を確認できた記録だけ free／analysis。
      //   完全解析の権利（有効）があれば、生成の状態で complete_ready／complete_generating／complete_failed（右上の入口・シートも購入済みで表示）
      const svc0 = caServerOf(r);
      const legacyAct = svc0.lookup === 'ok' && svc0.complete && svc0.complete.completeEntitlement === 'active';
      // 登録した完全解析（マイページ・固有リンクで購入）も同じ状態に数える（COMPLETE の印・紋章）
      const cd = mpCompleteLive(r);
      const dAct = !!cd;
      const cAct = legacyAct || dAct;
      const dRep = dAct ? (cd.report ? cd.report.status : 'generating') : null;
      const rep = dRep === 'ready' ? 'ready' : legacyAct ? svc0.complete.completeStatus : dRep;
      const cStatus = rep === 'ready' ? 'ready'
        : rep === 'failed' && (dAct || svc0.complete.completeRegenerate === 'available' || svc0.complete.completeRegenerate === 'operator') ? 'failed' : 'generating';
      st = CompleteAnalysis.realState({ analysisKnown: mpEntitlementOk, analysisAccess: r.purchased === true || cAct, diagnosisSessionId: id,
        completeAccess: cAct, completeStatus: cAct ? cStatus : 'none' });
    }
    // 不適格な記録（旧版など）は、Preview 指定があっても完全解析の状態・購入導線を成立させない。
    // サーバー（/api/my-entitlements v2）の判定がある記録は、それを正とする（RC1 の6つの版の完全一致）。
    const sv = caServerOf(r);
    const elig = (!preview && sv.lookup === 'ok' && sv.complete) ? { eligible: sv.complete.completeEligible === true } : caEligibilityOf(r);
    caStates.set(id, CompleteAnalysis.withEligibility(st, elig));
  });
  // Preview の unknown は、既存の「購入状態を確認できませんでした」表示（購入導線なし）に揃える
  if (preview) mpEntitlementOk = preview !== 'unknown';
}

// 右上の入口は、購入状態にかかわらず「レポート」（complete_13）。状態は data-state にだけ残す
const CA_TRIGGER_LABEL = { empty: 'レポート', free: 'レポート', analysis: 'レポート', analysis_only: 'レポート', complete_generating: 'レポート', complete_failed: 'レポート', complete_ready: 'レポート', unknown: 'レポート' };
// 右上の入口（2026-10-07）：ログイン中の本人には、購入状態にかかわらず出す（未購入者にも出す）。
// 購入する商品だけでなく、対象の診断記録を決める入口。最新の記録へ勝手に紐づけない。
//   記録0件：診断を始める案内／記録1件：その記録の状態で文言を決める（選択済み）
//   記録が複数：全件が完全解析済みなら「完全解析を見る」、購入状態を確認できなければ「状態を確認」、それ以外は「アップグレード」
function caTriggerKey(records) {
  if (!records.length) return 'empty';
  if (!mpEntitlementOk || records.some(r => caKey(r) === 'unknown')) return 'unknown';
  if (records.length === 1) {
    const k = caKey(records[0]);
    return k === 'analysis' && !caIsEligible(records[0]) ? 'analysis_only' : k;
  }
  return records.every(r => caKey(r) === 'complete_ready') ? 'complete_ready' : 'free';
}
function caTriggerHtml(records) {
  if (!caAvailable() || !Array.isArray(records)) return '';
  const k = caTriggerKey(records);
  const r0 = records[0];
  return `<button type="button" class="archive-upgrade-trigger${k === 'complete_ready' ? ' is-ready' : ''}" id="mpUpgradeTrigger"
    aria-haspopup="dialog" aria-controls="latest-upgrade-dialog" aria-expanded="false" data-state="${k}"
    style="--uc:${r0 ? mpElText(r0.el) : 'var(--accent)'}">${CA_TRIGGER_LABEL[k] || CA_TRIGGER_LABEL.unknown}</button>`;
}

// 各記録（LATEST RESULT／THE RECORDS）内の完全解析表示。complete の記録だけに出る。
// withButton=false：LATEST RESULT／THE RECORDS 内では「完全解析を見る」を購入・閲覧導線の行（mpRecordActionsHtml）に置くため、ここでは出さない。
function caRecordCompleteHtml(r, withButton) {

    res = await fetch('/api/complete-status', {

  const token = await caViewAccessToken();
  if (!token) { caViewSet(id, { kind: 'login' }); return; }
  let res = null;
  let body = null;
  try {
    res = await fetch('/api/complete-status', {
      method: 'POST', cache: 'no-store',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ diagnosisSessionId: id, action: 'regenerate' }),

async function caResetCheckout(id) {

    const token = data && data.session ? data.session.access_token : null;
    if (!token) return null;
    const res = await fetch('/api/complete-checkout?op=user-checkout-reset', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },

  if (!goalId) return;

    out = await caMentorRequest('POST', '', { diagnosisSessionId: id, goalId });

      if (reset === 'paid') { caMentorBusy = false; caCloseSheet(); await init(); return; }
      if (reset) out = await caMentorRequest('POST', '', { diagnosisSessionId: id, goalId });
    }

    data.selection = out.body.selection;
    data.locked = !!out.body.locked;
    data.changeAllowed = out.body.changeAllowed !== false;
    caMentorPick = null;
    if (r.session && r.session.complete) r.session.complete.mentorGoal = out.body.selection;

    caCloseSheet();

    return;

    await caLoadMentor(r);
    return;
  }

}

function caFocusables(root) {
  return Array.from(root.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'))
    .filter(el => el.offsetParent !== null || el === document.activeElement);

// Tab の停止位置：radio は同じ name のまとまりを1か所として数える（ブラウザの Tab 移動と同じ）。
// まとまりの代表は、フォーカス中の radio、無ければ選択中の radio、無ければ先頭。
function caTabStops(root) {
  const seen = new Set();
  const active = document.activeElement;
  const out = [];
  caFocusables(root).forEach((el) => {
    if (el.tagName !== 'INPUT' || el.type !== 'radio' || !el.name) { out.push(el); return; }
    if (seen.has(el.name)) return;
    seen.add(el.name);
    const group = Array.from(root.querySelectorAll(`input[type="radio"][name="${el.name}"]:not([disabled])`));
    out.push(group.find((x) => x === active) || group.find((x) => x.checked) || group[0]);
  });
  return out;
}

function init() {

  mpInitRunning = (async () => {

    .map((d) => (d.classList.contains('mp-latest-fold') ? 'latest' : d.id)).filter(Boolean);

  if (window.__edReturningToResult) {

  }

  if (!user) {
    // 購入の引き継ぎ（購入完了ページ・解析レポートの「マイページに引き継ぐ」）・購入時メールでの復旧から来た時の案内
    let intentNote = '';

    if (typeof EdBuy !== 'undefined' && EdBuy.peekRegisterIntent()) {

    }
