     【Preview版：GA4送信を無効化】本番Measurement IDへPreview操作が混入しないよう、
     外部スクリプトの読込とgtag('config', ...)による送信を止める。
     既存コードが呼ぶgtag()自体はno-opとして残し、ReferenceErrorにしない。
     本番反映時は、このコメントブロックを元のGA4読込へ戻すこと。 -->

<script>
const ELEMENT_COLOR = {
  "炎":"#c84a20","水":"#2a7aaa","氷":"#4a80c0","雷":"#9040d0",
  "風":"#3a8a60","岩":"#a07830","草":"#4a8020"
};
const WEAPON_COLOR = {
  "片手剣":"#9060d0","両手剣":"#c07030","長柄":"#608040","法器":"#5878b0","弓":"#c0a030"
};
const ENNEA_NAME = {
  1:"改革者", 2:"援助者", 3:"達成者", 4:"個性派", 5:"観察者",
  6:"堅実家", 7:"楽天家", 8:"挑戦者", 9:"調停者"
};
const ENNEA_INFO = {
  1:{ core:"正しさへの希求", fear:"堕落・誤りへの恐れ", desire:"誠実で正しくありたい" },
  2:{ core:"愛されたい献身", fear:"必要とされぬ恐れ", desire:"愛され必要とされたい" },
  3:{ core:"価値の証明", fear:"無価値への恐れ", desire:"価値ある存在でありたい" },
  4:{ core:"独自性の探求", fear:"凡庸・喪失の恐れ", desire:"自分らしくありたい" },
  5:{ core:"知の蓄積", fear:"無能・侵食の恐れ", desire:"有能で独立していたい" },
  6:{ core:"安全の確保", fear:"支えを失う恐れ", desire:"安心と支えがほしい" },
  7:{ core:"充足の追求", fear:"苦痛・欠乏の恐れ", desire:"満たされ自由でありたい" },
  8:{ core:"力の保持", fear:"支配される恐れ", desire:"自分の人生を統べたい" },
  9:{ core:"平和の維持", fear:"分裂・喪失の恐れ", desire:"内的平穏を保ちたい" },
};
const BIG5_NAME = { O:"開放性", C:"誠実性", E:"外向性", A:"協調性", N:"神経症傾向" };
const BIG5_INFO = {
  O:{ high:"好奇心・想像力・新規探究", low:"現実的・慣習的・安定志向" },
  C:{ high:"規律・計画性・責任感", low:"柔軟・即興的・自由" },
  E:{ high:"活動的・社交的・刺激希求", low:"内省的・静穏・少人数志向" },
  A:{ high:"共感・利他・調和", low:"独立・競争・率直" },
  N:{ high:"情動反応・不安・繊細さ", low:"安定・冷静・楽観" },
};
const NATION_MEANING = {
  "モンド":"自由", "璃月":"契約", "稲妻":"永遠", "スメール":"知恵",
  "フォンテーヌ":"正義", "ナタ":"戦争", "スネージナヤ":"慈愛", "ナドクライ":"月光",
};
const STRIPE_URL_AUTO = 'https://buy.stripe.com/test_9B64gr9micjz9riccu3Nm00'; // release-c-preview専用：Stripeテスト用Payment Link
// PreviewのStripeテスト決済→権利発行→v2レポート表示を実地確認するため有効化。
// STRIPE_URL_AUTOはPreview専用テストPayment Linkであり、本番決済には接続しない。
const V2_REPORT_SALES_ENABLED = true;

// 【重要な修正】trackEvent()・savedCountBucket()は、mypage.html内で11箇所・1箇所
// 呼ばれているが、mypage.html自身にもdiagnosis-save.jsにも定義が存在せず、
// 実際のページでは実行時にReferenceErrorになる状態だった
// （mypage_reflects_save_test.jsで実際に検出）。これまでのテストが通っていたのは、
// テスト側のスタブが偶然この関数を用意していたためで、実コードの不具合を
// 覆い隠していた。ここで実装を追加する。
function trackEvent(name, params) {
  if (typeof gtag === 'function') gtag('event', name, params || {});
}
function savedCountBucket(n) {
  if (n <= 0) return '0';
  if (n === 1) return '1';
  if (n <= 4) return '2_4';
  return '5_plus';
}

/* ============================================================
   ETI v2 表示用ヘルパー
   v1のENNEA_NAME・BIG5_NAME等は一切変更せず、v2専用の対応表だけを追加する。
   ============================================================ */
function v2TopName(ranking) {
  // 【修正】v2_rankingsの各エントリ（element/weapon/nation）は、
  // computeResultsV2()の実際の戻り値と同じ「プレーンな配列」であり、
  // {ranking:[...], topGap} という包んだ形ではない（RPCへ渡す時点で
  // pending.results.elementRanking等がそのまま配列で渡っているため）。
  // 以前の実装は包んだ形を前提にしており、実データでは常にnullになる
  // 不具合があった（mypage_reflects_save_test.jsで実際に検出・修正）。
  if (!ranking || !ranking.length) return null;
  return ranking[0];
}
function purchaseReference(session) {
  if (!session || !session.encodedAnswers) return null;
  return session.isV2 ? `v2_${session.encodedAnswers}` : session.encodedAnswers;
}
function purchaseUrlFor(session) {
  const reference = purchaseReference(session);
  return reference
    ? STRIPE_URL_AUTO + '?client_reference_id=' + encodeURIComponent(reference)
    : STRIPE_URL_AUTO;
}
function v2ReportCta(stripeUrl, className, source, label) {
  if (!V2_REPORT_SALES_ENABLED) {
    return `<span class="${className}" style="opacity:0.6;cursor:not-allowed" aria-disabled="true">解析レポート（準備中）</span>`;
  }
  return `<a href="${stripeUrl}" target="_blank" rel="noopener" class="${className}" onclick="trackEvent('mypage_unlock_click',{source:'${source}'})">${label}</a>`;
}
function v2ClosenessLine(label, ranking, purchased) {
  const top = v2TopName(ranking);
  if (!top) return `<div style="display:flex;justify-content:space-between;padding:1px 0"><span>${label}</span><span style="color:var(--fg-dim)">—</span></div>`;
  const scorePart = purchased
    ? `<span style="color:var(--fg-dim);font-size:10px">近さスコア ${top.closenessScore}</span>`
    : '';
  return `<div style="display:flex;justify-content:space-between;padding:1px 0"><span>${label}</span><span>${top.name}　${scorePart}</span></div>`;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('ja-JP', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

function pageHeaderHtml() {
  return `<div class="eyebrow">Element Profile</div><h1 class="page-title">アナタの診断記録</h1>`;
}

function renderGate(root, message) {
  root.innerHTML = `
    ${pageHeaderHtml()}
    <div class="gate" id="historyGateArea">
      <p>診断記録を見るには、保存したときと同じアカウントでログインしてください。</p>
      <button id="gateGoogleBtn" class="btn-google">Googleでログイン</button>
      <div class="gate-msg" id="gateMsg">${message || ''}</div>
    </div>
  `;
  document.getElementById('gateGoogleBtn').onclick = () => signInWithGoogle();
}

// メール(OTP)ログインのUIは独自ドメイン取得まで保留。
// renderGateOtpInput()は残してあるので、再有効化時はここにメール欄を戻すだけでよい。

function renderGateOtpInput(email) {
  const area = document.getElementById('historyGateArea');
  area.innerHTML = `
    <p style="color:#7ab8e8">${email} に6桁のコードを送りました。</p>
    <div class="email-row">
      <input id="gateOtpInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456"
        style="text-align:center;letter-spacing:4px;font-size:15px">
      <button id="gateOtpVerifyBtn" class="btn-secondary">ログイン</button>
    </div>
    <div class="gate-msg" id="gateMsg"></div>
  `;
  document.getElementById('gateOtpVerifyBtn').onclick = async () => {
    const token = document.getElementById('gateOtpInput').value.trim();
    const msg = document.getElementById('gateMsg');
    if (!token) { msg.textContent = 'コードを入力してください。'; return; }
    msg.textContent = '確認中…';
    const error = await verifyEmailOtp(email, token);
    if (error) { msg.textContent = 'コードが正しくないか、期限切れです。'; return; }
    // 成功するとonAuthStateChangeが発火し、init()が再実行される
  };
}

function renderEmpty(root) {
  root.innerHTML = `
    ${logoutButtonHtml()}
    ${pageHeaderHtml()}
    <div class="empty">
      まだ保存された診断記録がありません。<br>
      診断結果画面の「結果を保存」から記録できます。
    </div>
  `;
}

/* 元素TOP3バー（無料診断画面と同じ正規化ロジック） */
function elementBarsHtml(elements) {
  if (!elements || elements.length < 7) return '';
  const top3 = elements.slice(0, 3);
  const mx = elements[0].score, mn = elements[6].score;
  return top3.map((e, i) => {
    const n = mx === mn ? 60 : Math.round(((e.score - mn) / (mx - mn)) * 100);
    const color = ELEMENT_COLOR[e.element] || '#7ab8e8';
    const mark = i === 0 ? '◆' : i === 1 ? '②' : '③';
    return `
      <div style="margin-bottom:10px">
        <span style="color:${color};font-size:13px;font-weight:${i===0?'700':'500'}">${mark} ${e.element}</span>
        <div style="background:#0a0a14;height:6px;border-radius:3px;overflow:hidden;margin-top:4px">
          <div style="background:${color};width:${n}%;height:100%;border-radius:3px;opacity:${i===0?1:0.55}"></div>
        </div>
      </div>`;
  }).join('');
}

function bigFiveBarsHtml(big5, color) {
  if (!big5) return '';
  return Object.keys(BIG5_NAME).map(k => {
    const v = big5[k];
    const tendency = v >= 50 ? BIG5_INFO[k].high : BIG5_INFO[k].low;
    return `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--fg-dim);margin-bottom:3px">
        <span>${BIG5_NAME[k]}</span><span style="color:${color}">${v}</span>
      </div>
      <div style="background:#0a0a14;height:5px;border-radius:3px;overflow:hidden">
        <div style="background:${color};width:${v}%;height:100%"></div>
      </div>
      <div style="font-size:10px;color:var(--fg-dim);margin-top:3px">→ ${tendency}の傾向</div>
    </div>`;
  }).join('');
}

function nationBarsHtml(nations, color) {
  if (!nations || nations.length < 2) return '';
  const top3 = nations.slice(0, 3);
  const mx = nations[0].score, mn = nations[nations.length - 1].score;
  return top3.map((n, i) => {
    const pct = mx === mn ? 60 : Math.round(((n.score - mn) / (mx - mn)) * 100);
    return `
      <div style="margin-bottom:8px">
        <span style="color:#e0c890;font-size:12px;font-weight:${i===0?'700':'500'}">
          ${i===0?'◆':i===1?'②':'③'} ${n.nation} <span style="color:var(--fg-dim);font-size:10px">「${NATION_MEANING[n.nation]||''}」</span>
        </span>
        <div style="background:#0a0a14;height:5px;border-radius:3px;overflow:hidden;margin-top:3px">
          <div style="background:#c9a860;width:${pct}%;height:100%;opacity:${i===0?1:0.55}"></div>
        </div>
      </div>`;
  }).join('');
}

function purchasedReportButton(session, className, label) {

    onclick="openPurchasedReport(decodeURIComponent(this.dataset.sessionId), this)">${label || '購入済みレポートを見る'}</button>`;

async function openPurchasedReport(diagnosisSessionId, button) {
  if (!diagnosisSessionId || !button) return;
  const originalLabel = button.textContent;
  button.disabled = true;
  button.textContent = 'レポートを準備中…';
  const oldError = button.parentElement && button.parentElement.querySelector('.report-open-error');
  if (oldError) oldError.remove();

  try {
    const { data: { session: authSession } } = await supabaseClient.auth.getSession();
    const accessToken = authSession && authSession.access_token;
    if (!accessToken) throw new Error('not_authenticated');

    const response = await fetch('/api/my-report-link', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ diagnosis_session_id: diagnosisSessionId }),
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok || !body.url) throw new Error(body.error || 'link_issue_failed');

    trackEvent('mypage_report_open', { source: 'purchased_report_button' });
    navigateTo(body.url);
  } catch (err) {
    console.error('purchased report open failed:', err);
    const message = document.createElement('p');
    message.className = 'report-open-error';
    message.textContent = 'レポートを開けませんでした。時間をおいて再度お試しください。';
    button.insertAdjacentElement('afterend', message);
    button.disabled = false;
    button.textContent = originalLabel;
  }
}

  const purchased = !!s.purchased;
  const historyOpenTrack = `trackEvent('diagnosis_history_open',{diagnosis_type:'${DIAGNOSIS_TYPE}'});` +
    (purchased ? `trackEvent('mypage_report_open',{diagnosis_type:'${DIAGNOSIS_TYPE}'});` : '');

  return `
    <details class="session-acc" id="session-${idx}" style="--el-color:${elColor}" ${isLatest ? 'open' : ''}
      ontoggle="if(this.open){${historyOpenTrack}}">
      <summary>
        <div>
          <div class="session-date">
            ${fmtDate(s.completedAt)}${isLatest ? '<span class="badge-new">NEW</span>' : ''}
            ${purchased ? '<span class="badge-unlocked"> ・ 詳細解放済み</span>' : '<span class="badge-locked"> ・ 未解放</span>'}
          </div>
          <div class="session-combo"><span class="el">${pr.element || '?'}</span> × ${pr.weapon || '?'}${pr.nation ? ' ・ ' + pr.nation : ''}</div>
        </div>
      </summary>
      <div class="session-body">
        <div class="session-body-inner">
          ${top1 ? `
          <div style="margin-bottom:16px">
            <div style="font-size:10.5px;letter-spacing:2px;color:#6a90b0;text-transform:uppercase;margin-bottom:8px">最も近しいキャラクター</div>
            <div style="font-size:20px;font-weight:700;color:${ELEMENT_COLOR[top1.el]||elColor}">${top1.name}</div>
            <div style="display:flex;gap:6px;margin:6px 0;flex-wrap:wrap">
              <span style="background:${ELEMENT_COLOR[top1.el]}22;border:1px solid ${ELEMENT_COLOR[top1.el]}55;color:${ELEMENT_COLOR[top1.el]};font-size:10.5px;padding:2px 7px;border-radius:3px">${top1.el}</span>
              <span style="background:${WEAPON_COLOR[top1.w]}22;border:1px solid ${WEAPON_COLOR[top1.w]}55;color:${WEAPON_COLOR[top1.w]};font-size:10.5px;padding:2px 7px;border-radius:3px">${top1.w}</span>
              <span style="background:#c9a86022;border:1px solid #c9a86055;color:#e0c890;font-size:10.5px;padding:2px 7px;border-radius:3px">${top1.nation}</span>
              ${top1.ennea ? `<span style="background:#7ab8e822;border:1px solid #7ab8e855;color:#7ab8e8;font-size:10.5px;padding:2px 7px;border-radius:3px">エニア${top1.ennea} ${ENNEA_NAME[top1.ennea]||''}</span>` : ''}
            </div>
            <div style="font-size:12px;color:var(--fg-dim)">一致度 <span style="color:#90c8f0;font-weight:700">${top1.match}%</span></div>
          </div>` : ''}

          <div style="margin-bottom:18px">
            <div style="font-size:10.5px;letter-spacing:2px;color:#c0a030;text-transform:uppercase;margin-bottom:8px">あなたに響く元素</div>
            ${elementBarsHtml(s.scores && s.scores.elements)}
          </div>

          ${purchased ? unlockedDetailHtml({ primary_result: s.primaryResult, scores: s.scores, character_matches: s.characterMatches }, elColor, isLatest) + purchasedReportButton(s, 'lock-cta-btn', '購入済み旧版レポートを見る') : lockedDetailHtml(stripeUrl)}
        </div>
      </div>
    </details>`;
}

/* ---- ETI v2版 診断履歴カード（Enneagram無し。MIRROR・PERSONALITY/STYLE/VALUESを扱う） ---- */
function sessionAccordionHtmlV2(s, isLatest, idx) {
  const elTop = v2TopName(s.v2Rankings && s.v2Rankings.element);
  const wTop = v2TopName(s.v2Rankings && s.v2Rankings.weapon);
  const nTop = v2TopName(s.v2Rankings && s.v2Rankings.nation);
  const elColor = ELEMENT_COLOR[elTop && elTop.name] || '#7ab8e8';
  const top1 = (s.mirrorSnapshot && s.mirrorSnapshot[0]) || null;
  const stripeUrl = purchaseUrlFor(s);
  const purchased = !!s.purchased;
  const historyOpenTrack = `trackEvent('diagnosis_history_open',{diagnosis_type:'${DIAGNOSIS_TYPE}',diagnosis_version:'ETI-2.0'});` +
    (purchased ? `trackEvent('mypage_report_open',{diagnosis_type:'${DIAGNOSIS_TYPE}',diagnosis_version:'ETI-2.0'});` : '');

  return `
    <details class="session-acc" id="session-${idx}" style="--el-color:${elColor}" ${isLatest ? 'open' : ''}
      ontoggle="if(this.open){${historyOpenTrack}}">
      <summary>
        <div>
          <div class="session-date">
            ${fmtDate(s.completedAt)}${isLatest ? '<span class="badge-new">NEW</span>' : ''}
            ${purchased ? '<span class="badge-unlocked"> ・ 詳細解放済み</span>' : '<span class="badge-locked"> ・ 未解放</span>'}
          </div>
          <div class="session-combo"><span class="el">${elTop ? elTop.name : '?'}</span> × ${wTop ? wTop.name : '?'}${nTop ? ' ・ ' + nTop.name : ''}</div>
        </div>
      </summary>
      <div class="session-body">
        <div class="session-body-inner">
          ${top1 ? `
          <div style="margin-bottom:16px">
            <div style="font-size:10.5px;letter-spacing:2px;color:#6a90b0;text-transform:uppercase;margin-bottom:8px">MIRROR（最も近いキャラクター）</div>
            <div style="font-size:20px;font-weight:700;color:${ELEMENT_COLOR[top1.element]||elColor}">${top1.name}</div>
            <div style="font-size:12px;color:var(--fg-dim)">近さスコア <span style="color:#90c8f0;font-weight:700">${top1.mirrorScore}</span></div>
          </div>` : ''}

          ${purchased ? unlockedDetailHtmlV2(s.v2Scores, elColor, isLatest) + purchasedReportButton(s, 'lock-cta-btn', '購入済みETI v2レポートを見る') : lockedDetailHtmlV2(stripeUrl)}
        </div>
      </div>
    </details>`;
}

/* ---- 次の一歩：v2の最新結果がある場合 ---- */
function nextStepsHtmlV2(latest) {
  const purchased = !!latest.purchased;
  const stripeUrl = purchaseUrlFor(latest);
  const rediagBtn = `<a href="/?dv=ETI-2.0" class="next-btn${purchased ? ' next-btn-primary' : ''}">もう一度ETI v2で診断する</a>`;
  const detailBtn = purchased
    ? purchasedReportButton(latest, 'next-btn', '購入済みレポートを見る')
    : v2ReportCta(stripeUrl, 'next-btn next-btn-primary', 'next_steps', '詳細レポートを見る');
  // 完全版解析レポートは今回のリリース対象外。決済させず「準備中」とする。
  const completeBtn = `<a href="#" class="next-btn" style="opacity:0.6" onclick="event.preventDefault();trackEvent('complete_cta_click',{status:'coming_soon'});">完全版解析レポート（準備中）</a>`;
  return `
    <div class="next-steps">
      <div class="section-title">次の一歩</div>
      <div class="next-steps-row">
        ${purchased ? rediagBtn + detailBtn : detailBtn + rediagBtn}
      </div>
      <div class="next-steps-row" style="margin-top:8px">${completeBtn}</div>
      <div class="coming-soon">邪眼診断 — COMING SOON</div>
    </div>`;
}

/* ---- 次の一歩：まだETI v2の結果が無い場合 ----
   v1とv2は別商品・別権利として扱い、旧購入者へのv2無料開放は行わない。 */
function nextStepsHtmlV1Only() {
  return `
    <div class="next-steps">
      <div class="section-title">次の一歩</div>
      <div class="next-steps-row">
        <a href="/?dv=ETI-2.0" class="next-btn next-btn-primary">ETI v2で診断する</a>
      </div>
      <div class="coming-soon">邪眼診断 — COMING SOON</div>
    </div>`;
}

function nextStepsHtml(latest) {
  return latest.isV2 ? nextStepsHtmlV2(latest) : nextStepsHtmlV1Only();
}

/* ---- ログアウト・アカウント ---- */
function logoutButtonHtml() {
  return `<div style="text-align:right;margin-bottom:8px">
    <button onclick="handleLogoutClick()" style="background:transparent;border:1px solid var(--card-border);color:var(--fg-dim);border-radius:6px;padding:6px 14px;font-size:11px;cursor:pointer;font-family:inherit">ログアウト</button>
  </div>`;
}
// ナビゲーション先の決定と実際の遷移を分離する（テストで実際の呼び出しを検証できるように）。
// jsdomはlocation.hrefへの代入をスパイできない制約があるため、遷移そのものは
// この小さな関数越しに行う。挙動は従来と同じ（location.hrefへの代入）。
function navigateTo(url) {
  location.href = url;
}
async function handleLogoutClick() {
  await signOutUser();
  // 【P1-5訂正】明示的にログアウトを選択した場合は、共有端末上に100回答・
  // 計算結果を含むpendingDiagnosis_v2を残さない。期限確認（readPendingDiagnosisV2）
  // ではなく、有効期限内かどうかに関わらず明示的に削除する。
  if (typeof clearPendingDiagnosisV2 === 'function') clearPendingDiagnosisV2();
  // 認証済みデータを画面から消し、ログイン画面（renderGate）へ戻す。
  navigateTo(location.pathname);
}
function accountSectionHtml() {
  return `
    <div class="next-steps" style="margin-top:16px">
      <div class="section-title" style="font-size:13px">アカウント</div>
      <p class="sub">保存データの削除をご希望の場合は、X（@mondayaxad）までご連絡ください。内容を確認のうえ対応します（即時の自動削除ではありません）。</p>
    </div>`;
}

function renderMypage(root, sessions) {
  const v2Sessions = sessions.filter(s => s.isV2);
  const v1Sessions = sessions.filter(s => !s.isV2);
  const latest = v2Sessions[0] || v1Sessions[0];
  const savedCount = sessions.length;
  const unlockedCount = sessions.filter(s => s.purchased).length;

  root.innerHTML = `
    ${logoutButtonHtml()}
    ${heroHtml(latest, savedCount, unlockedCount)}
    ${summaryHtml(latest)}
    ${v2Sessions.length ? historyListHtml(v2Sessions) : ''}
    ${legacySectionHtml(v1Sessions)}
    ${nextStepsHtml(latest)}
    ${accountSectionHtml()}
  `;

  trackEvent('mypage_view', {
    entry_point: 'mypage',
    diagnosis_type: DIAGNOSIS_TYPE,
    saved_count_bucket: savedCountBucket(savedCount),
  });
}

function renderError(root) {
  root.innerHTML = `${logoutButtonHtml()}${pageHeaderHtml()}<div class="err">読み込みに失敗しました。時間をおいて再度お試しください。</div>`;
}

async function init() {
  const root = document.getElementById('root');
  const user = await getCurrentUser();

  if (!user) {
    renderGate(root);
    return;
  }

  const result = await loadDiagnosisHistory(DIAGNOSIS_TYPE);
  if (!result.ok) {
    renderError(root);
    return;
  }
  if (result.sessions.length === 0) {
    renderEmpty(root);
    return;
  }
  renderMypage(root, result.sessions);
}
// eti_v2_save.js（Googleログイン復帰後、v2のpending保存が完了した時点）から
// 呼べる再読み込みフック。init()自体はSIGNED_IN時にも呼ばれるため、
// 保存完了前に一度・完了後にもう一度（このフック経由で）呼ばれることがあるが、
// 後者が最終的に正しい状態を表示する。
window.refreshMypageHistory = init;

supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') init();
});

init();
</script>
</body>
</html>
