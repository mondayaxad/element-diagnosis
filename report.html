<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  .err-box { text-align:center; padding:80px 20px; }
  .err-box h2 { color:#e8b8a0; font-size:16px; margin-bottom:12px; }
  .err-box p { color:#8878a8; font-size:12.5px; line-height:1.9; }

  .cover { text-align:center; padding:50px 20px 40px; }
  .cover .tag { font-size:11px; letter-spacing:0.3em; color:#a888d8; margin-bottom:14px; }
  .cover h1 { font-size:24px; color:#eef4ee; letter-spacing:0.05em; line-height:1.6; margin-bottom:8px; }
  .cover .combo { font-size:15px; color:#8878a8; }

  .bar-top { display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; }
  .bar-top .label { color:#b6c4bc; }
  .bar-top .val { color:var(--accent); font-weight:700; }

  .bar-note { font-size:11px; color:#6a5d85; margin-top:6px; line-height:1.7; }

  .sw-section-label { font-size:12.5px; font-weight:700; margin:16px 0 10px; display:flex; align-items:center; gap:6px; }

  .sw-icon { flex-shrink:0; font-size:17px; margin-top:1px; }
  .sw-title { font-size:13.5px; font-weight:700; color:#eef4ee; margin-bottom:3px; }

  .charcard2 .tags { margin-bottom:8px; }

  .gold-rule { height:1px; margin:20px 0; background:linear-gradient(90deg, transparent, #c0a860, transparent); }
  .eyebrow { font-size:10px; letter-spacing:0.25em; color:#c0a860; text-transform:uppercase; margin-bottom:8px; }
  .cover-dots { position:relative; width:220px; height:220px; margin:0 auto 20px; }

  .sec-img { width:100%; aspect-ratio:16/9; border-radius:10px; margin:16px 0; overflow:hidden; position:relative; }
@media print {
  body { background: #fff !important; }
  .lock-cta, button, .err-box .spinner { display: none !important; }

  .sec { break-inside: avoid; page-break-inside: avoid; border-color: #ccc !important; }
  .cover { break-after: page; }
}

/* ============================================================

   ============================================================ */
const TRAIT_WORD = {
  O:{hi:'探究心', lo:'堅実さ'}, C:{hi:'計画性', lo:'衝動性'},
  E:{hi:'社交性', lo:'内省力'}, A:{hi:'共感力', lo:'独立心'},
  N:{hi:'感受性', lo:'安定性'},
};
const ENNEA_WORD = {1:'完璧主義',2:'献身性',3:'向上心',4:'独自性',5:'観察眼',6:'忠実さ',7:'好奇心',8:'統率力',9:'調和性'};
// エニアグラムの標準的な統合（成長）・分裂（ストレス）方向
const ENNEA_GROWTH   = {1:7, 2:4, 3:6, 4:1, 5:8, 6:9, 7:5, 8:2, 9:3};
const ENNEA_STRESS    = {1:4, 2:8, 3:9, 4:2, 5:7, 6:3, 7:1, 8:5, 9:6};
// Big5因子ペアの相互作用語彙（単因子だけでは足りない分の語彙プール）
const PAIR_WORD = {
  'O,N':'繊細な探究心', 'O,C':'直感的創造性', 'C,A':'献身的堅実さ', 'E,A':'社交的思いやり',
  'N,A':'共感的敏感さ', 'O,E':'開放的行動力', 'C,N':'慎重な緊張感', 'O,A':'受容的好奇心',
  'E,N':'情熱的繊細さ', 'C,E':'計画的活動性',
};

function big5TraitWord(big5, f) {
  return big5[f] >= 50 ? TRAIT_WORD[f].hi : TRAIT_WORD[f].lo;
}

// 近しい人物像ブロック用：完全にエニアグラム由来（核／ウィング／成長方向／ストレス方向）
// → Big Fiveベースの元素・武器ブロックとは語彙が重ならない
function pickFactorTags_Similar(results) {
  const used = new Set();
  const tags = [];
  const push = (type) => {
    if (type == null || used.has(type)) return false;
    used.add(type); tags.push(ENNEA_WORD[type]); return true;
  };
  push(results.enneaTop.type);
  if (results.enneaWing) push(results.enneaWing.type);
  push(ENNEA_GROWTH[results.enneaTop.type]);
  push(ENNEA_STRESS[results.enneaTop.type]);
  // フォールバック：万一4つに満たない場合のみ、残りのエニアグラムタイプから補う
  let i = 1;
  while (tags.length < 4 && i <= 9) { push(i); i++; }
  return tags.slice(0, 4);
}

// 元素ブロック用：Big5の単因子＋因子ペアの相互作用語彙から、
// そのプロファイルが重視する因子を優先して選出。usedWordsで他ブロックとの重複を避ける。
function pickFactorTags_Profile(results, profile, usedWords) {
  const big5 = results.big5;
  const weights = profile.big5; // { O,C,E,A,N の重み }
  const candidates = [];

  // 単因子候補（プロファイルの重みでスコアリング）
  Object.keys(weights).forEach(f => {
    candidates.push({ word: big5TraitWord(big5, f), score: Math.abs(weights[f]) * 10 });
  });
  // ペア候補（両因子の重みの合計でスコアリング）
  const factors = Object.keys(weights);
  for (let i = 0; i < factors.length; i++) {
    for (let j = i + 1; j < factors.length; j++) {
      const key = [factors[i], factors[j]].sort().join(',');
      if (!PAIR_WORD[key]) continue;
      const score = Math.abs(weights[factors[i]]) + Math.abs(weights[factors[j]]);
      if (score > 0) candidates.push({ word: PAIR_WORD[key], score: score * 4 });
    }
  }

  candidates.sort((a,b) => b.score - a.score);
  const tags = [];
  for (const c of candidates) {
    if (tags.includes(c.word) || usedWords.has(c.word)) continue;
    tags.push(c.word);
    usedWords.add(c.word);
    if (tags.length === 4) break;
  }
  return tags;
}

// 武器ブロック用：エニアグラム由来（対応タイプ＋その成長/ストレス方向から選出）
function pickFactorTags_Weapon(results, weaponTypes, usedWords) {
  const candidates = [];
  weaponTypes.forEach((t,i) => candidates.push({ word: ENNEA_WORD[t], score: 100 - i }));
  const primary = weaponTypes[0];
  candidates.push({ word: ENNEA_WORD[ENNEA_GROWTH[primary]], score: 50 });
  candidates.push({ word: ENNEA_WORD[ENNEA_STRESS[primary]], score: 40 });
  // フォールバック
  let i = 1;
  while (candidates.length < 8 && i <= 9) { candidates.push({ word: ENNEA_WORD[i], score: 10 }); i++; }

  candidates.sort((a,b)=>b.score-a.score);
  const tags = [];
  for (const c of candidates) {
    if (tags.includes(c.word) || usedWords.has(c.word)) continue;
    tags.push(c.word);
    usedWords.add(c.word);
    if (tags.length === 4) break;
  }
  return tags;
}

// （「他の国家名」ではなく、判定された国家自体が内包する価値観の要素を表示）
const SCHWARTZ_VALUE = {
  自己志向:'#c9a860', 刺激:'#8a5fc0', 達成:'#5fb0a0', 伝統:'#d17a52',
  安全:'#5b8fd1', 普遍主義:'#7fbf6a', 同調:'#d1a55b', 権力:'#a85f5f', 快楽:'#c98abf', 博愛:'#e08ab0',
};
// 各国家が内包する価値観次元（複数国家にまたがる次元もあるため、国家ごとに1〜2個）
const NATION_VALUES = {
  "モンド":       ['自己志向','刺激'],
  "璃月":         ['達成','伝統'],
  "稲妻":         ['伝統','安全'],
  "スメール":     ['普遍主義'],
  "フォンテーヌ": ['普遍主義','同調'],
  "ナタ":         ['刺激','快楽'],
  "スネージナヤ": ['権力','達成'],
};
// 価値観次元 → 国家の逆引き（複数国家にまたがる次元は平均を取る）
const VALUE_NATIONS = {};
Object.entries(NATION_VALUES).forEach(([n, vs]) => vs.forEach(v => {
  VALUE_NATIONS[v] = VALUE_NATIONS[v] || [];
  VALUE_NATIONS[v].push(n);
}));
// シュワルツ10次元、それぞれの実スコア（0〜100）を算出
// ・国家に紐づく次元：対応国家の得点（複数国家にまたがる場合は平均）
// ・博愛：どの国家にも属さないため、協調性(A)から近似
function computeSchwartzScores(results) {
  const scores = {};
  Object.keys(SCHWARTZ_VALUE).forEach(v => {
    if (v === '博愛') {
      scores[v] = results.big5.A;
      return;
    }
    const nations = VALUE_NATIONS[v] || [];
    if (nations.length === 0) { scores[v] = 50; return; }
    const vals = nations.map(n => {
      const ns = results.nationScores.find(x => x.nation === n);
      return ns ? Math.round((ns.score+1)*50) : 50;
    });
    scores[v] = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  });
  return scores;
}
function pickFactorTags_Nation(results, usedWords) {

  sorted.slice(0,3).forEach((n, ni) => {
    (NATION_VALUES[n.nation] || []).forEach((v, vi) => {
      candidates.push({ word: v, score: (3-ni)*10 - vi });
    });
  });
  candidates.sort((a,b)=>b.score-a.score);
  const tags = [];
  for (const c of candidates) {
    if (tags.includes(c.word) || (usedWords && usedWords.has(c.word))) continue;
    tags.push(c.word);
    if (usedWords) usedWords.add(c.word);
    if (tags.length === 4) break;
  }
  // フォールバック：候補が4つに満たない場合、残りの価値観次元から補う
  const allValues = Object.keys(SCHWARTZ_VALUE);
  let i = 0;
  while (tags.length < 4 && i < allValues.length) {
    const v = allValues[i];
    if (!tags.includes(v) && !(usedWords && usedWords.has(v))) {
      tags.push(v);
      if (usedWords) usedWords.add(v);
    }
    i++;
  }
  return tags;
}

// レポート内容のプレビューカード（ぼかし表示＋個別ロック解除ボタン）
// レーダーチャート（5〜7軸対応・データの豊かさを視覚的に伝える）
function radarChart(labels, values, color, size) {
  size = size || 140;
  const cx = size/2, cy = size/2, r = size/2 - 18;
  const n = labels.length;
  const pts = values.map((v,i) => {
    const ang = (i/n)*2*Math.PI - Math.PI/2;
    const rad = r * Math.max(0.08, v/100);
    return [cx + rad*Math.cos(ang), cy + rad*Math.sin(ang)];
  });
  const ringPts = (frac) => labels.map((l,i) => {
    const ang = (i/n)*2*Math.PI - Math.PI/2;
    return [cx + r*frac*Math.cos(ang), cy + r*frac*Math.sin(ang)].join(',');
  }).join(' ');
  const labelPts = labels.map((l,i) => {
    const ang = (i/n)*2*Math.PI - Math.PI/2;
    const x = cx + (r+13)*Math.cos(ang), y = cy + (r+13)*Math.sin(ang);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#6a5d85">${l}</text>`;
  }).join('');
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:0 auto">
      <polygon points="${ringPts(1)}" fill="none" stroke="#221c38" stroke-width="1"/>
      <polygon points="${ringPts(0.66)}" fill="none" stroke="#221c38" stroke-width="0.6"/>
      <polygon points="${ringPts(0.33)}" fill="none" stroke="#221c38" stroke-width="0.6"/>
      <polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${color}30" stroke="${color}" stroke-width="1.6"/>
      ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${color}"/>`).join('')}
      ${labelPts}
    </svg>`;
}

function generateWhySimilarText(top1, topEl, topW, et) {
  const points = [];
  if (top1.el === topEl) points.push('元素');
  if (top1.w === topW) points.push('武器');
  if (top1.ennea === et) points.push('エニアグラムの核');
  let matchLine = points.length
    ? `特に${points.join('・')}が、あなたと完全に一致しています。`
    : `元素・武器の型は異なりますが、性質の根であるBig Fiveのスコアが強く重なっています。`;
  return `${top1.name}との一致度は${top1.match}%。${matchLine}表面的な共通点ではなく、気質を形づくる複数の層が、同じ方向を指しているために起きる重なりです（Big Five類似度：${top1.big5Sim}%）。`;
}

/* ============================================================
   診断コード短縮エンコード（Base36圧縮）
   50問の回答(-2~2)を1つの短い文字列に変換・復元する
   ============================================================ */
function encodeAnswers(answersObj) {
  const digits = "0123456789abcdefghijklmnopqrstuvwxyz";
  let n = 0n;
  for (let i = 0; i < QUESTIONS.length; i++) {
    const a = (answersObj[i] ?? 0) + 2; // -2~2 -> 0~4
    n = n * 5n + BigInt(a);
  }
  if (n === 0n) return "0";
  let s = "";
  while (n > 0n) {
    const rem = Number(n % 36n);
    s = digits[rem] + s;
    n = n / 36n;
  }
  return s;
}

function decodeAnswers(str) {
  const digits = "0123456789abcdefghijklmnopqrstuvwxyz";
  let n = 0n;
  for (const c of str) {
    const idx = digits.indexOf(c);
    if (idx < 0) return null;
    n = n * 36n + BigInt(idx);
  }
  const result = new Array(QUESTIONS.length);
  for (let i = QUESTIONS.length - 1; i >= 0; i--) {
    result[i] = Number(n % 5n) - 2;
    n = n / 5n;
  }
  return result;
}

function scoreOne(profile, c) {
  let d=0, normSq=0;
  Object.keys(profile.big5).forEach(f => { d += profile.big5[f]*c[f]; normSq += profile.big5[f]*profile.big5[f]; });
  const norm = normSq>0 ? Math.sqrt(normSq) : 1;
  return d/norm;
}

  const big5 = {};

  const nationScores = NATIONS.map(n=>({nation:n, score: natMax[n]>0?natRaw[n]/natMax[n]:0})).sort((a,b)=>b.score-a.score);

function pctFromEnneaTypeRaw(results, type) {
  const raw = results.enneaRaw || {};
  const max = Math.max(1, ...Object.values(raw));
  return Math.max(40, Math.min(99, Math.round((raw[type]||0)/max*100)));
}
// 武器ブロック用：エニアグラム由来（対応タイプ＋成長/ストレス方向）。パーセンテージ・強み弱み付き。
function pickFactorTags_Weapon_v3(results, weaponTypes, usedWords) {
  const used = new Set();
  const tags = [];
  const push = (type, why) => {
    if (type == null || used.has(type)) return false;
    used.add(type);
    tags.push({ word: ENNEA_WORD[type], pct: pctFromEnneaTypeRaw(results, type), sw: ENNEA_SW[type], why });
    return true;
  };
  weaponTypes.forEach(t => push(t, 'この武器種が対応するエニアグラムタイプです。'));
  const primary = weaponTypes[0];
  push(ENNEA_GROWTH[primary], '安定している時に現れやすい、成長方向の性質です。');
  push(ENNEA_STRESS[primary], '負荷がかかった時に現れやすい、ストレス方向の性質です。');
  let i = 1;
  while (tags.length < 4 && i <= 9) { push(i, '補足的に関連する性質です。'); i++; }
  return tags.slice(0,4).sort((a,b)=>b.pct-a.pct).filter(t=>{
    if (usedWords && usedWords.has(t.word)) return false;
    if (usedWords) usedWords.add(t.word);
    return true;
  });
}
// 国家（価値観）ブロック用：シュワルツ価値観理論の下位次元。パーセンテージ・強み弱み付き。
function pctFromNationScore(score) {
  return Math.max(40, Math.min(99, Math.round((score+1)*50)));
}
function pickFactorTags_Nation_v3(results, usedWords) {
  const sorted = results.nationScores;
  const candidates = [];
  sorted.slice(0,3).forEach((n, ni) => {
    (NATION_VALUES[n.nation] || []).forEach((v, vi) => {
      candidates.push({ word: v, score: (3-ni)*10 - vi, pct: pctFromNationScore(n.score), sw: NATION_SW[v],
        why: `${n.nation}という結果から導かれる、価値観の下位次元です。` });
    });
  });
  candidates.sort((a,b)=>b.score-a.score);
  const tags = [];
  for (const c of candidates) {
    if (tags.some(t=>t.word===c.word) || (usedWords && usedWords.has(c.word))) continue;
    tags.push(c);
    if (usedWords) usedWords.add(c.word);
    if (tags.length === 4) break;
  }
  return tags.sort((a,b)=>b.pct-a.pct);
}

function pctFromBig5Factor(big5, f) {
  return Math.max(40, Math.min(99, 50 + Math.abs(big5[f]-50)));
}
// 元素ブロック用：Big5の単因子＋因子ペアの相互作用語彙。パーセンテージ・強み弱み付き。
function pickFactorTags_Profile_v3(results, profile, usedWords) {
  const big5 = results.big5;
  const weights = profile.big5;
  const candidates = [];
  Object.keys(weights).forEach(f => {
    if (Math.abs(weights[f]) === 0) return;
    const dir = big5[f] >= 50 ? 'hi' : 'lo';
    candidates.push({
      word: big5TraitWord(big5, f), score: Math.abs(weights[f]) * 10,
      pct: pctFromBig5Factor(big5, f), sw: BIG5_SW[f][dir],
      why: `${BIG5[f].name}のスコア（${big5[f]}）が、この判定に直接寄与しています。`,
    });
  });
  const factors = Object.keys(weights);
  for (let i = 0; i < factors.length; i++) {
    for (let j = i + 1; j < factors.length; j++) {
      const key = [factors[i], factors[j]].sort().join(',');
      if (!PAIR_WORD[key]) continue;
      const score = Math.abs(weights[factors[i]]) + Math.abs(weights[factors[j]]);
      if (score <= 0) continue;
      const f1=factors[i], f2=factors[j];
      const dir1 = big5[f1]>=50?'hi':'lo', dir2 = big5[f2]>=50?'hi':'lo';
      const pct = Math.round((pctFromBig5Factor(big5,f1)+pctFromBig5Factor(big5,f2))/2);
      const shortS1 = BIG5_SW[f1][dir1].s.split('。')[0];
      const shortS2 = BIG5_SW[f2][dir2].s.split('。')[0];
      const shortW1 = BIG5_SW[f1][dir1].w.split('。')[0];
      const shortW2 = BIG5_SW[f2][dir2].w.split('。')[0];
      candidates.push({
        word: PAIR_WORD[key], score: score * 4, pct,
        sw: { s: `${shortS1}力と、${shortS2}力が組み合わさっています。両方の性質が同時に働くことで、単独の因子だけでは出てこない独自の持ち味が生まれています。`,
              w: `${shortW1}傾向と、${shortW2}傾向が、同時にかかりやすい組み合わせです。片方だけでなく両方の負荷が重なるため、意識的なケアが必要な場面が出てきます。`,
              ww: `${BIG5_SW[f1][dir1].ww}・${BIG5_SW[f2][dir2].ww}` },
        why: `${BIG5[f1].name}（${big5[f1]}）と${BIG5[f2].name}（${big5[f2]}）、両因子の組み合わせから導かれています。`,
      });
    }
  }
  candidates.sort((a,b) => b.score - a.score);
  const tags = [];
  for (const c of candidates) {
    if (tags.some(t=>t.word===c.word) || usedWords.has(c.word)) continue;
    tags.push(c);
    usedWords.add(c.word);
    if (tags.length === 4) break;
  }
  return tags.sort((a,b)=>b.pct-a.pct);
}

      <circle cx="38" cy="38" r="${r}" fill="none" stroke="#1c1830" stroke-width="6"/>
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 38 38)"/>
      <text x="38" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="${color}" font-family="sans-serif">${pct}%</text>
    </svg>`;
}

// シュワルツ10次元のレーダーチャート（円環モデル本来の見せ方）
function schwartzRadar(scores, size) {
  size = size || 220;
  const cx = size/2, cy = size/2, r = size/2 - 34;
  const labels = Object.keys(scores);
  const n = labels.length;
  const pts = labels.map((l,i) => {
    const ang = (i/n)*2*Math.PI - Math.PI/2;
    const rad = r * Math.max(0.06, scores[l]/100);
    return [cx + rad*Math.cos(ang), cy + rad*Math.sin(ang)];
  });
  const ringPts = (frac) => labels.map((l,i) => {
    const ang = (i/n)*2*Math.PI - Math.PI/2;
    return [cx + r*frac*Math.cos(ang), cy + r*frac*Math.sin(ang)].join(',');
  }).join(' ');
  const labelHtml = labels.map((l,i) => {
    const ang = (i/n)*2*Math.PI - Math.PI/2;
    const x = cx + (r+22)*Math.cos(ang), y = cy + (r+22)*Math.sin(ang);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="${SCHWARTZ_VALUE[l]}">${l}</text>
            <text x="${x}" y="${y+12}" text-anchor="middle" font-size="9" fill="#5a4d75">${scores[l]}</text>`;
  }).join('');
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:0 auto">
      <polygon points="${ringPts(1)}" fill="none" stroke="#2a2240" stroke-width="1"/>
      <polygon points="${ringPts(0.66)}" fill="none" stroke="#2a2240" stroke-width="0.6"/>
      <polygon points="${ringPts(0.33)}" fill="none" stroke="#2a2240" stroke-width="0.6"/>
      <polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="#c9a86030" stroke="#c9a860" stroke-width="1.8"/>
      ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${SCHWARTZ_VALUE[labels[i]]}"/>`).join('')}
      ${labelHtml}
    </svg>`;
}

// PDF保存（html2canvas + jsPDF）。01〜06の各セクション（.sec / .cover）が
// ページ境界で途中に切れないよう、区切り位置をセクション境界に合わせて調整する。
async function savePdf() {
  var btn = document.getElementById('pdfSaveBtn');
  var wrap = document.querySelector('.wrap');
  if (!wrap) { alert('レポートがまだ表示されていません。'); return; }
  if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
    alert('PDF機能の読み込みに失敗しました。通信環境を確認し、ページを再読み込みしてから、もう一度お試しください。');
    return;
  }
  var originalText = btn.textContent;
  btn.textContent = '生成中…（数秒お待ちください）';
  btn.disabled = true;

  var hideEls = document.querySelectorAll('#pdfSaveBtn, .lock-cta, a[href*="stripe"], a[href*="buy.stripe"]');
  var prevDisplay = [];
  hideEls.forEach(function(el){ prevDisplay.push(el.style.display); el.style.display = 'none'; });

  try {
    // ①各セクションの、.wrap先頭からの相対位置（DOM px）を先に記録
    var wrapTop = wrap.getBoundingClientRect().top + window.scrollY;
    var sectionEls = wrap.querySelectorAll('.sec, .cover');
    var sectionRanges = Array.prototype.map.call(sectionEls, function(el) {
      var r = el.getBoundingClientRect();
      var top = r.top + window.scrollY - wrapTop;
      return { top: top, bottom: top + r.height };
    });

    var canvas = await html2canvas(wrap, { scale: 2, backgroundColor: '#050408', useCORS: true });
    var scaleFactor = canvas.width / wrap.offsetWidth; // DOM px → canvas px 変換係数

    var pdfWidth = 210, pageHeightMm = 297;
    var pxPerMm = canvas.width / pdfWidth; // canvas px → mm 変換係数
    var pageHeightPx = pageHeightMm * pxPerMm;

    // ②セクション範囲をcanvas px単位に変換
    var sectionsPx = sectionRanges.map(function(s) {
      return { top: s.top * scaleFactor, bottom: s.bottom * scaleFactor };
    });

    // ③安全な区切り候補（各セクションの開始・終了位置）を洗い出し、
    //    1ページに収まる範囲で"できるだけ詰め込む"形で区切り位置を決定する。
    //    （短いセクションごとに毎回改ページすると、余白だらけの白いページができてしまうため）
    var safePoints = [0, canvas.height];
    sectionsPx.forEach(function(s) { safePoints.push(s.top); safePoints.push(s.bottom); });
    safePoints = Array.from(new Set(safePoints)).sort(function(a,b){ return a-b; });

    var breaks = [0];
    var y = 0;
    var MIN_FILL_RATIO = 0.5; // これ未満しか埋まらない中途半端な区切りは避け、フルページを優先する
    while (y < canvas.height) {
      // 1ページに収まる範囲内で、最も遠い「安全な区切り候補」を探す
      var candidate = y;
      for (var i = 0; i < safePoints.length; i++) {
        var pt = safePoints[i];
        if (pt > y && pt <= y + pageHeightPx) candidate = pt;
        if (pt > y + pageHeightPx) break;
      }
      var filled = candidate - y;
      if (candidate <= y || filled < pageHeightPx * MIN_FILL_RATIO) {
        // 安全な候補が無い、またはページの半分も埋まらない中途半端な区切りの場合は、
        // 白い余白の多いページを作るより、次のセクションに多少食い込んででもページをフルに使う
        candidate = Math.min(y + pageHeightPx, canvas.height);
      }
      breaks.push(candidate);
      y = candidate;
    }

    // ④区切りごとに、キャンバスから該当部分だけを切り出して1ページとして追加
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF('p', 'mm', 'a4');
    for (var p = 0; p < breaks.length - 1; p++) {
      var segTop = breaks[p], segBottom = breaks[p+1];
      var segHeightPx = segBottom - segTop;
      if (segHeightPx <= 0) continue;

      var pageCanvas = document.createElement('canvas');
      pageCanvas.width = canvas.width;
      pageCanvas.height = segHeightPx;
      var ctx = pageCanvas.getContext('2d');
      ctx.drawImage(canvas, 0, segTop, canvas.width, segHeightPx, 0, 0, canvas.width, segHeightPx);
      var segImgData = pageCanvas.toDataURL('image/jpeg', 0.92);
      var segHeightMm = segHeightPx / pxPerMm;

      if (p > 0) pdf.addPage();
      pdf.addImage(segImgData, 'JPEG', 0, 0, pdfWidth, segHeightMm);
    }

    // 最後に、画像ではなく「本物のテキスト」として診断コードのページを追加
    // （html2canvasで画像化された中のコードは、PDFビューアで正確にコピーできないため）
    // 注：jsPDF標準フォントは日本語を描画できないため、このページのラベルは英語のみ使用する
    var code = window.__diagnosisCode || '';
    if (code) {
      pdf.addPage();
      pdf.setFillColor(5, 4, 8);
      pdf.rect(0, 0, pdfWidth, pageHeightMm, 'F');
      pdf.setFont('helvetica', 'normal');
      pdf.setTextColor(200, 168, 96);
      pdf.setFontSize(14);
      pdf.text('Your Diagnosis Code', 20, 30);
      pdf.setTextColor(230, 230, 230);
      pdf.setFontSize(10);
      pdf.text('Use this code when applying for the Narrative Report.', 20, 40);
      pdf.setFont('courier', 'normal');
      pdf.setFontSize(13);
      pdf.setTextColor(255, 255, 255);
      // コードが長い場合に備え、40文字ごとに改行して表示（テキストなので確実にコピー可能）
      var lines = pdf.splitTextToSize(code, 170);
      pdf.text(lines, 20, 55);
    }

    pdf.save('元素診断_解析レポート.pdf');
  } catch (e) {
    console.error(e);
    alert('PDFの生成に失敗しました。お手数ですが、時間をおいて再度お試しいただくか、@mondayaxad までご連絡ください。');
  } finally {
    hideEls.forEach(function(el,i){ el.style.display = prevDisplay[i]; });
    btn.textContent = originalText;
    btn.disabled = false;
  }
}
