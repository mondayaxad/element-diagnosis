# SEO の回帰テスト（インデックス方針・sitemap・canonical・noindex・タイプ解説のメタと OGP 画像・構造化データ・GA4 の消毒）。
#   ・main への PR と、main への push で実行する。失敗が1件でもあれば赤（除外・continue-on-error・リトライは使わない）。
#   ・ブラウザのテスト用に Playwright だけを入れる（package.json・lock は変えない）。秘密情報は使わない。権限はリポジトリの読み取りだけ。
#   ・スキップが1件でもあれば赤（環境の不足で検査が抜けたまま緑にしない）。
#   ・Vercel のデプロイとは無関係（デプロイ設定は変えない）。
#   ・マージ前にこのチェックが緑であることを必須とする運用は docs/seo/CI_SEO.md。
name: SEO regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    name: SEO tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tests/ga4_fixes.test.js の一部（8件）はブラウザで index.html を動かす。Playwright が無いとスキップされるため入れる（全件を実行する）
      #   リポジトリの外（$RUNNER_TEMP/pw）に入れ、NODE_PATH で読み込む（package.json の依存は入れない・変えない）
      - name: Install Playwright (Chromium)
        run: |
          npm i --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run SEO regression tests (no skips allowed)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          set -o pipefail
          node --test --test-reporter=tap \
            tests/seo_indexing.test.js \
            tests/seo_index_guard.test.js \
            tests/public_build.test.js \
            tests/ga4_fixes.test.js \
            tests/seo_type_meta.test.js \
            tests/seo_jsonld.test.js | tee seo-tests.tap
          # スキップが1件でもあれば失敗にする（環境の不足で検査が抜けたまま緑にならないように）
          if grep -qE '^# skipped [1-9]' seo-tests.tap; then echo '::error::SEO テストにスキップがあります'; exit 1; fi
