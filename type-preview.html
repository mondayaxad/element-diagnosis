<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>あなたの元素から、深層を掴む｜元素診断</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --bg: #06060e; --line: rgba(143,180,220,.2); --head: #e6eef9; --body: #b3c3d8; --muted: #7d90ab; --gold: #c9a860; --ac: #8fb4dc; }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse 120% 70% at 50% -10%, #1b2144 0, #0b0c1c 55%, var(--bg) 100%) fixed; color: var(--body); font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif; -webkit-font-smoothing: antialiased; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .55;
    background-image: radial-gradient(1px 1px at 12% 18%, #fff8, transparent), radial-gradient(1px 1px at 78% 12%, #fff6, transparent), radial-gradient(1.5px 1.5px at 40% 70%, #cfe3ff55, transparent), radial-gradient(1px 1px at 88% 64%, #fff5, transparent), radial-gradient(1px 1px at 22% 86%, #fff4, transparent), radial-gradient(1px 1px at 60% 34%, #fff5, transparent); }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 50% at 50% 100%, color-mix(in srgb, var(--ac) 14%, transparent), transparent 70%); transition: background .6s ease; }
  .wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 40px 16px calc(120px + env(safe-area-inset-bottom)); }
  .eyebrow { font-family: 'IM Fell English', serif; font-style: italic; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: #6f8fbf; text-align: center; margin: 0 0 12px; }
  h1 { color: var(--head); font-size: clamp(22px, 6vw, 30px); font-weight: 700; letter-spacing: .08em; text-align: center; margin: 0 0 12px; line-height: 1.5; }
  .lead { text-align: center; font-size: 13.5px; line-height: 2; color: #9fb2cc; margin: 0 0 34px; }
  .sec { margin: 0 0 30px; }
  .sec-h { display: flex; align-items: center; gap: 12px; color: var(--head); font-size: 14px; letter-spacing: .3em; margin: 0 0 14px; }
  .sec-h::before, .sec-h::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
  .sec-h::after { background: linear-gradient(90deg, var(--line), transparent); }
  .sec[aria-disabled="true"] { opacity: .35; pointer-events: none; filter: saturate(.5); transition: opacity .3s ease; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid #9cc4f0; outline-offset: 3px; }

  /* 元素：宝珠 */
  .orbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; justify-items: center; }
  .orb { position: relative; width: 74px; height: 92px; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; }
  .orb .g { position: relative; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 700; color: #fff;
    background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--c) 30%, #fff) 0, var(--c) 42%, color-mix(in srgb, var(--c) 45%, #050510) 100%);
    box-shadow: inset 0 -6px 12px rgba(0,0,0,.35), 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent), 0 0 14px color-mix(in srgb, var(--c) 30%, transparent);
    transition: transform .25s ease, box-shadow .3s ease, filter .3s ease; text-shadow: 0 1px 6px rgba(0,0,0,.45); }
  .orb .g::after { content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 1px solid transparent; transition: border-color .3s ease; }
  .orb .n { font-size: 12px; letter-spacing: .2em; color: #9fb2cc; }
  .orbs.has-pick .orb:not([aria-pressed="true"]) .g { filter: saturate(.45) brightness(.7); }
  .orb:hover .g { transform: translateY(-2px); }
  .orb[aria-pressed="true"] .g { transform: scale(1.08); box-shadow: inset 0 -6px 12px rgba(0,0,0,.3), 0 0 0 1px color-mix(in srgb, var(--c) 80%, #fff), 0 0 26px color-mix(in srgb, var(--c) 70%, transparent), 0 0 60px color-mix(in srgb, var(--c) 35%, transparent); }
  .orb[aria-pressed="true"] .g::after { border-color: color-mix(in srgb, var(--c) 70%, #fff); border-style: dashed; animation: spin 9s linear infinite; }
  .orb[aria-pressed="true"] .n { color: #fff; }

  /* 武器・国家：札 */
  .cards { display: grid; gap: 10px; }
  .cards.w { grid-template-columns: repeat(5, 1fr); }
  .cards.na { grid-template-columns: repeat(3, 1fr); }
  .card { position: relative; min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(22,26,50,.75), rgba(10,12,26,.75)); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; color: #b9c8dd; font-size: 13px; letter-spacing: .08em; transition: border-color .25s ease, transform .2s ease, box-shadow .3s ease, color .25s ease; overflow: hidden; }
  .card svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 120%, color-mix(in srgb, var(--k, var(--ac)) 38%, transparent), transparent 70%); opacity: 0; transition: opacity .35s ease; }
  .card:hover { transform: translateY(-1px); border-color: rgba(160,190,230,.4); }
  .card[aria-pressed="true"] { color: #fff; border-color: color-mix(in srgb, var(--k, var(--ac)) 75%, #fff); box-shadow: 0 0 0 1px color-mix(in srgb, var(--k, var(--ac)) 40%, transparent), 0 0 22px color-mix(in srgb, var(--k, var(--ac)) 35%, transparent); }
  .card[aria-pressed="true"]::before { opacity: 1; }
  .card > * { position: relative; }
  .card .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--k); box-shadow: 0 0 8px var(--k); }
  .card.unknown { --k: #8a93a8; color: #8f9ab0; font-size: 12.5px; }
  @media (max-width: 420px) { .cards.w { grid-template-columns: repeat(3, 1fr); } .orbs { gap: 12px 4px; } }

  /* 近しいキャラクター */
  .kana-row { display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid rgba(143,180,220,.08); }
  .kana-row:first-child { border-top: 0; }
  .kana-row .k { color: #6f8fbf; font-size: 13px; padding-top: 9px; text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(16,20,40,.7); color: #c3d1e4; font-size: 13.5px; cursor: pointer; transition: border-color .2s ease, background .2s ease, box-shadow .3s ease, color .2s ease; }
  .chip:hover { border-color: rgba(160,190,230,.45); }
  .chip[aria-pressed="true"] { color: #fff; border-color: color-mix(in srgb, var(--ac) 80%, #fff); background: color-mix(in srgb, var(--ac) 26%, #10142a); box-shadow: 0 0 16px color-mix(in srgb, var(--ac) 40%, transparent); }
  .chip.unknown { border-style: dashed; color: #9aa6ba; }
  .chars-empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 8px 0; }

  /* 商品 */
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .plan { border-radius: 14px; border: 1px solid var(--line); background: rgba(14,16,34,.75); padding: 14px 12px; text-align: center; cursor: pointer; transition: border-color .25s ease, box-shadow .3s ease; }
  .plan b { display: block; color: var(--head); font-size: 14.5px; letter-spacing: .1em; }
  .plan span { display: block; margin-top: 6px; color: var(--gold); font-size: 15px; letter-spacing: .06em; }
  .plan small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; letter-spacing: .08em; }
  .plan[aria-pressed="true"] { border-color: rgba(214,190,130,.75); box-shadow: 0 0 0 1px rgba(214,190,130,.3), 0 0 22px rgba(214,190,130,.22); }

  /* 真相を明らかにする */
  .reveal-wrap { position: sticky; bottom: calc(14px + env(safe-area-inset-bottom)); margin-top: 26px; z-index: 5; }
  .reveal { position: relative; width: 100%; min-height: 62px; border: 0; border-radius: 16px; cursor: pointer; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .32em; padding: 0 0 0 .32em; isolation: isolate; overflow: hidden;
    background: linear-gradient(135deg, color-mix(in srgb, var(--ac) 70%, #0a0c1e), color-mix(in srgb, var(--ac) 35%, #0a0c1e)); box-shadow: 0 10px 34px rgba(0,0,0,.5), 0 0 30px color-mix(in srgb, var(--ac) 40%, transparent); text-shadow: 0 0 12px color-mix(in srgb, var(--ac) 80%, #fff); transition: opacity .3s ease, filter .3s ease; }
  .reveal::before { content: ''; position: absolute; inset: -60%; z-index: -1; background: conic-gradient(from 0deg, transparent 0 70%, color-mix(in srgb, var(--ac) 90%, #fff) 80%, transparent 90%); animation: spin 3.2s linear infinite; }
  .reveal::after { content: ''; position: absolute; inset: 2px; z-index: -1; border-radius: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--ac) 55%, #070818), #080a18 70%); }
  .reveal .spark { position: absolute; inset: 0; z-index: -1; background: radial-gradient(2px 2px at 20% 40%, #fff, transparent), radial-gradient(1.5px 1.5px at 70% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 85% 70%, #fff, transparent), radial-gradient(1px 1px at 40% 75%, #fff, transparent); opacity: .7; animation: twinkle 2.4s ease-in-out infinite; }
  .reveal[disabled] { cursor: default; filter: grayscale(.8) brightness(.6); }
  .reveal[disabled]::before, .reveal[disabled] .spark { animation: none; opacity: .2; }
  .flash { position: fixed; inset: 0; z-index: 50; pointer-events: none; background: radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--ac) 85%, #fff), color-mix(in srgb, var(--ac) 30%, #000) 60%, #000 100%); opacity: 0; }
  .flash.on { animation: flash 1.1s ease forwards; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes twinkle { 50% { opacity: .25; } }
  @keyframes flash { 0% { opacity: 0; } 35% { opacity: .95; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .orb[aria-pressed="true"] .g::after, .reveal::before, .reveal .spark { animation: none; } .flash.on { animation-duration: .01s; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Return to Your Nature</p>
  <h1>あなたの元素から、<br>深層を掴む</h1>
  <p class="lead">過去の診断結果を元に、隠された深層を読み解きます。<br>あなた自身を選択ください。</p>

  <section class="sec" aria-labelledby="h-el"><h2 class="sec-h" id="h-el">元素</h2><div class="orbs" data-group="element"></div></section>
  <section class="sec" aria-labelledby="h-wp"><h2 class="sec-h" id="h-wp">武器種</h2><div class="cards w" data-group="weapon"></div></section>
  <section class="sec" aria-labelledby="h-na"><h2 class="sec-h" id="h-na">国家</h2><div class="cards na" data-group="nation"></div></section>
  <section class="sec" aria-labelledby="h-ch" id="charSec" aria-disabled="true"><h2 class="sec-h" id="h-ch">近しいキャラクター</h2><div id="charList"></div></section>
  <section class="sec" aria-labelledby="h-pl"><h2 class="sec-h" id="h-pl">読み解き</h2>
    <div class="plans" data-group="plan">
      <button type="button" class="plan" data-v="analysis" aria-pressed="true"><b>解析</b><span>¥1,000</span><small>解析レポート</small></button>
      <button type="button" class="plan" data-v="complete" aria-pressed="false"><b>完全解析</b><span>¥3,000</span><small>全46ページ</small></button>
    </div>
  </section>
  <div class="reveal-wrap"><button type="button" class="reveal" id="revealBtn" disabled><span class="spark" aria-hidden="true"></span>真相を明らかにする</button></div>
</div>
<div class="flash" id="flash" aria-hidden="true"></div>

<script src="js/ETI_v2_QUESTIONS_100.js"></script>
<script src="js/eti_v2_prototypes.js"></script>
<script src="js/eti_v2_engine.js"></script>
<script src="js/characters118_v2.js"></script>
<script src="js/characters118_v2_1.js"></script>
<script src="js/eti_mirror_selection_v21.js"></script>
<script src="js/eti_v2_mirror_resolver.js"></script>
<script src="js/eti_type_reading.js"></script>
<script src="js/type_reading_chars.js"></script>
<script>
(function () {
  'use strict';
  var T = EdTypeReading;
  var EL_COLOR = { '炎': '#d9542a', '水': '#2f8fc6', '氷': '#6aa6e0', '雷': '#9a52e0', '風': '#3fae7f', '岩': '#c49a3a', '草': '#5f9e2c' };
  var NATION_COLOR = { 'モンド': '#5fc9a8', '璃月': '#e0b45a', '稲妻': '#a37ee0', 'スメール': '#7cc36a', 'フォンテーヌ': '#5aa9e6', 'ナタ': '#e8734a', 'スネージナヤ': '#a8d8f2', 'ナドクライ': '#c9c3f5' };
  var WEAPON_LABEL = { '長柄': '長柄武器' };
  // 武器の線画（同じ線の太さ・同じ枠で揃える）
  var WEAPON_ICON = {
    '片手剣': '<svg viewBox="0 0 32 32"><path d="M22 4 26 4 26 8 12 22"/><path d="M8 18l6 6"/><path d="M10 22l-4 4"/></svg>',
    '両手剣': '<svg viewBox="0 0 32 32"><path d="M20 3h6v6L12 23"/><path d="M17 6l9 9" opacity=".5"/><path d="M7 17l8 8"/><path d="M10 22l-5 5"/></svg>',
    '長柄': '<svg viewBox="0 0 32 32"><path d="M27 5 6 26"/><path d="M27 5l-6 1.5L25.5 11z"/><path d="M9 20l3 3"/></svg>',
    '法器': '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="6"/><circle cx="16" cy="16" r="11" opacity=".5"/><path d="M16 3v3M16 26v3M3 16h3M26 16h3"/></svg>',
    '弓': '<svg viewBox="0 0 32 32"><path d="M10 4c10 4 10 20 0 24"/><path d="M10 4v24" opacity=".6"/><path d="M6 16h20M22 12l4 4-4 4"/></svg>',
  };
  // 漢字の名前の読み（五十音順に並べるため）
  var READING = { '嘉明': 'がみん', '辛炎': 'しんえん', '胡桃': 'ふーたお', '香菱': 'しゃんりん', '煙緋': 'えんひ', '宵宮': 'よいみや', '神里綾人': 'かみさとあやと', '行秋': 'ゆくも', '夜蘭': 'いぇらん',
    '珊瑚宮心海': 'さんごのみやここみ', '神里綾華': 'かみさとあやか', '七七': 'なな', '申鶴': 'しぇんは', '甘雨': 'かんう', '刻晴': 'こくせい', '久岐忍': 'くきしのぶ', '雷電将軍': 'らいでんしょうぐん',
    '九条裟羅': 'くじょうさら', '八重神子': 'やえみこ', '北斗': 'ほくと', '楓原万葉': 'かえではらかずは', '早柚': 'さゆ', '放浪者': 'ほうろうしゃ', '閑雲': 'かんうん', '藍硯': 'らんやん',
    '鹿野院平蔵': 'しかのいんへいぞう', '夢見月瑞希': 'ゆめみづきみずき', '鍾離': 'しょうり', '雲菫': 'うんきん', '荒瀧一斗': 'あらたきいっと', '茲白': 'つーばい', '千織': 'ちおり', '凝光': 'ぎょうこう',
    '白朮': 'びゃくじゅつ', '綺良々': 'きらら', '魈': 'しょう', '重雲': 'ちょううん' };
  var ROWS = [['あ', 'あいうえおぁぃぅぇぉゔ'], ['か', 'かきくけこがぎぐげご'], ['さ', 'さしすせそざじずぜぞ'], ['た', 'たちつてとだぢづでどっ'], ['な', 'なにぬねの'],
    ['は', 'はひふへほばびぶべぼぱぴぷぺぽ'], ['ま', 'まみむめも'], ['や', 'やゆよゃゅょ'], ['ら', 'らりるれろ'], ['わ', 'わをん']];
  function hira(s) { return String(s).replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }
  function readingOf(name) { return READING[name] || hira(name); }
  function rowOf(name) { var c = readingOf(name).charAt(0); var r = ROWS.find(function (x) { return x[1].indexOf(c) >= 0; }); return r ? r[0] : '他'; }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var NONE = '__none__';
  var state = { element: null, weapon: null, nation: undefined, character: NONE, plan: 'analysis' };

  function pressGroup(box, btn) {
    box.querySelectorAll('[aria-pressed]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === btn)); });
    box.classList.add('has-pick');
  }
  var elBox = document.querySelector('[data-group="element"]');
  elBox.innerHTML = T.ELEMENTS.map(function (e) {
    return '<button type="button" class="orb" aria-pressed="false" data-v="' + e + '" style="--c:' + EL_COLOR[e] + '"><span class="g">' + e + '</span><span class="n">' + e + '元素</span></button>';
  }).join('');
  var wpBox = document.querySelector('[data-group="weapon"]');
  wpBox.innerHTML = T.WEAPONS.map(function (w) {
    return '<button type="button" class="card" aria-pressed="false" data-v="' + w + '">' + WEAPON_ICON[w] + '<span>' + esc(WEAPON_LABEL[w] || w) + '</span></button>';
  }).join('');
  var naBox = document.querySelector('[data-group="nation"]');
  naBox.innerHTML = T.NATIONS.map(function (n) {
    return '<button type="button" class="card" aria-pressed="false" data-v="' + n + '" style="--k:' + NATION_COLOR[n] + '"><span class="dot" aria-hidden="true"></span><span>' + esc(n) + '</span></button>';
  }).join('') + '<button type="button" class="card unknown" aria-pressed="false" data-v="' + NONE + '"><span class="dot" aria-hidden="true"></span><span>覚えていない</span></button>';

  elBox.addEventListener('click', function (e) {
    var b = e.target.closest('.orb'); if (!b) return;
    state.element = b.getAttribute('data-v'); pressGroup(elBox, b);
    document.documentElement.style.setProperty('--ac', EL_COLOR[state.element]);
    sync();
  });
  wpBox.addEventListener('click', function (e) { var b = e.target.closest('.card'); if (!b) return; state.weapon = b.getAttribute('data-v'); pressGroup(wpBox, b); sync(); });
  naBox.addEventListener('click', function (e) { var b = e.target.closest('.card'); if (!b) return; var v = b.getAttribute('data-v'); state.nation = v === NONE ? null : v; pressGroup(naBox, b); sync(); });
  document.querySelector('[data-group="plan"]').addEventListener('click', function (e) {
    var b = e.target.closest('.plan'); if (!b) return; state.plan = b.getAttribute('data-v'); pressGroup(e.currentTarget, b);
  });

  var charSec = document.getElementById('charSec'), list = document.getElementById('charList');
  function typeReady() { return !!(state.element && state.weapon && state.nation !== undefined); }
  function drawChars() {
    if (!typeReady()) { charSec.setAttribute('aria-disabled', 'true'); list.innerHTML = '<p class="chars-empty">元素・武器種・国家を選ぶと表示されます</p>'; return; }
    charSec.removeAttribute('aria-disabled');
    // 選んだタイプで一致度1位になり得る人物だけ（選ぶと、その人物が一致度1位の読み解きになる）
    var allowed = T.candidatesFor(state.element, state.weapon, state.nation);
    if (state.character !== NONE && allowed.indexOf(state.character) < 0) state.character = NONE;
    var sorted = allowed.slice().sort(function (a, b) { return readingOf(a).localeCompare(readingOf(b), 'ja'); });
    var groups = {};
    sorted.forEach(function (n) { var r = rowOf(n); (groups[r] = groups[r] || []).push(n); });
    var chip = function (v, label, extra) { return '<button type="button" class="chip' + (extra || '') + '" aria-pressed="' + (state.character === v) + '" data-v="' + esc(v) + '">' + esc(label) + '</button>'; };
    var html = '<div class="kana-row"><span class="k"></span><div class="chips">' + chip(NONE, '覚えていない', ' unknown') + '</div></div>';
    ROWS.map(function (r) { return r[0]; }).concat(['他']).forEach(function (r) {
      if (!groups[r]) return;
      html += '<div class="kana-row"><span class="k">' + r + '</span><div class="chips">' + groups[r].map(function (n) { return chip(n, n); }).join('') + '</div></div>';
    });
    list.innerHTML = html;
  }
  list.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    state.character = b.getAttribute('data-v');
    list.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  });

  var reveal = document.getElementById('revealBtn');
  function sync() { drawChars(); reveal.disabled = !typeReady(); }
  sync();
  reveal.addEventListener('click', function () {
    if (!typeReady()) return;
    var q = 'type=' + encodeURIComponent([state.element, state.weapon, state.nation || '-'].join('.'))
      + (state.character !== NONE ? '&char=' + encodeURIComponent(state.character) : '') + '&product=' + state.plan;
    var f = document.getElementById('flash');
    f.classList.add('on');
    reveal.disabled = true;
    setTimeout(function () { location.assign('/report.html?' + q); }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 900);
  });
})();
</script>
</body>
</html>
