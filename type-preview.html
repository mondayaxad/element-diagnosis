<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>あなたの元素から、深層を掴む｜元素診断</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* 元素診断のトップと同じ「一枚の夜」：夜空の写真＋色のレイヤー、明朝体と IM Fell English、細い罫と小さな光 */
  :root { --bg: #07070f; --t-head: #e2e4f6; --t-body: #8e9dbf; --t-sub: #6f7ea3; --t-en: #56648a; --t-brand: #7aa2cf; --t-link: #86b6e6; --gold: #c9a860;
    --line: rgba(150,180,240,.16); --ac: #7aa2cf;
    --font-jp: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; --font-en: 'IM Fell English', 'Times New Roman', serif; }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--t-head); font-family: var(--font-jp); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .night { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--bg); }
  .night .photo { position: absolute; top: 0; left: 0; right: 0; height: 128svh; background: url('/assets/backgrounds/quiet-starry-lake.jpg') center top / cover no-repeat; opacity: .26; filter: brightness(.6) saturate(.75) contrast(.95); }
  .night .tint { position: absolute; inset: 0; background:
    radial-gradient(ellipse 90% 40% at 50% 34%, rgba(7,7,15,.55), transparent 75%),
    radial-gradient(ellipse 80% 50% at 50% 24%, rgba(100,60,180,.14), transparent 70%),
    radial-gradient(ellipse 60% 40% at 12% 84%, rgba(40,90,170,.10), transparent 65%),
    linear-gradient(180deg, rgba(7,7,15,.5) 0%, rgba(7,7,15,0) 22%); }
  .night .aura { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 40% at 50% 100%, color-mix(in srgb, var(--ac) 16%, transparent), transparent 70%); transition: background .8s ease; }
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 64px 24px calc(140px + env(safe-area-inset-bottom)); }
  .hero-en { display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--font-en); font-style: italic; font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: var(--t-brand); margin: 0 0 18px; }
  .hero-en .rule { width: 28px; height: 1px; background: rgba(122,162,207,.45); }
  h1 { text-align: center; font-size: clamp(24px, 6.4vw, 34px); font-weight: 700; line-height: 1.5; letter-spacing: .06em; color: #f1eeff; margin: 0 0 22px; text-shadow: 0 0 30px rgba(140,130,240,.24), 0 2px 18px rgba(7,7,15,.8); }
  .spark { position: relative; width: 132px; height: 1px; margin: 0 auto 22px; background: linear-gradient(90deg, transparent, rgba(160,180,240,.35), transparent); }
  .spark::after { content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%; background: #dfe8ff; box-shadow: 0 0 6px 1px rgba(170,190,255,.7); }
  .lead { text-align: center; font-size: 13.5px; line-height: 2; color: var(--t-body); margin: 0 0 54px; word-break: auto-phrase; }
  .sec { margin: 0 0 46px; transition: opacity .4s ease; }
  .sec[aria-disabled="true"] { opacity: .32; pointer-events: none; }
  .sec-h { text-align: center; margin: 0 0 20px; }
  .sec-h .en { display: block; font-family: var(--font-en); font-style: italic; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #5d7cab; margin-bottom: 6px; }
  .sec-h .jp { display: block; font-size: 15px; font-weight: 600; letter-spacing: .3em; color: var(--t-head); }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 1px solid var(--t-link); outline-offset: 4px; }

  /* 元素：結果画面と同じ宝石の惑星 */
  .orbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 4px; justify-items: center; }
  .orb { width: 76px; min-height: 92px; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; }
  .orb .g { width: 56px; height: 56px; transition: transform .35s ease, filter .35s ease, opacity .35s ease; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--c) 45%, transparent)); }
  .orb .g svg { display: block; }
  .orb .n { font-size: 12.5px; letter-spacing: .3em; padding-left: .3em; color: color-mix(in srgb, var(--c) 45%, #c9d4ea); transition: color .3s ease, text-shadow .3s ease; }
  .orbs.has-pick .orb:not([aria-pressed="true"]) .g { opacity: .38; filter: grayscale(.4); }
  .orbs.has-pick .orb:not([aria-pressed="true"]) .n { color: var(--t-sub); }
  .orb:hover .g { transform: translateY(-2px); }
  .orb[aria-pressed="true"] .g { transform: scale(1.12); filter: drop-shadow(0 0 10px var(--c)) drop-shadow(0 0 22px color-mix(in srgb, var(--c) 55%, transparent)); animation: float 4s ease-in-out infinite; }
  .orb[aria-pressed="true"] .n { color: #f1eeff; text-shadow: 0 0 10px var(--c); }

  /* 武器種・国家：細い罫の札（トップの導線と同じ控えめな枠） */
  .cards { display: grid; gap: 10px; }
  .cards.w { grid-template-columns: repeat(5, 1fr); }
  .cards.na { grid-template-columns: repeat(3, 1fr); }
  .card { position: relative; min-height: 50px; border-radius: 6px; border: 1px solid var(--line); background: rgba(10,12,26,.45); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 10px 4px; color: #a9b8d6; font-size: 13.5px; letter-spacing: .14em; transition: border-color .3s ease, color .3s ease, background .3s ease, box-shadow .3s ease; }
  .card:hover { border-color: rgba(150,180,240,.34); color: #d3dcf0; }
  .card[aria-pressed="true"] { color: #f1eeff; border-color: color-mix(in srgb, var(--ac) 70%, #fff); background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 16%, rgba(10,12,26,.6)), rgba(10,12,26,.6)); box-shadow: 0 0 20px color-mix(in srgb, var(--ac) 26%, transparent), inset 0 1px 0 rgba(210,225,255,.12); text-shadow: 0 0 8px color-mix(in srgb, var(--ac) 70%, transparent); }
  .card[aria-pressed="true"]::before { content: ''; position: absolute; top: -4px; left: 50%; width: 6px; height: 6px; margin-left: -3px; transform: rotate(45deg); background: #dfe8ff; box-shadow: 0 0 8px 1px color-mix(in srgb, var(--ac) 80%, #fff); }
  .card.unknown { color: var(--t-sub); font-size: 12.5px; border-style: dashed; }
  @media (max-width: 440px) { .cards.w { grid-template-columns: repeat(3, 1fr); } .cards.w .card:nth-child(4) { grid-column: 1 / 2; } }

  /* 近しいキャラクター：五十音の行ごとの名前（文字だけ・選ぶと光る） */
  .kana-row { display: grid; grid-template-columns: 2em 1fr; gap: 6px 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid rgba(150,180,240,.08); }
  .kana-row:first-child { border-top: 0; }
  .kana-row .k { font-size: 12px; color: #5d7cab; text-align: center; letter-spacing: .1em; }
  .chips { display: flex; flex-wrap: wrap; gap: 2px 4px; }
  .chip { min-height: 40px; padding: 6px 10px; border: 0; border-bottom: 1px solid transparent; background: none; color: #a9b8d6; font-size: 14px; letter-spacing: .06em; cursor: pointer; transition: color .25s ease, text-shadow .25s ease, border-color .25s ease; }
  .chip:hover { color: #e2e4f6; }
  .chip[aria-pressed="true"] { color: #f1eeff; border-bottom-color: color-mix(in srgb, var(--ac) 80%, #fff); text-shadow: 0 0 10px color-mix(in srgb, var(--ac) 80%, transparent); }
  .chip.unknown { color: var(--t-sub); font-size: 13px; }
  .chars-empty { color: var(--t-sub); font-size: 12.5px; text-align: center; letter-spacing: .08em; padding: 6px 0; }

  /* 読み解き：解析レポート／完全解析 */
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .plan { border-radius: 8px; border: 1px solid var(--line); background: rgba(10,12,26,.45); padding: 16px 10px 14px; text-align: center; cursor: pointer; transition: border-color .3s ease, box-shadow .3s ease; }
  .plan b { display: block; color: var(--t-head); font-size: 15px; font-weight: 600; letter-spacing: .2em; padding-left: .2em; }
  .plan span { display: block; margin-top: 8px; color: #d6bd84; font-size: 15px; letter-spacing: .1em; }
  .plan small { display: block; margin-top: 4px; color: var(--t-sub); font-size: 11px; letter-spacing: .14em; }
  .plan[aria-pressed="true"] { border-color: rgba(214,190,130,.6); box-shadow: 0 0 22px rgba(214,190,130,.16), inset 0 1px 0 rgba(255,240,200,.1); }

  /* 真相を明らかにする：トップの主ボタンと同じ形に、選んだ元素の色を差す。光の筋がゆっくり走る */
  .reveal-wrap { position: sticky; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 5; margin-top: 10px; text-align: center; }
  .reveal { position: relative; overflow: hidden; width: 100%; max-width: 420px; min-height: 58px; border-radius: 6px; cursor: pointer; font-size: 15.5px; letter-spacing: .3em; padding: 0 0 0 .3em; color: #eef4ff;
    background: linear-gradient(135deg, color-mix(in srgb, var(--ac) 55%, #1b2c66) 0%, #2556a0 55%, #3c4a9e 100%);
    border: 1px solid rgba(150,180,240,.26); box-shadow: 0 0 32px color-mix(in srgb, var(--ac) 32%, transparent), 0 12px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(210,225,255,.18); transition: filter .3s ease, box-shadow .3s ease, opacity .3s ease; }
  .reveal::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,250,235,.16) 48%, transparent 64%); transform: translateX(-120%); animation: sheen 3.6s ease-in-out infinite; }
  .reveal:hover { filter: brightness(1.1); }
  .reveal[disabled] { cursor: default; opacity: .45; filter: grayscale(.6); box-shadow: 0 12px 26px rgba(0,0,0,.4); }
  .reveal[disabled]::after { animation: none; }
  .flash { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 78%, color-mix(in srgb, var(--ac) 60%, #fff) 0, color-mix(in srgb, var(--ac) 25%, #07070f) 38%, #07070f 75%); }
  .flash.on { animation: flash 1s ease forwards; }
  @keyframes float { 50% { transform: scale(1.12) translateY(-3px); } }
  @keyframes sheen { 0%, 40% { transform: translateX(-120%); } 80%, 100% { transform: translateX(120%); } }
  @keyframes flash { 0% { opacity: 0; } 40% { opacity: .9; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .orb[aria-pressed="true"] .g, .reveal::after { animation: none; } .flash.on { animation-duration: .01s; } }
</style>
</head>
<body>
<div class="night" aria-hidden="true"><div class="photo"></div><div class="tint"></div><div class="aura"></div></div>
<main class="wrap">
  <p class="hero-en"><span class="rule" aria-hidden="true"></span><span>Return to Your Nature</span><span class="rule" aria-hidden="true"></span></p>
  <h1>あなたの元素から、<br>深層を掴む</h1>
  <div class="spark" aria-hidden="true"></div>
  <p class="lead">過去の診断結果を元に、隠された深層を読み解きます。<br>あなた自身を選択ください。</p>

  <section class="sec" aria-labelledby="h-el"><h2 class="sec-h" id="h-el"><span class="en">Element</span><span class="jp">元素</span></h2><div class="orbs" data-group="element"></div></section>
  <section class="sec" aria-labelledby="h-wp"><h2 class="sec-h" id="h-wp"><span class="en">Weapon</span><span class="jp">武器種</span></h2><div class="cards w" data-group="weapon"></div></section>
  <section class="sec" aria-labelledby="h-na"><h2 class="sec-h" id="h-na"><span class="en">Nation</span><span class="jp">国家</span></h2><div class="cards na" data-group="nation"></div></section>
  <section class="sec" aria-labelledby="h-ch" id="charSec" aria-disabled="true"><h2 class="sec-h" id="h-ch"><span class="en">Mirror</span><span class="jp">近しいキャラクター</span></h2><div id="charList"></div></section>
  <section class="sec" aria-labelledby="h-pl"><h2 class="sec-h" id="h-pl"><span class="en">Reading</span><span class="jp">読み解き</span></h2>
    <div class="plans" data-group="plan">
      <button type="button" class="plan" data-v="analysis" aria-pressed="true"><b>解析</b><span>¥1,000</span><small>解析レポート</small></button>
      <button type="button" class="plan" data-v="complete" aria-pressed="false"><b>完全解析</b><span>¥3,000</span><small>全46ページ</small></button>
    </div>
  </section>
  <div class="reveal-wrap"><button type="button" class="reveal" id="revealBtn" disabled>真相を明らかにする</button></div>
</main>
<div class="flash" id="flash" aria-hidden="true"></div>

<script src="js/ETI_v2_QUESTIONS_100.js"></script>
<script src="js/eti_v2_prototypes.js"></script>
<script src="js/eti_v2_engine.js"></script>
<script src="js/characters118_v2.js"></script>
<script src="js/characters118_v2_1.js"></script>
<script src="js/eti_mirror_selection_v21.js"></script>
<script src="js/eti_v2_mirror_resolver.js"></script>
<script src="js/eti_type_reading.js"></script>
<script src="js/type_reading_chars.js"></script>
<script>
(function () {
  'use strict';
  var T = EdTypeReading;
  // 元素の色と環の角度は、結果画面（index.html の ELEMENTS・ELEMENT_RING_ANGLE）と同じ
  var EL_COLOR = { '炎': '#c84a20', '水': '#2a7aaa', '氷': '#4a80c0', '雷': '#9040d0', '風': '#3a8a60', '岩': '#a07830', '草': '#4a8020' };
  var RING = { '炎': 20, '水': -15, '氷': 0, '雷': 35, '風': -30, '岩': 10, '草': -5 };
  // 結果画面と同じ宝石の惑星（カット入りの宝石と環）
  function gemSvg(color, el) {
    var id = 'gm-' + el.charCodeAt(0);
    return '<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">'
      + '<stop offset="0%" stop-color="#fff" stop-opacity=".85"/><stop offset="45%" stop-color="' + color + '"/><stop offset="100%" stop-color="' + color + '" stop-opacity=".55"/></linearGradient></defs>'
      + '<ellipse cx="28" cy="28" rx="26" ry="8" fill="none" stroke="' + color + '" stroke-width="1.3" opacity=".55" transform="rotate(' + RING[el] + ' 28 28)"/>'
      + '<ellipse cx="28" cy="28" rx="26" ry="8" fill="none" stroke="' + color + '" stroke-width=".6" stroke-dasharray="1 3" opacity=".35" transform="rotate(' + RING[el] + ' 28 28)"/>'
      + '<g stroke="#ffffffa0" stroke-width=".6" stroke-linejoin="round"><polygon points="28,10 36,20 28,24 20,20" fill="url(#' + id + ')"/>'
      + '<polygon points="20,20 28,24 26,40 15,30" fill="' + color + '" opacity=".88"/><polygon points="36,20 28,24 30,40 41,30" fill="' + color + '" opacity=".72"/>'
      + '<polygon points="26,40 30,40 28,46" fill="' + color + '" opacity=".6"/><polygon points="28,10 36,20 32,17" fill="#fff" opacity=".4"/></g></svg>';
  }
  var WEAPON_LABEL = { '長柄': '長柄武器' };
  // 漢字の名前の読み（五十音順に並べるため）
  var READING = { '嘉明': 'がみん', '辛炎': 'しんえん', '胡桃': 'ふーたお', '香菱': 'しゃんりん', '煙緋': 'えんひ', '宵宮': 'よいみや', '神里綾人': 'かみさとあやと', '行秋': 'ゆくも', '夜蘭': 'いぇらん',
    '珊瑚宮心海': 'さんごのみやここみ', '神里綾華': 'かみさとあやか', '七七': 'なな', '申鶴': 'しぇんは', '甘雨': 'かんう', '刻晴': 'こくせい', '久岐忍': 'くきしのぶ', '雷電将軍': 'らいでんしょうぐん',
    '九条裟羅': 'くじょうさら', '八重神子': 'やえみこ', '北斗': 'ほくと', '楓原万葉': 'かえではらかずは', '早柚': 'さゆ', '放浪者': 'ほうろうしゃ', '閑雲': 'かんうん', '藍硯': 'らんやん',
    '鹿野院平蔵': 'しかのいんへいぞう', '夢見月瑞希': 'ゆめみづきみずき', '鍾離': 'しょうり', '雲菫': 'うんきん', '荒瀧一斗': 'あらたきいっと', '茲白': 'つーばい', '千織': 'ちおり', '凝光': 'ぎょうこう',
    '白朮': 'びゃくじゅつ', '綺良々': 'きらら', '魈': 'しょう', '重雲': 'ちょううん' };
  var ROWS = [['あ', 'あいうえおぁぃぅぇぉゔ'], ['か', 'かきくけこがぎぐげご'], ['さ', 'さしすせそざじずぜぞ'], ['た', 'たちつてとだぢづでどっ'], ['な', 'なにぬねの'],
    ['は', 'はひふへほばびぶべぼぱぴぷぺぽ'], ['ま', 'まみむめも'], ['や', 'やゆよゃゅょ'], ['ら', 'らりるれろ'], ['わ', 'わをん']];
  function hira(s) { return String(s).replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }
  function readingOf(name) { return READING[name] || hira(name); }
  function rowOf(name) { var c = readingOf(name).charAt(0); var r = ROWS.find(function (x) { return x[1].indexOf(c) >= 0; }); return r ? r[0] : '他'; }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var NONE = '__none__';
  var state = { element: null, weapon: null, nation: undefined, character: NONE, plan: 'analysis' };

  function pressGroup(box, btn) {
    box.querySelectorAll('[aria-pressed]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === btn)); });
    box.classList.add('has-pick');
  }
  var elBox = document.querySelector('[data-group="element"]');
  elBox.innerHTML = T.ELEMENTS.map(function (e) {
    return '<button type="button" class="orb" aria-pressed="false" data-v="' + e + '" style="--c:' + EL_COLOR[e] + '"><span class="g">' + gemSvg(EL_COLOR[e], e) + '</span><span class="n">' + e + '</span></button>';
  }).join('');
  var wpBox = document.querySelector('[data-group="weapon"]');
  wpBox.innerHTML = T.WEAPONS.map(function (w) {
    return '<button type="button" class="card" aria-pressed="false" data-v="' + w + '"><span>' + esc(WEAPON_LABEL[w] || w) + '</span></button>';
  }).join('');
  var naBox = document.querySelector('[data-group="nation"]');
  naBox.innerHTML = T.NATIONS.map(function (n) {
    return '<button type="button" class="card" aria-pressed="false" data-v="' + n + '"><span>' + esc(n) + '</span></button>';
  }).join('') + '<button type="button" class="card unknown" aria-pressed="false" data-v="' + NONE + '"><span>覚えていない</span></button>';

  elBox.addEventListener('click', function (e) {
    var b = e.target.closest('.orb'); if (!b) return;
    state.element = b.getAttribute('data-v'); pressGroup(elBox, b);
    document.documentElement.style.setProperty('--ac', EL_COLOR[state.element]);
    sync();
  });
  wpBox.addEventListener('click', function (e) { var b = e.target.closest('.card'); if (!b) return; state.weapon = b.getAttribute('data-v'); pressGroup(wpBox, b); sync(); });
  naBox.addEventListener('click', function (e) { var b = e.target.closest('.card'); if (!b) return; var v = b.getAttribute('data-v'); state.nation = v === NONE ? null : v; pressGroup(naBox, b); sync(); });
  document.querySelector('[data-group="plan"]').addEventListener('click', function (e) {
    var b = e.target.closest('.plan'); if (!b) return; state.plan = b.getAttribute('data-v'); pressGroup(e.currentTarget, b);
  });

  var charSec = document.getElementById('charSec'), list = document.getElementById('charList');
  function typeReady() { return !!(state.element && state.weapon && state.nation !== undefined); }
  function drawChars() {
    if (!typeReady()) { charSec.setAttribute('aria-disabled', 'true'); list.innerHTML = '<p class="chars-empty">元素・武器種・国家を選ぶと表示されます</p>'; return; }
    charSec.removeAttribute('aria-disabled');
    // 選んだタイプで一致度1位になり得る人物だけ（選ぶと、その人物が一致度1位の読み解きになる）
    var allowed = T.candidatesFor(state.element, state.weapon, state.nation);
    if (state.character !== NONE && allowed.indexOf(state.character) < 0) state.character = NONE;
    var sorted = allowed.slice().sort(function (a, b) { return readingOf(a).localeCompare(readingOf(b), 'ja'); });
    var groups = {};
    sorted.forEach(function (n) { var r = rowOf(n); (groups[r] = groups[r] || []).push(n); });
    var chip = function (v, label, extra) { return '<button type="button" class="chip' + (extra || '') + '" aria-pressed="' + (state.character === v) + '" data-v="' + esc(v) + '">' + esc(label) + '</button>'; };
    var html = '<div class="kana-row"><span class="k"></span><div class="chips">' + chip(NONE, '覚えていない', ' unknown') + '</div></div>';
    ROWS.map(function (r) { return r[0]; }).concat(['他']).forEach(function (r) {
      if (!groups[r]) return;
      html += '<div class="kana-row"><span class="k">' + r + '</span><div class="chips">' + groups[r].map(function (n) { return chip(n, n); }).join('') + '</div></div>';
    });
    list.innerHTML = html;
  }
  list.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    state.character = b.getAttribute('data-v');
    list.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  });

  var reveal = document.getElementById('revealBtn');
  function sync() { drawChars(); reveal.disabled = !typeReady(); }
  sync();
  reveal.addEventListener('click', function () {
    if (!typeReady()) return;
    var q = 'type=' + encodeURIComponent([state.element, state.weapon, state.nation || '-'].join('.'))
      + (state.character !== NONE ? '&char=' + encodeURIComponent(state.character) : '') + '&product=' + state.plan;
    var f = document.getElementById('flash');
    f.classList.add('on');
    reveal.disabled = true;
    setTimeout(function () { location.assign('/report.html?' + q); }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 900);
  });
})();
</script>
</body>
</html>
