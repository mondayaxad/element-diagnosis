<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>元素診断｜はじめてのログイン</title>
</head>
<body style="margin:0;padding:0;background-color:#070912;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#070912;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#0e1222;border:1px solid #232a44;border-radius:14px;">
        <tr>
          <td align="center" style="padding:36px 28px 8px;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;">
            <div style="font-size:11px;letter-spacing:4px;color:#7f8fb5;">ELEMENT&nbsp;DIAGNOSIS</div>
            <div style="font-size:12px;letter-spacing:10px;color:#3f4a6e;margin-top:10px;">&#x2726;&nbsp;&#x2727;&nbsp;&#x2726;</div>
            <h1 style="margin:14px 0 0;font-size:22px;font-weight:700;letter-spacing:4px;color:#eef2fb;">はじめてのログイン</h1>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 28px 0;font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;font-size:13px;line-height:1.9;color:#a9b4cf;">
            元素診断へようこそ。<br>下の6桁のコードを入力すると、<br>あなたの診断記録をはじめられます。
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 28px 8px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background-color:#080b17;border:1px solid #34406a;border-radius:10px;padding:18px 26px;">
                  <div style="font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;font-size:11px;letter-spacing:3px;color:#7f8fb5;margin-bottom:8px;">ログインコード</div>
                  <div style="font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:10px;color:#f3e7c2;">{{ .Token }}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:14px 28px 0;font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;font-size:12px;line-height:1.9;color:#8792b0;">
            有効期限は<span style="color:#c9d3ea;">60分</span>です。コードは1回だけ使えます。
          </td>
        </tr>
        <tr>
          <td style="padding:26px 28px 0;">
            <div style="height:1px;line-height:1px;font-size:0;background-color:#232a44;">&nbsp;</div>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 28px 32px;font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;font-size:11px;line-height:1.9;color:#5f6987;">
            心当たりがない場合は、このメールを破棄してください。<br>コードを入力しない限り、ログインは行われません。<br>コードは誰にも教えないでください。<br>
            <span style="color:#7f8fb5;">元素診断</span>&nbsp;&middot;&nbsp;このメールは送信専用です（返信できません）
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
